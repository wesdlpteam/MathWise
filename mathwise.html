<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MathWISE — Wesley College Mathematics</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Noto+Sans+Egyptian+Hieroglyphs&family=Noto+Sans+Cuneiform&display=swap" rel="stylesheet">
<style>
:root{
  --purple:#4F2759; --purple-deep:#3A1C42; --mist:#F4F0F6;
  --gold:#C59F40; --gold-deep:#A6842F; --gold-mist:#FBF7EC;
  --ink:#241C27; --slate:#6B6270; --rule:#E4DEE7; --paper:#fff;
  /* Figtree has no glyphs for historic number systems (Egyptian hieroglyphs,
     cuneiform) a student might ask about, so without an explicit fallback the
     browser silently substitutes its own — usually far smaller and thinner
     than the surrounding text. Naming a proper font for each here means those
     characters render at their intended size instead of an arbitrary guess. */
  --sans:'Figtree','Noto Sans Egyptian Hieroglyphs','Noto Sans Cuneiform',
    -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{max-width:1060px;margin:0 auto;padding:26px 22px 70px}
h1,h2,h3,h4{font-family:var(--sans);font-weight:600;color:var(--purple);margin:0;
  letter-spacing:-.015em}
h1{font-size:1.75rem}
h2{font-size:1.35rem;margin-bottom:.4rem}
h3{font-size:1.12rem}
p{margin:0 0 .7rem}
.muted{color:var(--slate);font-size:.9rem}
.small{font-size:.82rem;color:var(--slate)}
.gold-rule{height:3px;width:68px;background:var(--gold);border-radius:2px;margin:.5rem 0 0}
.motto{color:var(--gold-deep);font-size:.92rem;font-weight:500}
.wordmark{font-family:var(--sans);font-weight:700;color:var(--purple);letter-spacing:-.03em;line-height:1}
.wordmark .wise{color:var(--gold-deep)}

/* landing */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:32px;align-items:center;
  border-bottom:1px solid var(--rule);padding-bottom:26px;margin-bottom:26px}
.hero .wordmark{font-size:3.2rem}
.hero .tagline{font-size:1.2rem;font-weight:500;color:var(--gold-deep);margin:4px 0 0}
.hero .pitch{font-size:1.05rem;line-height:1.6;margin:16px 0 0;max-width:44ch}
.hero-art{border:1px solid var(--rule);border-radius:6px;background:#FCFBFD;padding:10px}
.hero-art > svg{display:block;width:100%;height:auto}

.feats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px}
.feat{border:1px solid var(--rule);border-top:3px solid var(--gold);border-radius:4px;padding:14px 15px}
.feat svg{width:24px;height:24px;display:block;margin-bottom:8px}
.feat h4{font-size:.98rem;margin-bottom:3px}
.feat p{font-size:.86rem;color:var(--slate);margin:0;line-height:1.45}

.startbox{border:1px solid var(--rule);border-left:4px solid var(--purple);border-radius:0 4px 4px 0;
  background:var(--mist);padding:20px 22px;max-width:560px}
.startbox h3{margin-bottom:4px}
.startbox .hint{font-size:.84rem;color:var(--slate);margin:8px 0 0}
.startbox .row{align-items:flex-end}
.startbox input{background:#fff}

.taste{margin:26px 0 0}
.taste h4{font-size:1rem;margin-bottom:8px}

.empty{border:1px dashed var(--rule);border-radius:4px;padding:18px 20px;margin-bottom:18px;
  background:#FCFBFD}
.empty h4{font-size:1.05rem;margin-bottom:4px}
.empty p{font-size:.9rem;color:var(--slate);margin-bottom:12px}

/* masthead */
.app-head{position:sticky;top:0;z-index:5;background:var(--paper)}
.masthead{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;
  border-bottom:1px solid var(--rule);padding-bottom:14px;margin-bottom:20px;flex-wrap:wrap}
.masthead .sub{color:var(--slate);font-size:.88rem;margin-top:2px}
.course-pick{text-align:right;font-size:.84rem;color:var(--slate)}
.course-pick select{width:auto;min-width:210px;margin-top:4px}
.badge{display:inline-block;background:var(--mist);border:1px solid var(--rule);
  border-left:3px solid var(--gold);padding:4px 9px;font-size:.82rem;color:var(--purple);border-radius:3px}

/* buttons */
button{font-family:var(--sans);font-size:.94rem;border-radius:3px;cursor:pointer;
  padding:9px 16px;transition:background .12s,border-color .12s,color .12s}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button[disabled]{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--gold);border:1px solid var(--gold);color:#2A2110;font-weight:600}
.btn-primary:hover:not([disabled]){background:var(--gold-deep);border-color:var(--gold-deep);color:#fff}
.btn-secondary{background:#fff;border:1px solid var(--purple);color:var(--purple);font-weight:500}
.btn-secondary:hover:not([disabled]){background:var(--mist)}
.btn-quiet{background:none;border:1px solid var(--rule);color:var(--slate);font-weight:500}
.btn-quiet:hover:not([disabled]){border-color:var(--purple);color:var(--purple)}
.row{display:flex;gap:10px;flex-wrap:wrap}

/* inputs */
input[type=text],textarea,select{width:100%;font-family:var(--sans);font-size:.95rem;
  padding:10px 12px;border:1px solid var(--rule);border-radius:3px;background:#fff;color:var(--ink)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--purple)}
label{display:block;font-size:.86rem;color:var(--slate);margin:0 0 5px}
.field{margin-bottom:14px}

/* tabs */
.tabs{display:flex;border-bottom:1px solid var(--rule);margin-bottom:22px;overflow-x:auto}
.tab{background:none;border:none;border-bottom:3px solid transparent;padding:10px 18px;
  font-size:.97rem;font-weight:500;color:var(--slate);white-space:nowrap}
.tab[aria-selected=true]{color:var(--purple);border-bottom-color:var(--gold)}

/* cards & panels */
.card{border:1px solid var(--rule);border-radius:4px;padding:16px 18px;margin-bottom:14px}
.card.pending{background:#FBFAFC;border-style:dashed}
.card h4{font-size:1.06rem;margin-bottom:4px}
.card p{font-size:.9rem;color:var(--slate);margin:0}
.card .stage{font-size:.78rem;color:var(--gold-deep);margin-top:8px}
.skill{border:1px solid var(--rule);border-top:3px solid var(--purple);border-radius:4px;
  padding:16px 18px;margin-bottom:14px}
.skill h4{font-size:1.05rem;margin-bottom:6px}
.skill p{font-size:.92rem;margin-bottom:.5rem}
.skill ul{margin:0 0 .3rem;padding-left:20px;font-size:.92rem}
.skill li{margin-bottom:4px}
.skill .tie{font-size:.82rem;color:var(--gold-deep);margin-top:8px}

/* chat */
.msg{margin-bottom:18px;display:flex;gap:12px}
.who{flex:0 0 34px;height:34px;border-radius:50%;display:grid;place-items:center;
  font-size:.78rem;font-weight:600}
.msg.user .who{background:var(--mist);color:var(--purple)}
.msg.bot .who{background:var(--purple);color:#fff}
.bubble{flex:1;min-width:0}
.msg.user .bubble{background:var(--mist);border-radius:4px;padding:10px 14px}
.bubble h4{margin:0 0 8px;font-size:1.08rem}
.bubble .lead{font-size:.8rem;color:var(--gold-deep);margin:12px 0 4px;font-weight:600;
  letter-spacing:.02em}
.bubble ul{margin:0 0 10px;padding-left:20px}
.bubble li{margin-bottom:4px}
.katex-display{margin:.65em 0;overflow-x:auto;overflow-y:hidden}
.composer{display:flex;gap:10px;margin-top:8px}
.composer input{flex:1}
.thinking{color:var(--slate);font-size:.9rem;font-style:italic}
.err{color:#8C2F39;font-size:.9rem}

/* headings and rules inside an answer */
.bubble h2.ans-h,.bubble h3.ans-h,.bubble h4.ans-h{margin:16px 0 6px;color:var(--purple)}
.bubble h2.ans-h{font-size:1.16rem}
.bubble h3.ans-h{font-size:1.08rem}
.bubble h4.ans-h{font-size:1rem}
.bubble hr.rule{border:0;border-top:1px solid var(--rule);margin:18px 0}
.bubble ol{margin:0 0 10px;padding-left:22px}
.bubble ol li{margin-bottom:4px}

/* tables — frequency, two-way, grouped data */
.tablewrap{overflow-x:auto;margin:14px 0}
table.mw-table{border-collapse:collapse;width:100%;font-size:.94rem;background:#fff}
table.mw-table th{background:var(--mist);color:var(--purple);font-weight:600;text-align:left;
  padding:9px 12px;border:1px solid var(--rule);border-bottom-width:2px;white-space:nowrap}
table.mw-table td{padding:8px 12px;border:1px solid var(--rule)}
table.mw-table td.num{text-align:right;font-variant-numeric:tabular-nums}
table.mw-table tbody tr:nth-child(even){background:#FCFBFD}
table.mw-table tr.total{background:var(--gold-mist)}
table.mw-table tr.total td{font-weight:600;border-top:2px solid var(--gold)}

/* figures */
.figure{border:1px solid var(--rule);border-radius:4px;background:#fff;
  padding:12px 14px 8px;margin:14px 0}
.figure .cap{font-size:.84rem;color:var(--slate);margin:6px 0 0;text-align:center}
.figure svg{display:block;width:100%;height:auto;max-width:100%}
.figure .broken{font-size:.85rem;color:#8C2F39;margin:0}

/* the maths field: what students see is the rendered maths, not LaTeX.
   A real input sits transparently on top so typing, selection, Tab and
   mobile keyboards all still work. */
.mathfield{position:relative;flex:1;min-width:0;border:1px solid var(--rule);
  border-radius:3px;background:#fff;min-height:46px;cursor:text}
.mathfield:focus-within{border-color:var(--purple)}
.mf-render{padding:11px 13px;min-height:44px;overflow-x:auto;overflow-y:hidden;
  font-size:1.02rem;line-height:1.5}
.mf-ghost{color:#9A93A0}
/* Specificity matters here: the generic input[type=text] rule above would
   otherwise win and paint this opaque white over the rendered maths. */
.mathfield input.mf-input,
input.mf-input[type=text]{position:absolute;left:0;top:0;width:100%;height:100%;
  padding:11px 13px;margin:0;border:0 none;border-radius:0;background:transparent;
  background-color:transparent;color:transparent;caret-color:transparent;
  font-size:1.02rem;outline:none;box-shadow:none;-webkit-text-fill-color:transparent}
.mathfield input.mf-input:focus{border:0 none;outline:none}
.mathfield input.mf-input::selection{background:transparent}
.mathfield input.mf-input::-moz-selection{background:transparent}
.mathfield .katex{font-size:1.05em}
/* with the keyboard open the bar grows into the preview: one display, not two */
.mathfield.is-panel{border-top:3px solid var(--gold);background:#FCFBFD;min-height:88px}
.mathfield.is-panel .lab{font-size:.72rem;font-weight:600;color:var(--gold-deep);
  letter-spacing:.04em;text-transform:uppercase;padding:9px 13px 0}
.mathfield.is-panel .mf-render{padding:6px 13px 14px;font-size:1.22rem;min-height:56px}
.mathfield.is-panel input.mf-input{top:28px;height:calc(100% - 28px);font-size:1.22rem}

.mf-caret{animation:mfblink 1.05s step-end infinite}
.mf-text-caret{display:inline-block;width:1.5px;height:1.05em;background:var(--purple);
  vertical-align:-0.16em;animation:mfblink 1.05s step-end infinite}
@keyframes mfblink{50%{opacity:0}}
@media(prefers-reduced-motion:reduce){.mf-caret,.mf-text-caret{animation:none}}

/* maths keyboard */
.kb{border:1px solid var(--rule);border-top:3px solid var(--gold);border-radius:4px;
  margin:10px 0 16px;background:#FCFBFD}
.kb-tabs{display:flex;flex-wrap:wrap;gap:0;border-bottom:1px solid var(--rule);padding:0 6px}
.kb-tab{background:none;border:none;border-bottom:2px solid transparent;padding:8px 12px;
  font-size:.85rem;font-weight:500;color:var(--slate)}
.kb-tab[aria-selected=true]{color:var(--purple);border-bottom-color:var(--gold)}
.kb-grid{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px}
.kb-key{min-width:44px;height:40px;padding:0 10px;background:#fff;border:1px solid var(--rule);
  border-radius:3px;color:var(--ink);font-size:.95rem;display:inline-flex;align-items:center;
  justify-content:center;line-height:1}
.kb-key:hover{border-color:var(--gold);background:var(--gold-mist)}
.kb-key .katex{font-size:1em}
.kb-key.wide{min-width:64px}
.kb-edit{display:flex;gap:6px;padding:0 12px 10px;flex-wrap:wrap;align-items:center}
.kb-edit button{height:34px;padding:0 12px;font-size:.85rem}
.kb-edit .note{font-size:.78rem;color:var(--slate);margin:0 0 0 auto}
.kb-preview{border:1px solid var(--rule);border-radius:3px;background:#fff;padding:10px 12px;
  margin:0 0 12px;min-height:44px;overflow-x:auto}
.kb-preview .lab{font-size:.72rem;font-weight:600;color:var(--gold-deep);letter-spacing:.04em;
  text-transform:uppercase;margin-bottom:4px}

/* print / save as PDF — the only export route a sandboxed frame allows.
   KaTeX prints as real vector text this way, not as a screenshot. */
#printarea{display:none}
.p-head{border-bottom:2px solid #4F2759;padding-bottom:10px;margin-bottom:18px}
.p-head h1{font-size:1.5rem;margin:0 0 2px}
.p-head .who{font-size:.9rem;color:#555}
.p-foot{margin-top:22px;padding-top:8px;border-top:1px solid #ccc;font-size:.75rem;color:#666}

@media print{
  .wrap{display:none !important}
  #printarea{display:block !important}
  @page{margin:16mm}
  body{background:#fff;font-size:11.5pt}
  .mm-card,.mm-eg,.figure,.msg,.ct-step,.plan,table.mw-table{page-break-inside:avoid;break-inside:avoid}
  .mm-card{border-left-width:3px}
  .figure svg{max-height:8cm}
  a{text-decoration:none;color:inherit}
}

/* copy panel — downloads are blocked in the sandbox, so text is copied out */
.copybox{border:1px solid var(--rule);border-left:4px solid var(--gold);border-radius:0 4px 4px 0;
  background:#FCFBFD;padding:16px 18px;margin:18px 0}
.copybox h4{font-size:1.05rem;margin-bottom:4px}
.copybox p{font-size:.86rem;color:var(--slate);margin:0 0 10px}
.copybox textarea{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:.82rem;line-height:1.5;background:#fff;min-height:200px;resize:vertical}
.copybox .done{color:#2F6B4F;font-size:.86rem;font-weight:500;margin:0}

/* mind maps */
.mm-head{border:1px solid var(--rule);border-top:3px solid var(--gold);border-radius:4px;
  padding:14px 16px;margin-top:16px;background:#FCFBFD}
.mm-head h3{font-size:1.2rem;margin-bottom:3px}
.mm-head p{font-size:.92rem;color:var(--slate);margin:0}
.mm-card{border:1px solid var(--rule);border-left:4px solid var(--purple);
  border-radius:0 4px 4px 0;padding:16px 18px;margin-top:14px;background:#fff}
.mm-card h4{font-size:1.08rem;margin-bottom:6px}
.mm-card .num{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;
  background:var(--purple);color:#fff;font-size:.76rem;font-weight:600;margin-right:8px;
  vertical-align:middle}
.mm-card .desc{font-size:.94rem;margin-bottom:10px}
.mm-sec{margin-top:12px}
.mm-sec .lab{font-size:.75rem;font-weight:600;color:var(--gold-deep);
  letter-spacing:.04em;text-transform:uppercase;margin-bottom:5px}
.mm-key{background:var(--gold-mist);border:1px solid #EFE3C8;border-radius:3px;
  padding:9px 12px;margin-bottom:6px;font-size:.95rem}
.mm-eg{background:var(--mist);border-radius:3px;padding:11px 13px}
.mm-eg .q{font-size:.93rem;font-weight:500;margin-bottom:7px}
.mm-steps{list-style:none;margin:0;padding:0;counter-reset:st}
.mm-steps li{counter-increment:st;font-size:.93rem;padding:3px 0 3px 26px;position:relative}
.mm-steps li::before{content:counter(st);position:absolute;left:0;top:4px;width:17px;height:17px;
  border-radius:50%;background:#fff;border:1px solid var(--rule);color:var(--slate);
  font-size:.7rem;display:grid;place-items:center}
.mm-do{margin:0;padding-left:20px;font-size:.93rem}
.mm-do li{margin-bottom:4px}
.mm-card .figure{margin:10px 0 0}

/* colour therapy */
.ct-steps{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0 18px}
.ct-step{border-radius:4px;padding:12px 14px;border-left:5px solid}
.ct-step h5{margin:0 0 3px;font-size:.95rem;font-weight:600;font-family:var(--sans)}
.ct-step p{margin:0;font-size:.86rem;line-height:1.45}
.ct-green {background:#E6F6EC;border-color:#3F9B6D}
.ct-green h5{color:#2F6B4F}
.ct-orange{background:#FDF0E2;border-color:#D98A3A}
.ct-orange h5{color:#9A5D18}
.ct-red   {background:#FDE9E8;border-color:#D14840}
.ct-red h5{color:#9C2F2A}
.ct-blue  {background:#ECEDFA;border-color:#6E74C4}
.ct-blue h5{color:#454BA0}
.ct-counts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.ct-counts label{font-weight:600}
.helpers{display:flex;gap:14px;flex-wrap:wrap;margin:4px 0 14px}
.helpers label{display:flex;align-items:center;gap:6px;font-size:.9rem;color:var(--ink);margin:0}
.helpers input{width:auto}
.plan{border:1px solid var(--rule);border-left:3px solid var(--purple);border-radius:0 3px 3px 0;
  background:#FCFBFD;padding:14px 16px;margin-top:14px}
.upload-out{border:1px solid var(--rule);border-radius:4px;padding:14px 16px;margin-top:14px}
.upload-out img{max-width:220px;border:1px solid var(--rule);border-radius:3px;float:right;margin:0 0 10px 14px}
.fb-item{border:1px solid var(--rule);border-left:4px solid var(--purple);border-radius:0 4px 4px 0;
  padding:14px 16px;margin-top:14px;background:#fff}
.fb-item .stamp{display:flex;justify-content:space-between;align-items:center;gap:10px;
  font-size:.8rem;color:var(--slate);margin-bottom:8px}
.fb-item .stamp .n{font-weight:600;color:var(--purple)}
.fb-item img{max-width:190px;border:1px solid var(--rule);border-radius:3px;float:right;margin:0 0 10px 14px}
.fb-item button{padding:5px 10px;font-size:.8rem}
.fb-count{font-size:.85rem;color:var(--slate);margin:10px 0 0}

@media(max-width:700px){
  .ct-steps,.ct-counts{grid-template-columns:1fr}
  .upload-out img{float:none;display:block;margin:0 0 12px}
}

/* spoken summary */
.speech{border:1px solid var(--rule);border-left:3px solid var(--gold);
  border-radius:0 3px 3px 0;background:#FCFBFD;padding:14px 16px;margin:0 0 16px}
.speech h4{font-size:1rem;margin-bottom:6px}
.speech .script{font-size:.93rem;line-height:1.6;margin:0 0 12px}
.speech .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.speech select{width:auto;min-width:150px;padding:7px 10px;font-size:.86rem}

/* intake */
.intake{border:1px solid var(--rule);border-radius:4px;padding:14px 16px;margin-bottom:20px}
.review{display:grid;grid-template-columns:2fr 3fr;gap:20px;margin-top:6px}
.review img{width:100%;border:1px solid var(--rule);border-radius:3px}
.flag{border-left:3px solid var(--gold);background:var(--gold-mist);padding:9px 12px;
  font-size:.85rem;margin-bottom:10px;border-radius:0 3px 3px 0}
.flag ul{margin:4px 0 0;padding-left:18px}
.preview{border:1px solid var(--rule);border-radius:3px;padding:10px 12px;margin-top:10px;
  background:#FCFBFD;min-height:44px}
.readout{border:1px solid var(--rule);border-left:3px solid var(--purple);border-radius:0 3px 3px 0;
  background:#FCFBFD;padding:11px 13px;font-size:.95rem;line-height:1.55;max-height:300px;overflow:auto}
.readout table.mw-table{font-size:.86rem}
.qshot{max-width:640px;border:1px solid var(--rule);border-radius:3px;display:block}
.conf-high{color:#2F6B4F}.conf-medium{color:#8A6A1F}.conf-low{color:#8C2F39}

@media(max-width:900px){
  .feats{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:760px){
  .hero{grid-template-columns:1fr;gap:20px}
  .hero .wordmark{font-size:2.5rem}
  .hero-art{order:-1}
  .review{grid-template-columns:1fr}
  .wrap{padding:20px 16px 52px}
  .masthead{flex-direction:column}
  .course-pick{text-align:left}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<div id="printarea"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script>
/* ------------------------------------------------------------------ *
 * MathWISE — Mathematics Faculty, Wesley College Glen Waverley
 * "Dare to solve."
 * ------------------------------------------------------------------ */

const MODEL = "claude-sonnet-4-6";

/* --- Courses -------------------------------------------------------- *
 * Setting a course is optional. Questions work without one; the course
 * only sharpens notation, technology assumptions and phrasing.
 * ------------------------------------------------------------------ */

const FACULTY_CONVENTIONS = [
  "Intervals of strict increase or decrease include the turning point. Use closed (square) brackets. Never give an open interval derived from solving f'(x) > 0.",

  standard way to justify doing the same to both sides. Two steps at most.

function courseOf(key){ return COURSES.find(c => c.key === key) || COURSES[0]; }

function courseContext(key){
  const c = courseOf(key);
  if (!c.key){
    return [
      "The student has not said which course they are in. Judge the level from the",
      "question itself and answer at that level. If the level genuinely changes the",
      "method or the notation, say which one you have assumed in a single short line.",
      "",
      "Faculty conventions, which override your own defaults:",
      ...FACULTY_CONVENTIONS.map(r => `- ${r}`),
      "",
      "How to pitch the explanation:",
      TEACHING_UNSET
    ].join("\n");
  }
  let out = [
    `The student studies ${c.name} (${c.band}) at Wesley College, Glen Waverley.`,
    `Curriculum: ${c.curriculum}`,
    `Technology assumed: ${c.tech}`,
    `Assessed by: ${c.assess}`,
    ``,
    `Faculty conventions, which override your own defaults:`,
    ...FACULTY_CONVENTIONS.map(r => `- ${r}`)
  ];
  if (c.notes.length) out.push(``, `Specific to ${c.short}:`, ...c.notes.map(n => `- ${n}`));
  out.push(``, `How to explain at this level:`,
    TEACHING[c.key] || (c.band === "MYP" ? TEACHING_UNSET : TEACHING_SENIOR));
  return out.join("\n");
}

When a photographed diagram carries exact data you must read off it — dot counts, bar heights, table values, tally marks, the vertices of a shape plotted on a coordinate grid, or the footprint and stack heights of a cube arrangement — and the question's answer depends on that exact reading, not just the diagram's general shape: read it carefully and state the values you are using before working from them, so a misreading is visible and correctable rather than hidden inside a confident final answer. Count things like dot-plot stacks one at a time rather than estimating by eye; for a shape on a grid, count grid squares out from the axes for each vertex individually rather than eyeballing its position, and re-check each side length against the picture before moving on. For a stacked-cube solid, work out how many rows deep it actually is before anything else — a photo can make a one-row arrangement look deeper than it is — and count each column's own height separately, writing down each one's actual number rather than assuming the heights form a smooth, evenly-increasing staircase: most such solids are mostly flat with only one or two columns taller, not a regular progression, and drawing a tidy staircase because it looks more three-dimensional is exactly the kind of invented shape this rule exists to stop. If a value is genuinely unclear in the photo, say so and ask the student to confirm it rather than guessing a plausible-looking number.`;

plot — xmin, xmax, optional ymin/ymax, curves:[{expr,label,from,to} | {vertical,label}], optional points:[{x,y,label,open}], vlines:[{x,label}], hlines:[{y,label}], shade:[{from,to,curve,toCurve,label}], vectors:[{to:{x,y},from:{x,y},label}].
  A curve's own from/to restrict it to a sub-range of [xmin,xmax] instead of the whole axis — use this
  for a PIECEWISE LINEAR GRAPH, giving one curve entry per interval (e.g. {expr:"50+40*x",from:0,to:3}
  and {expr:"80+30*x",from:3,to:8} for a rule that changes at x=3) rather than one expr drawn across the
  whole domain. A STEP GRAPH is the same idea with each piece's own expr a constant (a horizontal
  segment) instead of a sloped line, PLUS a point at each jump showing which end is included: give the
  included endpoint as an ordinary point:{x,y,label} (drawn filled) and the excluded endpoint on the
  other side of the same jump as point:{x,y,open:true} (drawn as an unfilled circle) — the standard
  closed-circle/open-circle convention for a discontinuous graph.
  expr uses x and: + - * / ^ ( ) and sin cos tan asin acos atan exp ln log sqrt abs, with pi and e. Always write * for multiplication: 2*x, never 2x.
  sin/cos/tan take RADIANS, not degrees, so a graph of y = sin(x°) over x = 0 to 360 (a common Year 10
  trig question) must be written as sin(x*pi/180) — never sin(x) with x running 0-360, which computes
  complete nonsense (over 50 full oscillations, not one smooth wave). asin/acos/atan likewise RETURN

  Reading the source photo for this one specifically has a reliable failure mode worth guarding
  against directly: it is easy to catch the overall silhouette (e.g. "it rises like a staircase") and
  turn that impression straight into an evenly-increasing sequence, which is very often not what is

  This specific reading has turned out unreliable even when careful — always show the heights grid
  you read (as a small row/column list, not just the finished picture) and ask the student to check it
  against their own copy of the question before treating the drawn solid as correct, every single time,
  regardless of how confident the reading feels. Do this even when nothing about the image seemed
  unclear — confidence has not been a reliable signal for this figure type specifically.

Pictorial models. These teach the idea rather than illustrate the answer, and are the
right choice for Years 7 to 9:

balance — an equation as a set of scales: left:[{kind:"var",count:3,label:"x"},{kind:"unit",count:2,label:"1"}], right:[{kind:"unit",count:11,label:"1"}], optional leftLabel, rightLabel.
  Use for equations solved by doing the same to both sides.
backtrack — a backtracking flow chart: start:"x", steps:[{op:"x 3",inverse:"/ 3",value:"3x"},{op:"+ 2",inverse:"- 2",value:"17"}].
  Forward arrows show what the equation does to x; the dashed arrows below show how to undo it. The standard Year 7 method.
barmodel — part-whole strips: rows:[{label:"Cost",parts:[{value:3,label:"x",highlight:true},{value:5,label:"5"}],total:"20"}].
  Use for word problems, fractions of an amount, ratios and comparisons.
numberline — min, max, optional step, marks:[{at,label,answer:true}], jumps:[{from,to,label}].
  Use for integers, inequalities, rounding, and counting on.
  Mark answer:true only on the specific value(s) the question actually asks for — those are drawn
  larger and in gold so they stand out. Any other point you plot along the way (e.g. every fifth,
  to show how you counted along) should be a plain mark with no answer flag, so it stays visually
  secondary to the actual answer rather than looking identical to it.
areamodel — rows:["x","3"], cols:["x","2"], cells:[["x^2","2x"],["3x","6"]], optional result:"x^2+5x+6".
  Use for expanding brackets, binomial products and factorising. Cell text is plain, not LaTeX.
fractionbar — bars:[{parts:8,shaded:3,label:"3/8", optional rows, optional cols}].
  Use for fractions, equivalence and percentages. Cells shade in order, first cell to last.
  Leaving rows out (or rows:1) draws the usual single strip of parts equal rectangles. Set rows for
  any other equal-area arrangement of the same parts — rows:4 draws 4 equal horizontal strips instead
  of 1 row of 4 columns; rows:2 with cols:2 draws a 2x2 grid (a square cut into quarters). A "show the
  same fraction represented different ways" question needs one figure per way — call this once per
  way with the arrangement that way actually describes, never describe an arrangement in words.
piefraction — the same idea as fractionbar, but a circle cut into equal wedges from the centre
  instead of a row of rectangles: pies:[{parts:8,shaded:3,label:"3/8"}].
  If the question's own diagram is a circle (a pizza, a pie chart, a clock face), reproduce it as a
  circle with this type — never substitute fractionbar's rectangles for a shape the question actually
  drew as a circle. Shading starts from the top and goes clockwise.
equivfrac — an equivalent-fractions working: from:{num,den}, to:{num,den}, op (e.g. "\\times 4" or
  "\\div 2"). Draws the two fractions with a curved arrow over the numerators and another under the
  denominators, both labelled with op — the standard way a student is shown that the same operation
  was applied to top and bottom. Both fractions must already be fully known numbers by this point
  (this draws the working, not a blank to fill in).
shortdivision — the short-division bracket a student writes by hand: dividend, divisor, optional label,
  optional setup:true. Give the plain whole numbers — the app works out the quotient and draws the
  small carried-remainder digits itself, so the arithmetic can never disagree with the picture. Use for
  "use the short division algorithm" or "use short division to find the quotient and remainder"
  questions.
  For a student's own question that hasn't been solved yet, call this TWICE across the conversation,
  not once: first with setup:true, which draws only the bare bracket (divisor and dividend, nothing
  worked out) — say nothing about the quotient or any carry in words either, and guide the student
  through the algorithm one hint at a time the normal tutoring way. Only call it again without
  setup (the fully worked bracket) once the student has solved it themselves or asked to see the full
  solution. When you're reproducing a worked example the source material already solved (an
  "Example N" from a textbook, where there's no answer left to protect), skip straight to the full
  worked bracket in one call, and keep the words around it short and tied to the picture: one line per
  digit worked out (e.g. "9 ÷ 4 = 2 remainder 1, so carry the 1" then "13 ÷ 4 = 3 remainder 1"...), not
  a paragraph explaining the whole algorithm — the bracket already shows every digit and carry, so
  don't re-describe the picture in prose, just narrate each step as it happens.
columnalgorithm — the written column algorithm for a whole-number add/subtract/multiply: op:"add"|
  "subtract"|"multiply", a, b (plain whole numbers, a >= b for subtract), optional setup:true. The app
  works out every digit, carry, and borrow itself: addition shows carries above the addends; subtraction
  shows a borrowed "1" above the column that received it and the reduced digit above the column that
  gave it away (cascading correctly back through a 0); multiplication shows carries for a single-digit
  b, or full shifted partial-product rows (with placeholder zeros) for a multi-digit b. Use whenever a
  question asks to use, show, or set out the column/written algorithm — never for mental strategies.
  setup:true draws only a and b with the operator and rule line — no carries, borrows, partial products
  or answer — for the same live-tutoring sequence as shortdivision's setup: show the bare setup first,
  work through it with the student, only call this again without setup once they've solved it or asked.
factortree — a prime factor tree: n:60, optional children:[{n},{n}] (exactly two, recursively, on any
  node that isn't left prime). A leaf (no children) is where that branch stops — it must actually be
  prime. Work the tree out yourself and give the whole structure; the app only draws it, it does not
  check or choose the factor pairs. After the figure, state the result as a separate line of LaTeX,
  e.g. $60 = 2 \\times 2 \\times 3 \\times 5 = 2^2 \\times 3 \\times 5$ — the tree is the working, that
  line is the answer.
stickpattern — a spatial/growing pattern built from sticks and dots, for "draw the next shape(s) in
  this pattern" questions: shape:"triangle" or "square", count (how many shapes in this term), optional
  shared:true, optional touching:true, optional label.
  There are three genuinely different pictures a photographed pattern might actually show, and picking
  the wrong one gives the wrong rule entirely, so look very carefully rather than assuming the most
  familiar version:
  - the default (no flags) — every shape is fully independent, standing apart with a visible gap.
    n triangles need 3n sticks.
  - touching:true — every shape is still fully independent (its own three sticks), but positioned so
    neighbouring corners land on exactly the same point with no gap — a vertex is shared, not a side.
    Still 3n sticks for n triangles; only the gap disappears, not a stick.
  - shared:true — an actual side is reused between neighbours (drawn once, not twice), the classic
    "each new triangle only needs 2 more sticks" chain. n triangles need 2n+1 sticks — noticeably
    fewer than the other two, because a real stick has been saved.
  Telling these apart from a photograph is genuinely hard to get right on sight, and guessing wrong
  teaches the wrong rule entirely — so unless it is unambiguous, do not guess and do not call this
  figure. Ask the student directly instead, as an ordinary hint: "Does each new shape touch the last
  one at a single point, share a whole side with it, or stand apart with a gap?" Once they answer,
  draw it correctly and carry on — this is a question about what they can see in their own book, not
  a hint that gives away the maths, so asking it costs nothing pedagogically. Never describe a diagram
  in words instead of drawing it. Call this figure once per term the question asks for (shape 4, shape
  5, ...), the same one-figure-per-part rule as any other diagram.`;

  algorithm instruction at all.

/* --- API ------------------------------------------------------------ *
 * Personal-testing setup: the API key lives only in this browser's
 * localStorage, entered once via a prompt. It is never written into this
 * file and never committed to git. This uses Anthropic's direct-browser-
 * access header, which exists for exactly this kind of local prototyping —
 * it is not a safe way to hand the app to students, since anyone using the
 * same browser profile could reuse a key stored here. Before this goes to
 * students, replace this with a small server-side proxy that holds the key
 * privately instead.
 * ------------------------------------------------------------------ */

function getApiKey(){
  let key = localStorage.getItem("mw_api_key");
  if (!key){
    key = window.prompt("Enter your Anthropic API key (starts with sk-ant-). "
      + "This is saved only in this browser, never in the file or in git.");
    if (key) localStorage.setItem("mw_api_key", key.trim());
  }
  return key ? key.trim() : "";
}

async function callClaude(system, messages, maxTokens, purpose){
  const key = getApiKey();
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": key,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    // The system prompt is identical on every call of a given purpose within
    // a conversation (courseContext(S.courseKey) doesn't change mid-session),
    // so caching it costs nothing to add here and helps every call site —
    // it's simply inert on prompts too short to meet the cache minimum.
    body: JSON.stringify({ model: MODEL, max_tokens: maxTokens || 1000,
      system: [{ type:"text", text:system, cache_control:{ type:"ephemeral" } }],
      messages })
  });
  if (res.status === 401){
    localStorage.removeItem("mw_api_key");
    throw new Error("That API key wasn't accepted. Try again — you'll be asked to re-enter it.");
  }
  if (!res.ok) throw new Error("MathWISE could not be reached. Try again in a moment.");
  const data = await res.json();
  logUsage(purpose || "other", MODEL, data.usage);  // REMOVABLE — see the "Cost analysis" module
  const text = (data.content || []).filter(b => b.type === "text")
    .map(b => b.text).join("\n").trim();
  if (!text) throw new Error("MathWISE sent an empty reply. Try again.");
  return text;
}

function parseJsonReply(raw){
  let s = String(raw).trim().replace(/^```(?:json)?/i, "").replace(/```$/, "").trim();
  try { return JSON.parse(s); } catch (e) {}
  const m = s.match(/\{[\s\S]*\}/);
  if (m) { try { return JSON.parse(m[0]); } catch (e) {} }
  throw new Error("MathWISE replied in a form this app could not read. Try again.");
}

/* --- Cost analysis ----------------------------------------------------- *
 * Staff-only. This no longer appears as a tab in the student app; the
 * dashboard at stats.html renders it, reading mw_cost_log from this same
 * origin. logUsage() still runs on every call to Claude, both for that view
 * and to roll token and cost totals into each analytics record.
 *
 * It exists to watch how token use and cost behave during development —
 * in particular, MathWISE resends the *entire* conversation on every
 * turn of a Socratic back-and-forth, with no prompt caching in place, so
 * a growing tutoring session should show input tokens climbing roughly
 * turn over turn rather than staying flat. That is the thing worth
 * watching here, not the absolute dollar figures.
 * ------------------------------------------------------------------ */

// USD per 1,000,000 tokens. Approximate current Sonnet-tier rates —
// check https://www.anthropic.com/pricing and correct these before
// trusting the totals below beyond rough, relative comparison.
const COST_RATES = { input: 3.00, output: 15.00, cacheWrite: 3.75, cacheRead: 0.30 };

function estimateCost(usage){
  if (!usage) return 0;
  return (usage.input_tokens || 0) / 1e6 * COST_RATES.input
    + (usage.cache_creation_input_tokens || 0) / 1e6 * COST_RATES.cacheWrite
    + (usage.cache_read_input_tokens || 0) / 1e6 * COST_RATES.cacheRead
    + (usage.output_tokens || 0) / 1e6 * COST_RATES.output;
}

function newCostSession(){
  const rnd = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Math.random()).slice(2);
  return rnd.slice(0, 8);
}

function loadCostLog(){
  try { return JSON.parse(localStorage.getItem("mw_cost_log") || "[]"); }
  catch (e){ return []; }
}

function saveCostLog(log){
  try { localStorage.setItem("mw_cost_log", JSON.stringify(log.slice(-2000))); }
  catch (e){ /* storage full or unavailable — logging is best-effort only */ }
}

function logUsage(purpose, model, usage){
  try {
    if (!usage) return;
    const log = loadCostLog();
    log.push({
      ts: new Date().toISOString(),
      session: S.costSession,
      purpose,
      model,
      input: usage.input_tokens || 0,
      cacheWrite: usage.cache_creation_input_tokens || 0,
      cacheRead: usage.cache_read_input_tokens || 0,
      output: usage.output_tokens || 0,
      cost: estimateCost(usage)
    });
    saveCostLog(log);
  } catch (e){ /* a logging bug must never break a real tutoring request */ }
}

function renderCostAnalysis(el){
  const log = loadCostLog();
  const sessions = [...new Set(log.map(r => r.session))];
  if (!S.costViewSession || !sessions.includes(S.costViewSession)) S.costViewSession = S.costSession;
  const rows = log.filter(r => r.session === S.costViewSession);
  const totalCost = log.reduce((s, r) => s + r.cost, 0);
  const byPurpose = {};
  log.forEach(r => { byPurpose[r.purpose] = (byPurpose[r.purpose] || 0) + r.cost; });

  // Only the tutoring conversation resends the full growing history each turn —
  // mixing in one-off calculator/OCR/etc. calls would turn a clean growth curve
  // into a misleading sawtooth, so the chart tracks tutoring turns only.
  //
  // Since prompt caching went in, the API's "input_tokens" field only counts
  // the fresh, uncached part of a request — usually just the newest reply —
  // so it no longer reflects how big the conversation actually is; it stays
  // small on purpose. Charting input + cache write + cache read instead
  // gives the true, still-growing size of the context sent each turn,
  // regardless of how much of it was cheap to reprocess.
  const tutoringRows = rows.filter(r => r.purpose === "tutoring");
  const points = tutoringRows.map((r, i) => ({ x:i + 1, y:r.input + r.cacheWrite + r.cacheRead }));
  const chart = points.length > 1
    ? renderFigure({ type:"timeseries", points, xlabel:"Tutoring turn in this session", ylabel:"Total context tokens (fresh + cached)" })
    : `<p class="muted">Not enough tutoring turns yet in this session to chart growth.</p>`;

  el.innerHTML = `
    <div class="skill" style="border-top-color:var(--gold)">
      <h4>Cost analysis <span class="small" style="font-weight:400">— dev tool, remove before release</span></h4>
      <p class="muted">Every call to Claude is logged here: tokens in, tokens out, and an
        estimated cost from the rates below. The chart below tracks the "tutoring" purpose's
        total context size (input + cache write + cache read) — that should still climb turn
        over turn, since the full conversation is still being resent. What's changed since
        caching went in is <em>where</em> that size shows up: watch "Input" alone and a long
        conversation will look deceptively flat or small, because most of the growing history
        is now served cheaply from "Cache read" instead of being freshly reprocessed every
        turn. A small, flat "Input" column next to a climbing "Cache read" column is caching
        working correctly, not a bug.</p>
      <p class="small">Rates used (USD per million tokens, approximate — verify against
        Anthropic's pricing page): input \$${COST_RATES.input.toFixed(2)}, output
        \$${COST_RATES.output.toFixed(2)}, cache write \$${COST_RATES.cacheWrite.toFixed(2)},
        cache read \$${COST_RATES.cacheRead.toFixed(2)}.</p>
      <p class="small"><strong>${log.length}</strong> calls logged across
        <strong>${sessions.length}</strong> session${sessions.length === 1 ? "" : "s"} —
        <strong>\$${totalCost.toFixed(4)}</strong> estimated total across every session ever logged
        (see the table below for just the session you're viewing).
        By purpose, all-time: ${Object.entries(byPurpose).map(([p, c]) => `${esc(p)} \$${c.toFixed(4)}`).join(" · ") || "—"}</p>

      <div class="field" style="margin-top:14px;max-width:340px">
        <label for="costsession">Session</label>
        <select id="costsession">
          ${sessions.map(s => `<option value="${esc(s)}" ${s === S.costViewSession ? "selected" : ""}>
            ${esc(s)}${s === S.costSession ? " (current)" : ""} — ${log.filter(r => r.session === s).length} calls</option>`).join("")}
        </select>
      </div>

      ${chart}

      <div style="overflow-x:auto;margin-top:12px">
        <table class="mw-table">
          <thead><tr><th>#</th><th>Time</th><th>Purpose</th><th>Input</th><th>Cache write</th>
            <th>Cache read</th><th>Output</th><th>Est. cost</th></tr></thead>
          <tbody>${rows.map((r, i) => `<tr>
            <td>${i + 1}</td><td>${esc(new Date(r.ts).toLocaleTimeString())}</td>
            <td>${esc(r.purpose)}</td><td class="num">${r.input}</td><td class="num">${r.cacheWrite}</td>
            <td class="num">${r.cacheRead}</td><td class="num">${r.output}</td>
            <td class="num">\$${r.cost.toFixed(5)}</td></tr>`).join("")}
            <tr class="total"><td colspan="3">This session's total</td>
              <td class="num">${rows.reduce((s, r) => s + r.input, 0)}</td>
              <td class="num">${rows.reduce((s, r) => s + r.cacheWrite, 0)}</td>
              <td class="num">${rows.reduce((s, r) => s + r.cacheRead, 0)}</td>
              <td class="num">${rows.reduce((s, r) => s + r.output, 0)}</td>
              <td class="num">\$${rows.reduce((s, r) => s + r.cost, 0).toFixed(5)}</td></tr>
          </tbody>
        </table>
      </div>

      <div class="row" style="margin-top:14px">
        <button class="btn-quiet" id="costcsv">Copy full log as CSV</button>
        <button class="btn-quiet" id="costclear">Clear log</button>
      </div>
    </div>`;

  const sel = document.getElementById("costsession");
  if (sel) sel.onchange = () => { S.costViewSession = sel.value; render(); };

  const csv = document.getElementById("costcsv");
  if (csv) csv.onclick = () => {
    const header = "timestamp,session,purpose,model,input,cache_write,cache_read,output,est_cost_usd";
    const body = log.map(r =>
      [r.ts, r.session, r.purpose, r.model, r.input, r.cacheWrite, r.cacheRead, r.output, r.cost.toFixed(6)].join(",")
    ).join("\n");
    offerCopy("Cost log (CSV)", header + "\n" + body);
  };
  const clr = document.getElementById("costclear");
  if (clr) clr.onclick = () => {
    if (!window.confirm("Clear the entire cost log? This cannot be undone.")) return;
    saveCostLog([]);
    render();
  };
}

/* --- Analytics -------------------------------------------------------- *
 * One anonymous record per question a student works on. What leaves this
 * device is a set of category labels and numbers: course, band, topic,
 * outcome, turns, seconds, rating, tokens, cost. Never the question text,
 * never a photo, never a name. The server re-checks every value against
 * its own allow-list, so this file is the convenience, not the control.
 *
 * Every entry point is wrapped so that an analytics fault can never break
 * a tutoring request, exactly as logUsage() already behaves.
 * ------------------------------------------------------------------ */

const IDLE_MS = 20 * 60 * 1000;   // 20 minutes with no interaction ends a session

// Courses whose TOPICS list is empty (the three IB Diploma courses) fall back
// to this. Order matters: the first match wins, so the specific phrases sit
// above the general ones.
const TOPIC_KEYWORDS = [
  ["Calculus", ["differentiate", "derivative", "integral", "integrate", "dy/dx", "antiderivative", "limit"]],
  ["Statistics and probability", ["probability", "normal distribution", "standard deviation", "binomial", "median", "quartile", "box plot", "histogram"]],
  ["Trigonometry", ["sine", "cosine", "tangent", "sin(", "cos(", "tan(", "bearing", "radian"]],
  ["Linear relationships", ["gradient", "y-intercept", "straight line", "y = mx", "simultaneous"]],
  ["Quadratics", ["quadratic", "parabola", "factorise", "discriminant", "complete the square"]],
  ["Geometry and measurement", ["area", "perimeter", "volume", "surface area", "pythagoras", "congruent", "similar"]],
  ["Number and algebra", ["simplify", "expand", "solve for", "index", "indices", "surd", "fraction", "percentage"]],
  ["Financial mathematics", ["interest", "loan", "depreciation", "annuity", "investment"]],
  ["Networks and matrices", ["matrix", "matrices", "network", "vertex", "spanning tree", "shortest path"]]
];

function deviceId(){
  try {
    let id = localStorage.getItem("mw_device");
    if (!id){
      const rnd = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Math.random()).slice(2);
      id = rnd.replace(/-/g, "").slice(0, 8);
      localStorage.setItem("mw_device", id);
    }
    return id;
  } catch (e){ return "nostore"; }
}

// Matches the question against this course's own topic list first, because
// those are the words the student's teacher actually uses. Falls back to the
// shared keyword map, which is the only option for the IB courses since
// TOPICS has no entries for them.
function classifyTopic(text, courseKey){
  const t = String(text || "").toLowerCase();
  if (!t.trim()) return "Unclassified";

  const key = courseKey || "";
  const listed = (topicsFor(key) || []).concat(key.indexOf("myp10") === 0 ? Y10_CORE : []);
  let best = "", bestScore = 0;
  listed.forEach(topic => {
    // Score a topic by how many of its own significant words appear in the
    // question. "Expanding and factorising quadratics" matches on both
    // "factorise" and "quadratic" and so beats a single-word coincidence.
    const words = topic.toLowerCase().split(/[^a-z]+/).filter(w => w.length > 4);
    const score = words.filter(w => t.indexOf(w.replace(/(ing|ies|es|s)$/, "")) !== -1).length;
    if (score > bestScore){ bestScore = score; best = topic; }
  });
  if (bestScore > 0) return best;

  for (const pair of TOPIC_KEYWORDS){
    if (pair[1].some(k => t.indexOf(k) !== -1)) return pair[0];
  }
  return "Unclassified";
}

function buildRecord(session){
  const s = session || {};
  const course = s.course || "";
  const band = course ? (courseOf(course).band || "none") : "none";
  const started = Number(s.startedAt) || 0;
  const ended = Number(s.endedAt) || 0;
  return {
    device: deviceId(),
    course: course || "none",
    band: band || "none",
    topic: s.topic || "Unclassified",
    outcome: s.outcome || "switched",
    turns: Number(s.turns) || 0,
    seconds: Math.max(0, Math.round((ended - started) / 1000)),
    rating: s.rating || "none",
    tokensIn: Number(s.tokensIn) || 0,
    tokensOut: Number(s.tokensOut) || 0,
    cost: Number(s.cost) || 0
  };
}

function loadLocalEvents(){
  try { return JSON.parse(localStorage.getItem("mw_events") || "[]"); }
  catch (e){ return []; }
}

function saveLocalEvents(list){
  try { localStorage.setItem("mw_events", JSON.stringify(list.slice(-2000))); }
  catch (e){ /* storage full or unavailable — logging is best-effort only */ }
}

// The open question session, or null when no question is in progress.
let AS = null;
let idleTimer = null;

function analyticsStart(text){
  try {
    if (AS) analyticsEnd("switched");
    AS = {
      course: S.courseKey || "",
      topic: classifyTopic(text, S.courseKey || ""),
      startedAt: Date.now(),
      endedAt: 0,
      turns: 0,
      rating: "none",
      tokensIn: 0,
      tokensOut: 0,
      cost: 0,
      askedToBeShown: false
    };
    analyticsTouch();
  } catch (e){ /* analytics must never break a tutoring request */ }
}

// Any sign of life resets the twenty-minute clock. A hidden tab does NOT
// pause it: a student who switches away and never comes back should be
// recorded as a timeout, not left open forever.
function analyticsTouch(){
  try {
    if (idleTimer) clearTimeout(idleTimer);
    if (!AS) return;
    idleTimer = setTimeout(() => analyticsEnd("timeout"), IDLE_MS);
  } catch (e){ /* best effort only */ }
}

function analyticsEnd(outcome){
  try {
    if (!AS) return;
    const session = AS;
    AS = null;                       // cleared first, so a re-entrant call is a no-op
    if (idleTimer){ clearTimeout(idleTimer); idleTimer = null; }
    session.endedAt = Date.now();
    session.outcome = session.askedToBeShown && outcome === "solved" ? "shown" : outcome;
    const record = buildRecord(session);
    const list = loadLocalEvents();
    list.push(Object.assign({ ts: new Date().toISOString() }, record));
    saveLocalEvents(list);
    queueSend(record);
  } catch (e){ /* analytics must never break a tutoring request */ }
}

function analyticsRate(rating){
  try {
    if (AS){ AS.rating = rating; return; }
    // The rating usually arrives after the solution closed the session, so
    // amend the most recent stored record instead of dropping the answer.
    const list = loadLocalEvents();
    if (!list.length) return;
    list[list.length - 1].rating = rating;
    saveLocalEvents(list);
    queueSend(list[list.length - 1]);
  } catch (e){ /* best effort only */ }
}

// The app is served from GitHub Pages; the endpoints live on Vercel. Opened as
// a local file there is no server to talk to, so sending is off and records
// simply stay in this browser. That also keeps the self-check offline.
const API_BASE = (location.hostname === "localhost" || location.hostname === "127.0.0.1"
  || location.protocol === "file:") ? "" : "https://mathwise.vercel.app";

function loadOutbox(){
  try { return JSON.parse(localStorage.getItem("mw_outbox") || "[]"); }
  catch (e){ return []; }
}

function saveOutbox(list){
  try { localStorage.setItem("mw_outbox", JSON.stringify(list.slice(-200))); }
  catch (e){ /* best effort only */ }
}

function queueSend(record){
  try {
    if (!API_BASE) return;
    const box = loadOutbox();
    box.push(record);
    saveOutbox(box);
    flushOutbox();
  } catch (e){ /* analytics must never break a tutoring request */ }
}

// Sends the queue and keeps whatever did not get through, so a dropped
// connection or a closed laptop loses nothing. keepalive lets a send started
// by a closing tab finish after the page has gone.
function flushOutbox(){
  try {
    if (!API_BASE) return;
    const box = loadOutbox();
    if (!box.length) return;
    saveOutbox([]);                    // taken out first, put back on failure
    box.forEach(record => {
      fetch(API_BASE + "/api/log", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(record),
        keepalive: true
      }).then(res => {
        if (!res.ok) throw new Error("rejected");
      }).catch(() => {
        const back = loadOutbox();
        back.push(record);
        saveOutbox(back);
      });
    });
  } catch (e){ /* best effort only */ }
}

/* --- Expressions ----------------------------------------------------- *
 * A small shunting-yard parser. The model writes y = f(x) as a string and
 * this evaluates it, rather than the model sending hundreds of points.
 * ------------------------------------------------------------------ */

const FUNCS = {
  sin:Math.sin, cos:Math.cos, tan:Math.tan, asin:Math.asin, acos:Math.acos,
  atan:Math.atan, exp:Math.exp, ln:Math.log, log:x=>Math.log10(x),
  sqrt:Math.sqrt, abs:Math.abs, sinh:Math.sinh, cosh:Math.cosh, tanh:Math.tanh
};
const OPS = {
  "+":{p:1,f:(a,b)=>a+b}, "-":{p:1,f:(a,b)=>a-b},
  "*":{p:2,f:(a,b)=>a*b}, "/":{p:2,f:(a,b)=>a/b},
  "^":{p:3,f:(a,b)=>Math.pow(a,b),right:true},
  // Prefix minus binds looser than ^ so that -x^2 is -(x^2), not (-x)^2.
  "u-":{p:1.5,right:true}
};

function tokenise(src){
  const out = [];
  const s = String(src).replace(/\s+/g, "");
  let i = 0;
  while (i < s.length){
    const c = s[i];
    if (/[0-9.]/.test(c)){
      let j = i; while (j < s.length && /[0-9.]/.test(s[j])) j++;
      out.push({ t:"num", v:parseFloat(s.slice(i,j)) }); i = j; continue;
    }
    if (/[a-z]/i.test(c)){
      let j = i; while (j < s.length && /[a-z0-9]/i.test(s[j])) j++;
      const w = s.slice(i,j).toLowerCase(); i = j;
      if (FUNCS[w]) out.push({ t:"fn", v:w });
      else if (w === "pi") out.push({ t:"num", v:Math.PI });
      else if (w === "e") out.push({ t:"num", v:Math.E });
      else out.push({ t:"var", v:w });
      continue;
    }
    if (OPS[c]){
      const prev = out[out.length-1];
      const unary = c === "-" && (!prev || prev.t === "op" || prev.v === "(");
      out.push(unary ? { t:"op", v:"u-" } : { t:"op", v:c });
      i++; continue;
    }
    if (c === "(" || c === ")"){ out.push({ t:"par", v:c }); i++; continue; }
    if (c === ","){ out.push({ t:"par", v:"," }); i++; continue; }
    throw new Error("bad character " + c);
  }
  return out;
}

function toRpn(tokens){
  const out = [], stack = [];
  for (const tk of tokens){
    if (tk.t === "num" || tk.t === "var") out.push(tk);
    else if (tk.t === "fn") stack.push(tk);
    else if (tk.v === "u-") stack.push(tk);
    else if (tk.t === "op"){
      const o = OPS[tk.v];
      while (stack.length){
        const top = stack[stack.length-1];
        if (top.t === "fn"){ out.push(stack.pop()); continue; }
        if (top.t === "op" && (OPS[top.v].p > o.p || (OPS[top.v].p === o.p && !o.right))){
          out.push(stack.pop()); continue;
        }
        break;
      }
      stack.push(tk);
    }
    else if (tk.v === "(") stack.push(tk);
    else if (tk.v === ")"){
      while (stack.length && stack[stack.length-1].v !== "(") out.push(stack.pop());
      if (!stack.length) throw new Error("unbalanced");
      stack.pop();
      if (stack.length && stack[stack.length-1].t === "fn") out.push(stack.pop());
    }
  }
  while (stack.length){
    const top = stack.pop();
    if (top.v === "(") throw new Error("unbalanced");
    out.push(top);
  }
  return out;
}

function compile(expr){
  const rpn = toRpn(tokenise(expr));
  return x => {
    const st = [];
    for (const tk of rpn){
      if (tk.t === "num") st.push(tk.v);
      else if (tk.t === "var") st.push(tk.v === "x" ? x : NaN);
      else if (tk.t === "fn") st.push(FUNCS[tk.v](st.pop()));
      else if (tk.v === "u-") st.push(-st.pop());
      else { const b = st.pop(), a = st.pop(); st.push(OPS[tk.v].f(a,b)); }
    }
    return st.length === 1 ? st[0] : NaN;
  };
}

/* --- Figures --------------------------------------------------------- *
 * The model returns a JSON spec; this file draws it. The model never
 * draws SVG itself: model-drawn diagrams come out with crossing edges,
 * labels on top of lines and numbers that drift from the question.
 * ------------------------------------------------------------------ */

const C_LINE = "#4F2759", C_ALT = "#C59F40", C_AXIS = "#8A8291",
      C_GRID = "#EDE8F0", C_INK = "#241C27", C_FILL = "#4F2759";

const W = 640, H = 400, PAD = 46;
// Every figure's <svg> stretches via CSS (width:100%) to fill its container,
// which — at this app's widest layout (.wrap's 1060px cap, minus the message
// bubble's avatar column and the figure box's own padding) — renders at
// roughly 940px, well over 1.4x a W=640 viewBox. So a figure text size has to
// be chosen relative to that stretch, not read as a literal CSS px value:
// FIG_TEXT (~16 body/LaTeX px ÷ 940/640 stretch) is the size a normal body-text
// label should use on a W-wide canvas so it reads the same size as the
// surrounding LaTeX prose, not larger. Scale other figure text up/down from
// here (e.g. FIG_TEXT*0.7 for a small annotation) rather than picking
// unrelated numbers per figure.
const FIG_TEXT = 11;

function sx(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function num(v){ return Math.round(v * 100) / 100; }

// A run of two or more letters is a real word ("Score", "Frequency") and stays
// upright in \text{}; a lone letter or a digit-bearing token ("x", "-4", "Q1",
// "0-4") is left as raw LaTeX so it renders as maths (italic variables, proper
// minus signs, real exponents from a stray "x^2").
function texWrap(s){
  const str = String(s);
  // A backslash means this is already deliberate LaTeX (\cos, \theta, \frac{}{}...)
  // handed in by a caller that built its own expression — none of the plain
  // labels figures actually send (numbers, category names, coordinates) ever
  // contain one, so passing those through untouched is safe.
  if (str.indexOf("\\") !== -1) return str;
  const escaped = str.replace(/([%&#_])/g, "\\$1");
  return /[A-Za-z]{2,}/.test(escaped) ? ("\\text{" + escaped + "}") : escaped;
}

// Every diagram's text — tick numbers, axis titles, point and category labels —
// goes through this one function, so rendering it as real LaTeX here is what
// makes every figure in the app LaTeX-labelled, not a per-diagram change.
// katex.render() (called from typesetIn) replaces the placeholder text once it
// runs; renderMathInElement's delimiter scan never reaches this because it
// explicitly ignores <svg> subtrees, so this direct-render path is required.
function txt(x, y, s, opts){
  const o = opts || {};
  const size = o.size || 12;
  const anchor = o.anchor || "middle";
  const latex = texWrap(s);
  // A foreignObject clips content that overflows its box rather than growing
  // to fit it, so a short label wrapping onto two lines (a bad-looking italic
  // "t" split from its "= 1" can misread as an entirely different character)
  // is worse than a little extra invisible margin — hence the generous
  // multiplier here and the explicit nowrap below.
  const w = Math.max(size * 1.5, String(s).length * size * 0.72 + size);
  const h = size * 1.7;
  const bx = anchor === "start" ? x : anchor === "end" ? x - w : x - w / 2;
  const by = y - size * 0.32 - h / 2;
  const justify = anchor === "start" ? "flex-start" : anchor === "end" ? "flex-end" : "center";
  const rotate = o.rotate ? ` transform="rotate(${o.rotate} ${num(x)} ${num(y)})"` : "";
  return `<foreignObject${rotate} x="${num(bx)}" y="${num(by)}" width="${num(w)}" height="${num(h)}">
    <div xmlns="http://www.w3.org/1999/xhtml" class="mw-mathlabel" data-latex="${sx(latex)}"
      style="width:100%;height:100%;display:flex;align-items:center;justify-content:${justify};
      white-space:nowrap;font-size:${size}px;color:${o.fill || C_INK};background:${o.bg || "transparent"};
      ${o.weight ? `font-weight:${o.weight};` : ""}">${sx(latex)}</div>
  </foreignObject>`;
}
function svg(inner, w, h){
  return `<svg viewBox="0 0 ${w||W} ${h||H}" xmlns="http://www.w3.org/2000/svg" role="img">${inner}</svg>`;
}

function niceStep(range){
  const raw = range / 8, mag = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / mag;
  return (n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10) * mag;
}

/* The left margin is measured, not assumed: "1400" needs more room than "9",
   and a fixed margin is how an axis title ends up sitting on the numbers.
   Returns L and R so callers that lay out by hand use the same edges. */
function axes(xmin, xmax, ymin, ymax, xlabel, ylabel){
  const xs = niceStep(xmax - xmin), ys = niceStep(ymax - ymin);

  const yLabels = [];
  for (let v = Math.ceil(ymin / ys) * ys; v <= ymax + 1e-9; v += ys) yLabels.push(String(num(v)));
  // Left margin, from the axis outwards: gap, tick labels, gap, rotated title.
  // Adding these up rather than guessing is what stops the title touching the
  // numbers when the values happen to be wide.
  const widest = Math.max(6, ...yLabels.map(t => t.length * 6.6));
  const TICK_GAP = 9, TITLE_BAND = 14, TITLE_GAP = 14, EDGE = 6;
  const L = Math.ceil(ylabel
    ? EDGE + TITLE_BAND + TITLE_GAP + widest + TICK_GAP
    : EDGE + widest + TICK_GAP);
  const R = 30, T = 34, B = xlabel ? 52 : 38;

  const X = v => L + (v - xmin) / (xmax - xmin) * (W - L - R);
  const Y = v => H - B - (v - ymin) / (ymax - ymin) * (H - T - B);

  let g = "";
  for (let v = Math.ceil(xmin / xs) * xs; v <= xmax + 1e-9; v += xs){
    g += `<line x1="${num(X(v))}" y1="${T}" x2="${num(X(v))}" y2="${num(H-B)}" stroke="${C_GRID}"/>`;
    g += txt(X(v), H - B + 17, num(v), { size:11, fill:C_AXIS });
  }
  for (let v = Math.ceil(ymin / ys) * ys; v <= ymax + 1e-9; v += ys){
    g += `<line x1="${L}" y1="${num(Y(v))}" x2="${num(W-R)}" y2="${num(Y(v))}" stroke="${C_GRID}"/>`;
    g += txt(L - TICK_GAP, Y(v) + 4, num(v), { size:11, fill:C_AXIS, anchor:"end" });
  }
  const y0 = (ymin <= 0 && ymax >= 0) ? Y(0) : H - B;
  const x0 = (xmin <= 0 && xmax >= 0) ? X(0) : L;
  g += `<line x1="${L}" y1="${num(y0)}" x2="${num(W-R)}" y2="${num(y0)}" stroke="${C_AXIS}" stroke-width="1.4"/>`;
  g += `<line x1="${num(x0)}" y1="${T}" x2="${num(x0)}" y2="${num(H-B)}" stroke="${C_AXIS}" stroke-width="1.4"/>`;
  if (xlabel) g += txt((L + W - R) / 2, H - 12, xlabel, { size:12, fill:C_AXIS });
  if (ylabel){
    const tx = L - TICK_GAP - widest - TITLE_GAP - TITLE_BAND / 2;
    g += txt(tx, (T + H - B) / 2, ylabel, { size:12, fill:C_AXIS, rotate:-90 });
  }
  return { g, X, Y, L, R, T, B };
}

const FIG = {};

FIG.plot = spec => {
  const xmin = +spec.xmin, xmax = +spec.xmax;
  if (!(xmax > xmin)) throw new Error("x range");
  // x=c is a real graph (e.g. "sketch x=5") but is never a function of x, so
  // it can't compile like the rest of "curves" — kept in the same array
  // (drawn the same solid colour-cycled way) with a "vertical" field instead
  // of an "f", rather than inventing a separate spec list just for this case.
  // c.from/c.to restrict a curve to a sub-range of [xmin,xmax] — a piecewise
  // linear graph is several curves, each only valid over its own interval
  // (e.g. C=50+40x for 0<=x<3, C=80+30x for 3<=x<=8), joined or jumping at
  // the boundary rather than each drawn across the whole axis.
  const curves = (spec.curves || []).map(c =>
    c.vertical !== undefined ? { ...c, vertical:+c.vertical } : {
      ...c, f: compile(c.expr),
      from: c.from !== undefined ? +c.from : xmin,
      to: c.to !== undefined ? +c.to : xmax
    });
  let ymin = spec.ymin, ymax = spec.ymax;
  if (ymin === undefined || ymax === undefined){
    const vals = [];
    curves.forEach(c => {
      if (!c.f) return;
      for (let i = 0; i <= 200; i++){
        const y = c.f(c.from + (c.to - c.from) * i / 200);
        if (isFinite(y)) vals.push(y);
      }
    });
    (spec.points || []).forEach(p => vals.push(+p.y));
    (spec.circles || []).forEach(ci => { vals.push(+ci.cy - +ci.r, +ci.cy + +ci.r); });
    if (!vals.length) { ymin = -5; ymax = 5; }
    else {
      vals.sort((a,b) => a - b);
      const lo = vals[Math.floor(vals.length * 0.02)], hi = vals[Math.floor(vals.length * 0.98)];
      const pad = Math.max((hi - lo) * 0.12, 0.5);
      ymin = lo - pad; ymax = hi + pad;
    }
    // A region shaded down to the axis needs the axis on screen, or the
    // shading has no visible base. Percentile trimming would drop a lone 0.
    if ((spec.shade || []).some(sh => sh.toCurve === undefined || sh.toCurve === null)){
      ymin = Math.min(ymin, 0); ymax = Math.max(ymax, 0);
    }
  }
  const ax = axes(xmin, xmax, +ymin, +ymax, spec.xlabel || "x", spec.ylabel || "y");
  const { g, X, Y } = ax;
  let body = g;

  // Shaded regions go down first so the curves sit on top of them. A definite
  // integral without its region shaded is missing the point of the picture.
  const clamp = v => Math.max(+ymin, Math.min(+ymax, v));
  (spec.shade || []).forEach(sh => {
    const top = curves[+sh.curve || 0];
    if (!top) return;
    const a = +sh.from, b = +sh.to;
    if (!isFinite(a) || !isFinite(b) || b <= a) return;
    const under = sh.toCurve !== undefined && sh.toCurve !== null ? curves[+sh.toCurve] : null;
    const N = 180;
    let d = "";
    for (let k = 0; k <= N; k++){
      const x = a + (b - a) * k / N, y = top.f(x);
      d += (k ? "L" : "M") + num(X(x)) + " " + num(Y(clamp(isFinite(y) ? y : 0))) + " ";
    }
    for (let k = N; k >= 0; k--){
      const x = a + (b - a) * k / N;
      const y = under ? under.f(x) : 0;
      d += "L" + num(X(x)) + " " + num(Y(clamp(isFinite(y) ? y : 0))) + " ";
    }
    d += "Z";
    body += `<path d="${d}" fill="${C_FILL}" fill-opacity="0.20" stroke="${C_LINE}"
      stroke-opacity="0.35" stroke-width="1"/>`;
    if (sh.label){
      const mx = (a + b) / 2;
      const ytop = clamp(isFinite(top.f(mx)) ? top.f(mx) : 0);
      const ybot = under ? clamp(under.f(mx)) : clamp(0);
      body += txt(X(mx), (Y(ytop) + Y(ybot)) / 2 + 5, sh.label, { size:13, weight:600, fill:C_LINE });
    }
  });

  // Inequality half-plane regions ("sketch y >= -2", "solve using the graph") —
  // an open region running to the axes' own edge, not bounded between two
  // x-values like "shade" above. A solid boundary line means the inequality
  // includes it (>=, <=); dashed means it doesn't (>, <), the same convention
  // students draw by hand.
  (spec.regions || []).forEach(rg => {
    const strict = !!rg.strict, dash = strict ? ' stroke-dasharray="6 4"' : "";
    if (rg.type === "horizontal"){
      const yc = +rg.y;
      body += `<line x1="${ax.L}" y1="${num(Y(yc))}" x2="${num(W - ax.R)}" y2="${num(Y(yc))}"
        stroke="${C_LINE}" stroke-width="2"${dash}/>`;
      const yA = Y(yc), yB = rg.direction === "above" ? Y(+ymax) : Y(+ymin);
      body += `<rect x="${ax.L}" y="${num(Math.min(yA, yB))}" width="${num(W - ax.R - ax.L)}"
        height="${num(Math.abs(yA - yB))}" fill="${C_FILL}" fill-opacity="0.15"/>`;
      if (rg.label) body += txt((ax.L + W - ax.R) / 2, (yA + yB) / 2, rg.label,
        { size:13, weight:600, fill:C_LINE, bg:"rgba(255,255,255,0.85)" });
    } else if (rg.type === "line"){
      // A slanted boundary y = m*x + c — far more common than the axis-aligned
      // cases above (y >= 3x - 4 style), sampled and clamped to the visible
      // range the same way "shade" clips a curve, then closed off along
      // whichever of ymin/ymax the shading runs to.
      const m = +rg.m || 0, c0 = +rg.c || 0, lineY = x => m * x + c0;
      const N = 100;
      let d = "";
      for (let k = 0; k <= N; k++){
        const x = xmin + (xmax - xmin) * k / N;
        d += (k ? "L" : "M") + num(X(x)) + " " + num(Y(clamp(lineY(x)))) + " ";
      }
      body += `<path d="${d}" fill="none" stroke="${C_LINE}" stroke-width="2"${dash}/>`;
      const edgeY = rg.direction === "above" ? +ymax : +ymin;
      const poly = d + `L ${num(X(xmax))} ${num(Y(edgeY))} L ${num(X(xmin))} ${num(Y(edgeY))} Z`;
      body += `<path d="${poly}" fill="${C_FILL}" fill-opacity="0.15"/>`;
      if (rg.label){
        const midx = (xmin + xmax) / 2, midy = (clamp(lineY(midx)) + edgeY) / 2;
        body += txt(X(midx), Y(midy), rg.label, { size:13, weight:600, fill:C_LINE, bg:"rgba(255,255,255,0.85)" });
      }
    } else if (rg.type === "vertical"){
      const xc = +rg.x;
      body += `<line x1="${num(X(xc))}" y1="${ax.T}" x2="${num(X(xc))}" y2="${num(H - ax.B)}"
        stroke="${C_LINE}" stroke-width="2"${dash}/>`;
      const xA = X(xc), xB = rg.direction === "right" ? X(+xmax) : X(+xmin);
      body += `<rect x="${num(Math.min(xA, xB))}" y="${ax.T}" width="${num(Math.abs(xA - xB))}"
        height="${num(H - ax.B - ax.T)}" fill="${C_FILL}" fill-opacity="0.15"/>`;
      if (rg.label) body += txt((xA + xB) / 2, (ax.T + H - ax.B) / 2, rg.label,
        { size:13, weight:600, fill:C_LINE, bg:"rgba(255,255,255,0.85)" });
    }
  });

  // x^2+y^2=r^2 isn't a function of x, so it can never be one of "curves" —
  // drawn as its own ellipse instead, with rx/ry taken from this plot's own
  // actual per-axis pixel scale (X/Y aren't equally scaled the way
  // FIG.transform's grid is) so it still touches the real axis intercepts
  // correctly even where the two scales differ and the circle reads as an
  // ellipse on screen — mathematically honest, not a bug.
  (spec.circles || []).forEach(ci => {
    const cx = +ci.cx || 0, cy = +ci.cy || 0, r = +ci.r;
    if (!(r > 0)) return;
    const rx = Math.abs(X(cx + r) - X(cx)), ry = Math.abs(Y(cy + r) - Y(cy));
    body += `<ellipse cx="${num(X(cx))}" cy="${num(Y(cy))}" rx="${num(rx)}" ry="${num(ry)}"
      fill="none" stroke="${C_LINE}" stroke-width="2.2"/>`;
    if (ci.label) body += txt(X(cx), Y(cy) - ry - 8, ci.label,
      { weight:600, fill:C_LINE, bg:"rgba(255,255,255,0.88)" });
  });

  curves.forEach((c, i) => {
    const colour = i === 0 ? C_LINE : C_ALT;
    if (c.vertical !== undefined){
      body += `<path d="M ${num(X(c.vertical))} ${num(Y(+ymin))} L ${num(X(c.vertical))} ${num(Y(+ymax))}"
        fill="none" stroke="${colour}" stroke-width="2.2"/>`;
      if (c.label) body += txt(X(c.vertical) + 6, ax.T + 16 + i * 16, c.label,
        { anchor:"start", fill:colour, weight:600, bg:"rgba(255,255,255,0.88)" });
      return;
    }
    let d = "", pen = false;
    for (let k = 0; k <= 600; k++){
      const x = c.from + (c.to - c.from) * k / 600, y = c.f(x);
      if (!isFinite(y) || y < ymin - (ymax - ymin) || y > ymax + (ymax - ymin)){ pen = false; continue; }
      d += (pen ? "L" : "M") + num(X(x)) + " " + num(Y(y)) + " ";
      pen = true;
    }
    body += `<path d="${d}" fill="none" stroke="${colour}" stroke-width="2.2"/>`;
    // A curve that rises into this corner can pass directly behind its own
    // label — an opaque backing keeps the label readable either way, rather
    // than trying to predict where the curve will and won't be.
    if (c.label) body += txt(W - ax.R - 4, ax.T + 16 + i * 16, c.label,
      { anchor:"end", fill:colour, weight:600, bg:"rgba(255,255,255,0.88)" });
  });
  (spec.vectors || []).forEach((v, i) => {
    const from = v.from || { x:0, y:0 }, to = v.to || v;
    if (i === 0) body += `<defs><marker id="vecar" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="${C_LINE}"/></marker></defs>`;
    const x1 = X(+from.x), y1 = Y(+from.y), x2 = X(+to.x), y2 = Y(+to.y);
    body += `<line x1="${num(x1)}" y1="${num(y1)}" x2="${num(x2)}" y2="${num(y2)}"
      stroke="${C_LINE}" stroke-width="2.4" marker-end="url(#vecar)"/>`;
    if (v.label) body += txt((x1 + x2) / 2, (y1 + y2) / 2 - 10, v.label,
      { size:13, weight:600, fill:C_LINE, bg:"rgba(255,255,255,0.88)" });
  });
  (spec.vlines || []).forEach(l => {
    body += `<line x1="${num(X(+l.x))}" y1="${ax.T}" x2="${num(X(+l.x))}" y2="${num(H-ax.B)}"
      stroke="${C_ALT}" stroke-width="1.6" stroke-dasharray="5 4"/>`;
    if (l.label) body += txt(X(+l.x), ax.T - 6, l.label, { size:11, fill:C_ALT });
  });
  (spec.hlines || []).forEach(l => {
    body += `<line x1="${ax.L}" y1="${num(Y(+l.y))}" x2="${num(W-ax.R)}" y2="${num(Y(+l.y))}"
      stroke="${C_ALT}" stroke-width="1.6" stroke-dasharray="5 4"/>`;
    if (l.label) body += txt(W - ax.R, Y(+l.y) - 6, l.label, { size:11, fill:C_ALT, anchor:"end" });
  });
  (spec.points || []).forEach(p => {
    // p.open draws an unfilled (white-centred) circle — the standard
    // excluded-endpoint marker at a step-graph jump, as opposed to the
    // default filled dot for an included point.
    body += p.open
      ? `<circle cx="${num(X(+p.x))}" cy="${num(Y(+p.y))}" r="4.5" fill="#fff" stroke="${C_FILL}" stroke-width="2"/>`
      : `<circle cx="${num(X(+p.x))}" cy="${num(Y(+p.y))}" r="4.5" fill="${C_FILL}"/>`;
    if (p.label) body += txt(X(+p.x), Y(+p.y) - 13, p.label,
      { size:13, weight:600, bg:"rgba(255,255,255,0.88)" });
  });
  return svg(body);
};

FIG.bar = spec => {
  const cats = spec.categories || [], vals = (spec.values || []).map(Number);
  if (!cats.length) throw new Error("no categories");
  const top = Math.max(...vals, 0) * 1.15 || 1;
  const ax = axes(0, 1, 0, top, spec.xlabel || "", spec.ylabel || "");
  const { g, Y } = ax;
  let body = g.replace(/<line x1="[\d.]+" y1="\d+" x2="[\d.]+" y2="[\d.]+" stroke="#EDE8F0"\/>/g, "");
  const bw = (W - ax.L - ax.R) / cats.length;
  cats.forEach((c, i) => {
    const x = ax.L + i * bw, h = (H - ax.B) - Y(vals[i] || 0);
    body += `<rect x="${num(x + bw * 0.18)}" y="${num(Y(vals[i] || 0))}"
      width="${num(bw * 0.64)}" height="${num(Math.max(h, 0))}" fill="${C_FILL}" opacity="0.85"/>`;
    body += txt(x + bw / 2, H - ax.B + 17, c, { size:11, fill:C_AXIS });
    body += txt(x + bw / 2, Y(vals[i] || 0) - 6, vals[i], { size:11, weight:600 });
  });
  return svg(body);
};

FIG.histogram = spec => {
  const bins = (spec.bins || []).map(b => ({ from:+b.from, to:+b.to, freq:+b.freq }));
  if (!bins.length) throw new Error("no bins");
  const xmin = Math.min(...bins.map(b => b.from)), xmax = Math.max(...bins.map(b => b.to));
  const top = Math.max(...bins.map(b => b.freq)) * 1.15 || 1;
  const ax = axes(xmin, xmax, 0, top, spec.xlabel || "", spec.ylabel || "Frequency");
  const { g, X, Y } = ax;
  let body = g;
  bins.forEach(b => {
    body += `<rect x="${num(X(b.from))}" y="${num(Y(b.freq))}" width="${num(X(b.to) - X(b.from))}"
      height="${num(H - ax.B - Y(b.freq))}" fill="${C_FILL}" opacity="0.8" stroke="#fff"/>`;
  });
  return svg(body);
};

FIG.boxplot = spec => {
  // spec.groups:[{min,q1,median,q3,max,outliers,fences,label}] draws several
  // box plots stacked on one shared axis, for "compare these parallel box
  // plots" questions — each group reuses the exact same single-box drawing
  // logic below, just at a different row height. Without groups, spec's own
  // top-level min/q1/... fields are treated as the one and only box, exactly
  // as before.
  const groups = spec.groups && spec.groups.length ? spec.groups : [spec];
  const parsed = groups.map(g => {
    const vals = ["min","q1","median","q3","max"].map(k => +g[k]);
    if (vals.some(v => !isFinite(v))) throw new Error("five numbers needed");
    // Tukey's fences (1.5*IQR beyond each quartile) sit further out than the
    // whiskers by definition — a whisker only reaches the most extreme point
    // that is still inside its fence — so the visible range has to widen to
    // fit them, or the dashed lines would be drawn off the edge of the plot.
    // Only drawn when the question is actually about outliers/fences, per
    // g.fences — an ordinary box plot shouldn't carry this extra detail.
    const showFences = !!g.fences;
    const iqr = vals[3] - vals[1];
    const lowerFence = vals[1] - 1.5 * iqr, upperFence = vals[3] + 1.5 * iqr;
    const outs = (g.outliers || []).map(Number);
    return { vals, outs, showFences, lowerFence, upperFence, label: g.label };
  });
  const single = parsed.length === 1;
  const allVals = parsed.flatMap(p => [...p.vals, ...p.outs, ...(p.showFences ? [p.lowerFence, p.upperFence] : [])]);
  const lo = Math.min(...allVals), hi = Math.max(...allVals);
  const pad = (hi - lo) * 0.1 || 1;
  const leftPad = parsed.some(p => p.label)
    ? Math.max(PAD, 16 + Math.max(...parsed.map(p => (p.label || "").length)) * 7) : PAD;
  const rowH = single ? 220 : 108;
  const h2 = single ? 220 : rowH * parsed.length + 34;
  const axisY = single ? h2 - 52 : h2 - 24;
  const X = v => leftPad + (v - (lo - pad)) / ((hi + pad) - (lo - pad)) * (W - leftPad - PAD);
  let body = `<line x1="${leftPad}" y1="${axisY}" x2="${W-PAD}" y2="${axisY}" stroke="${C_AXIS}"/>`;
  const step = niceStep(hi - lo);
  for (let v = Math.ceil((lo - pad) / step) * step; v <= hi + pad; v += step){
    body += `<line x1="${num(X(v))}" y1="${axisY-4}" x2="${num(X(v))}" y2="${axisY+4}" stroke="${C_AXIS}"/>`;
    body += txt(X(v), axisY + 18, num(v), { size:11, fill:C_AXIS });
  }

  const BOX_LABELS = {
    min:"\\text{min: }", Q1:"Q_1\\text{: }", median:"\\text{median: }",
    Q3:"Q_3\\text{: }", max:"\\text{max: }"
  };
  parsed.forEach((p, gi) => {
    const [mn, q1, md, q3, mx] = p.vals;
    const mid = single ? 88 : 40 + gi * rowH + rowH / 2 - 14;
    const hh = single ? 26 : 18;
    body += `<line x1="${num(X(mn))}" y1="${mid}" x2="${num(X(q1))}" y2="${mid}" stroke="${C_LINE}" stroke-width="1.6"/>`;
    body += `<line x1="${num(X(q3))}" y1="${mid}" x2="${num(X(mx))}" y2="${mid}" stroke="${C_LINE}" stroke-width="1.6"/>`;
    [mn, mx].forEach(v => { body += `<line x1="${num(X(v))}" y1="${mid-14}" x2="${num(X(v))}" y2="${mid+14}" stroke="${C_LINE}" stroke-width="1.6"/>`; });
    body += `<rect x="${num(X(q1))}" y="${mid-hh}" width="${num(X(q3)-X(q1))}" height="${hh*2}"
      fill="${C_FILL}" opacity="0.16" stroke="${C_LINE}" stroke-width="1.6"/>`;
    body += `<line x1="${num(X(md))}" y1="${mid-hh}" x2="${num(X(md))}" y2="${mid+hh}" stroke="${C_ALT}" stroke-width="2.6"/>`;
    if (p.showFences){
      [[p.lowerFence, "lower fence"], [p.upperFence, "upper fence"]].forEach(([v, name]) => {
        body += `<line x1="${num(X(v))}" y1="${mid-hh-8}" x2="${num(X(v))}" y2="${mid+hh+8}"
          stroke="${C_ALT}" stroke-width="1.4" stroke-dasharray="5 4"/>`;
        if (single) body += txt(X(v), mid + hh + 8 + 14, `\\text{${name}: }${num(v)}`, { size:10.5, fill:C_ALT });
      });
    }
    p.outs.forEach(v => { body += `<circle cx="${num(X(v))}" cy="${mid}" r="4" fill="none" stroke="${C_LINE}" stroke-width="1.4"/>`; });
    if (p.label) body += txt(leftPad - 10, mid, p.label, { anchor:"end", size:12.5, weight:600, fill:C_INK });
    // Built as explicit LaTeX (Q_1, Q_3 subscripted) rather than a plain
    // "Q1 8" string: that has no run of 2+ letters, so texWrap sent it through
    // as raw math, where a plain space is ignored — it rendered as "Q18".
    // \text{...} preserves the space, and the backslash it contains routes
    // straight past texWrap's own wordy-word heuristic unchanged. Skipped
    // for multiple groups — five labels per row, stacked, is unreadable.
    if (single){
      [["min",mn],["Q1",q1],["median",md],["Q3",q3],["max",mx]].forEach(([n,v],i) => {
        body += txt(X(v), i % 2 ? mid - hh - 10 : mid + hh + 18, `${BOX_LABELS[n]}${num(v)}`, { size:10.5, fill:C_AXIS });
      });
    }
  });
