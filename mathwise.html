    <ellipse cx="${num(cx)}" cy="${num(cy)}" rx="${num(rx)}" ry="${num(ry)}" fill="none" stroke="${C_LINE}"
      stroke-width="1.8" clip-path="url(#${id}f)"/>`;
}

FIG.solid = spec => {
  const shape = String(spec.shape || "").toLowerCase();
  const d = spec.dims || {};
  const unit = spec.unit || "";
  const margin = 56, h = 380;

  if (shape === "cylinder"){
    const r = +d.r || 1, ht = +d.h || 1;
    const rawW = 2 * r, rawH = ht + 2 * r * 0.4;
    const scale = Math.min((W - margin * 2) / rawW, (h - margin * 2) / rawH);
    const rx = r * scale, ry = r * 0.4 * scale, cxs = W / 2;
    const topY = margin + ry, botY = topY + ht * scale;
    let body = "";
    body += halfDashedEllipse(cxs, botY, rx, ry);
    body += `<line x1="${num(cxs - rx)}" y1="${num(topY)}" x2="${num(cxs - rx)}" y2="${num(botY)}"
      stroke="${C_LINE}" stroke-width="1.8"/>`;
    body += `<line x1="${num(cxs + rx)}" y1="${num(topY)}" x2="${num(cxs + rx)}" y2="${num(botY)}"
      stroke="${C_LINE}" stroke-width="1.8"/>`;
    body += `<ellipse cx="${num(cxs)}" cy="${num(topY)}" rx="${num(rx)}" ry="${num(ry)}"
      fill="none" stroke="${C_LINE}" stroke-width="1.8"/>`;
    body += `<line x1="${num(cxs)}" y1="${num(topY)}" x2="${num(cxs + rx)}" y2="${num(topY)}"
      stroke="${C_ALT}" stroke-width="1.4" stroke-dasharray="3 3"/>`;
    body += txt(cxs + rx / 2, topY - 10, solidDimLabel(d.r, unit, "r"), { size:12, fill:C_ALT, weight:600 });
    body += txt(cxs + rx + 16, (topY + botY) / 2, solidDimLabel(d.h, unit, "h"),
      { size:12, fill:C_AXIS, weight:600, anchor:"start" });
    return svg(body, W, num(botY + ry + 20));
  }

  // Drawn exactly like a full cylinder — same ellipses, same silhouette —
  // with one added cue: a solid chord across the diameter of both the top
  // and bottom ellipses, showing the flat face where the cylinder was cut
  // in half lengthwise. Half of the outline (marked "cut") is shaded to
  // make which half is solid unambiguous.
  if (shape === "halfcylinder"){
    const r = +d.r || 1, ht = +d.h || 1;
    const rawW = 2 * r, rawH = ht + 2 * r * 0.4;
    const scale = Math.min((W - margin * 2) / rawW, (h - margin * 2) / rawH);
    const rx = r * scale, ry = r * 0.4 * scale, cxs = W / 2;
    const topY = margin + ry, botY = topY + ht * scale;
    let body = "";
    body += halfDashedEllipse(cxs, botY, rx, ry);
    body += `<line x1="${num(cxs - rx)}" y1="${num(topY)}" x2="${num(cxs - rx)}" y2="${num(botY)}"
      stroke="${C_LINE}" stroke-width="1.8"/>`;
    body += `<line x1="${num(cxs + rx)}" y1="${num(topY)}" x2="${num(cxs + rx)}" y2="${num(botY)}"
      stroke="${C_LINE}" stroke-width="1.8"/>`;
    body += `<ellipse cx="${num(cxs)}" cy="${num(topY)}" rx="${num(rx)}" ry="${num(ry)}"
      fill="none" stroke="${C_LINE}" stroke-width="1.8"/>`;
    [topY, botY].forEach(y => {
      body += `<line x1="${num(cxs - rx)}" y1="${num(y)}" x2="${num(cxs + rx)}" y2="${num(y)}"
        stroke="${C_LINE}" stroke-width="1.8"/>`;
    });
    body += `<rect x="${num(cxs - rx)}" y="${num(topY)}" width="${num(rx * 2)}" height="${num(botY - topY)}"
      fill="${C_FILL}" opacity="0.12"/>`;
    body += txt(cxs, topY - 14, "\\text{cut face}", { size:11, fill:C_ALT });
    body += `<line x1="${num(cxs)}" y1="${num(topY)}" x2="${num(cxs + rx)}" y2="${num(topY)}"
      stroke="${C_ALT}" stroke-width="1.4" stroke-dasharray="3 3"/>`;
    body += txt(cxs + rx / 2, topY - 26, solidDimLabel(d.r, unit, "r"), { size:12, fill:C_ALT, weight:600 });
    body += txt(cxs + rx + 16, (topY + botY) / 2, solidDimLabel(d.h, unit, "h"),
      { size:12, fill:C_AXIS, weight:600, anchor:"start" });
    return svg(body, W, num(botY + ry + 20));
  }

  if (shape === "cone"){
    const r = +d.r || 1, ht = +d.h || 1;
    const rawW = 2 * r, rawH = ht + r * 0.4;
    const scale = Math.min((W - margin * 2) / rawW, (h - margin * 2) / rawH);
    const rx = r * scale, ry = r * 0.4 * scale, cxs = W / 2;
    const apexY = margin, botY = apexY + ht * scale;
    let body = "";
    body += halfDashedEllipse(cxs, botY, rx, ry);
    body += `<line x1="${num(cxs)}" y1="${num(apexY)}" x2="${num(cxs - rx)}" y2="${num(botY)}"
      stroke="${C_LINE}" stroke-width="1.8"/>`;
    body += `<line x1="${num(cxs)}" y1="${num(apexY)}" x2="${num(cxs + rx)}" y2="${num(botY)}"
      stroke="${C_LINE}" stroke-width="1.8"/>`;
    body += `<line x1="${num(cxs)}" y1="${num(botY)}" x2="${num(cxs + rx)}" y2="${num(botY)}"
      stroke="${C_ALT}" stroke-width="1.4" stroke-dasharray="3 3"/>`;
    body += txt(cxs + rx / 2, botY + 16, solidDimLabel(d.r, unit, "r"), { size:12, fill:C_ALT, weight:600 });
    body += txt(cxs + rx * 0.55, (apexY + botY) / 2 - 4, solidDimLabel(d.h, unit, "h"),
      { size:12, fill:C_AXIS, weight:600, anchor:"start" });
    return svg(body, W, num(botY + ry + 40));
  }

  if (shape === "sphere"){
    const r = +d.r || 1;
    const scale = Math.min((W - margin * 2) / (2 * r), (h - margin * 2) / (2 * r));
    const rad = r * scale, cx = W / 2, cy = h / 2;
    let body = "";
    body += `<circle cx="${num(cx)}" cy="${num(cy)}" r="${num(rad)}" fill="none" stroke="${C_LINE}" stroke-width="1.8"/>`;
    body += `<ellipse cx="${num(cx)}" cy="${num(cy)}" rx="${num(rad)}" ry="${num(rad * 0.35)}"
      fill="none" stroke="${C_LINE}" stroke-width="1.2" stroke-dasharray="4 4"/>`;
    body += `<line x1="${num(cx)}" y1="${num(cy)}" x2="${num(cx + rad)}" y2="${num(cy)}"
      stroke="${C_ALT}" stroke-width="1.4" stroke-dasharray="3 3"/>`;
    body += txt(cx + rad / 2, cy - 10, solidDimLabel(d.r, unit, "r"), { size:12, fill:C_ALT, weight:600 });
    return svg(body, W, h);
  }

  // A vertical stack of curved parts sharing one axis — cylinder(s) topped/based
  // by a cone or hemisphere "dome" cap — for composite solids like a silo
  // (cylinder + cone roof), a buoy (dome + cylinder + dome) or a two-tier
  // cylinder. A cone/dome's flat circular face always joins the neighbouring
  // part; its apex/curve points outward, away from the rest of the stack, so
  // it can only ever be the first or last part, never in the middle.
  if (shape === "stack"){
    const parts = spec.parts || [];
    const n = parts.length;
    if (n < 2) throw new Error("stack needs at least 2 parts");
    parts.forEach((p, i) => {
      const s = String(p.shape || "").toLowerCase();
      if (s !== "cylinder" && s !== "cone" && s !== "dome")
        throw new Error("unknown stack part shape: " + p.shape);
      if ((s === "cone" || s === "dome") && i !== 0 && i !== n - 1)
        throw new Error("cone/dome parts must be at the top or bottom of a stack");
    });
    const ECC = 0.4;
    const extentOf = p => String(p.shape).toLowerCase() === "dome" ? (+p.r || 1) : (+p.h || 1);
    const maxR = Math.max(...parts.map(p => +p.r || 1));
    const totalH = parts.reduce((s, p) => s + extentOf(p), 0);
    const rawW = 2 * maxR, rawH = totalH + maxR * ECC * 2;
    const scale = Math.min((W - margin * 2) / rawW, (h - margin * 2) / rawH);
    const cxs = W / 2;
    const botY = margin + maxR * ECC * scale + totalH * scale;

    // levels[i] = screen y of the boundary below part i; levels[i+1] = above it.
    // Built bottom-to-top, so levels[0] is the lowest point of the whole figure.
    const levels = [botY];
    parts.forEach(p => levels.push(levels[levels.length - 1] - extentOf(p) * scale));

    const line = (x1, y1, x2, y2) => `<line x1="${num(x1)}" y1="${num(y1)}" x2="${num(x2)}" y2="${num(y2)}"
      stroke="${C_LINE}" stroke-width="1.8"/>`;
    const fullEllipse = (cy, rx, ry) => `<ellipse cx="${num(cxs)}" cy="${num(cy)}" rx="${num(rx)}" ry="${num(ry)}"
      fill="none" stroke="${C_LINE}" stroke-width="1.8"/>`;

    let body = "";
    for (let i = 1; i < n; i++){
      const r = Math.max(+parts[i - 1].r || 1, +parts[i].r || 1);
      body += fullEllipse(levels[i], r * scale, r * ECC * scale);
    }

    parts.forEach((p, i) => {
      const s = String(p.shape).toLowerCase();
      const r = +p.r || 1, rx = r * scale, ry = r * ECC * scale;
      const yLow = levels[i], yHigh = levels[i + 1];
      const isBottom = i === 0, isTop = i === n - 1;
      if (s === "cylinder"){
        body += line(cxs - rx, yHigh, cxs - rx, yLow) + line(cxs + rx, yHigh, cxs + rx, yLow);
        if (isBottom) body += halfDashedEllipse(cxs, yLow, rx, ry);
        if (isTop) body += fullEllipse(yHigh, rx, ry);
        body += txt(cxs + rx + 16, (yLow + yHigh) / 2, solidDimLabel(p.h, unit, "h"),
          { size:12, fill:C_AXIS, weight:600, anchor:"start" });
      } else if (s === "cone"){
        const apexY = isBottom ? yLow : yHigh, rimY = isBottom ? yHigh : yLow;
        body += line(cxs, apexY, cxs - rx, rimY) + line(cxs, apexY, cxs + rx, rimY);
        body += txt(cxs + rx * 0.55, (apexY + rimY) / 2, solidDimLabel(p.h, unit, "h"),
          { size:12, fill:C_AXIS, weight:600, anchor:"start" });
        body += txt(cxs + rx / 2, rimY + (isBottom ? -8 : 16), solidDimLabel(p.r, unit, "r"),
          { size:12, fill:C_ALT, weight:600 });
      } else if (s === "dome"){
        const flatY = isBottom ? yHigh : yLow, tipY = isBottom ? yLow : yHigh;
        const sweep = isBottom ? 1 : 0;
        body += `<path d="M ${num(cxs - rx)} ${num(flatY)} A ${num(rx)} ${num(Math.abs(tipY - flatY))} 0 0 ${sweep}
          ${num(cxs + rx)} ${num(flatY)}" fill="none" stroke="${C_LINE}" stroke-width="1.8"/>`;
        body += txt(cxs + rx / 2, (flatY + tipY) / 2, solidDimLabel(p.r, unit, "r"), { size:12, fill:C_ALT, weight:600 });
      }
    });
    return svg(body, W, num(botY + maxR * ECC * scale + 20));
  }

  let verts = {}, solidEdges = [], dashedEdges = [], dimLabels = [], guides = [];

  if (shape === "cube" || shape === "cuboid"){
    const l = +d.l || +d.s || 1, ht = +d.h || +d.s || 1, w = +d.w || +d.s || 1;
    verts = {
      FBL:[0,0,0], FBR:[l,0,0], FTR:[l,ht,0], FTL:[0,ht,0],
      BBL:[0,0,w], BBR:[l,0,w], BTR:[l,ht,w], BTL:[0,ht,w]
    };
    solidEdges = [["FBL","FBR"],["FBR","FTR"],["FTR","FTL"],["FTL","FBL"],
      ["FTL","BTL"],["BTL","BTR"],["BTR","FTR"],["FBR","BBR"],["BBR","BTR"]];
    dashedEdges = [["BBL","FBL"],["BBL","BBR"],["BBL","BTL"]];
    dimLabels = [
      { a:"FBL", b:"FBR", text: solidDimLabel(d.l ?? d.s, unit, "l") },
      { a:"FBR", b:"BBR", text: solidDimLabel(d.w ?? d.s, unit, "w") },
      { a:"FBR", b:"FTR", text: solidDimLabel(d.h ?? d.s, unit, "h") }
    ];
  } else if (shape === "triangularprism"){
    const b = +d.base || 1, ht = +d.height || 1, L = +d.length || 1;
    verts = {
      A:[0,0,0], B:[0,0,b], C:[0,ht,b/2],
      A2:[L,0,0], B2:[L,0,b], C2:[L,ht,b/2]
    };
    solidEdges = [["A","B"],["B","C"],["C","A"],["A","A2"],["C","C2"],["C2","A2"],["B2","C2"]];
    dashedEdges = [["B","B2"],["A2","B2"]];
    dimLabels = [
      { a:"A", b:"B", text: solidDimLabel(d.base, unit, "base") },
      { a:"A", b:"C", text: solidDimLabel(d.height, unit, "height") },
      { a:"A", b:"A2", text: solidDimLabel(d.length, unit, "length") }
    ];
  } else if (shape === "squarepyramid"){
    const b = +d.base || 1, ht = +d.height || 1;
    verts = { FL:[0,0,0], FR:[b,0,0], BR:[b,0,b], BL:[0,0,b], APEX:[b/2,ht,b/2], BASECTR:[b/2,0,b/2] };
    solidEdges = [["FL","FR"],["FR","BR"],["FR","APEX"],["FL","APEX"],["BR","APEX"]];
    dashedEdges = [["FL","BL"],["BL","BR"],["BL","APEX"]];
    guides = [["APEX","BASECTR"]];
    dimLabels = [
      { a:"FL", b:"FR", text: solidDimLabel(d.base, unit, "base") },
      { a:"APEX", b:"BASECTR", text: solidDimLabel(d.height, unit, "height") }
    ];
  } else if (shape === "tetrahedron" || shape === "triangularpyramid"){
    const b = +d.base || 1, ht = +d.height || 1;
    verts = {
      FL:[0,0,0], FR:[b,0,0], BACK:[b/2,0,b*0.87],
      APEX:[b/2,ht,b*0.29], BASECTR:[b/2,0,b*0.29]
    };
    solidEdges = [["FL","FR"],["FR","BACK"],["APEX","FL"],["APEX","FR"]];
    dashedEdges = [["FL","BACK"],["APEX","BACK"]];
    guides = [["APEX","BASECTR"]];
    dimLabels = [
      { a:"FL", b:"FR", text: solidDimLabel(d.base, unit, "base") },
      { a:"APEX", b:"BASECTR", text: solidDimLabel(d.height, unit, "height") }
    ];
  } else if (shape === "hexagonalpyramid"){
    // A flat-topped hexagon base (front edge FL-FR, back edge BL-BR, and one
    // side vertex sticking out left/right at mid-depth) — the same kind of
    // stylised, not geometrically-exact, oblique sketch as the other solids
    // here. d.base sets the base's overall width if given (schematic only —
    // these questions usually give the base's AREA directly, via d.baseArea,
    // rather than a side length, since "area of base x height / 3" doesn't
    // need one), d.height the pyramid's height.
    const b = +d.base || 1, ht = +d.height || 1, dep = b * 0.75;
    verts = {
      FL:[b*0.25,0,0], FR:[b*0.75,0,0], MR:[b,0,dep/2],
      BR:[b*0.75,0,dep], BL:[b*0.25,0,dep], ML:[0,0,dep/2],
      APEX:[b/2,ht,dep/2], BASECTR:[b/2,0,dep/2]
    };
    solidEdges = [["FL","FR"],["FR","MR"],["ML","FL"],
      ["APEX","FL"],["APEX","FR"],["APEX","ML"],["APEX","MR"]];
    dashedEdges = [["MR","BR"],["BR","BL"],["BL","ML"],["APEX","BR"],["APEX","BL"]];
    guides = [["APEX","BASECTR"]];
    dimLabels = d.baseArea !== undefined && d.baseArea !== null && d.baseArea !== ""
      ? [{ a:"APEX", b:"BASECTR", text: solidDimLabel(d.height, unit, "height") },
         { a:"FL", b:"BR", text: `\\text{area of base }= ${num(+d.baseArea)}${unit ? "\\," + unit + "^2" : ""}` }]
      : [{ a:"FL", b:"FR", text: solidDimLabel(d.base, unit, "base") },
         { a:"APEX", b:"BASECTR", text: solidDimLabel(d.height, unit, "height") }];
  } else if (shape === "octahedron"){
    const b = +d.base || +d.s || 1, ht = +d.height || b;
    verts = {
      FL:[0,0,0], FR:[b,0,0], BR:[b,0,b], BL:[0,0,b],
      TOP:[b/2,ht/2,b/2], BOT:[b/2,-ht/2,b/2]
    };
    solidEdges = [["FL","FR"],["FR","BR"],
      ["TOP","FL"],["TOP","FR"],["TOP","BR"],
      ["BOT","FL"],["BOT","FR"],["BOT","BR"]];
    dashedEdges = [["BR","BL"],["BL","FL"],["TOP","BL"],["BOT","BL"]];
    dimLabels = [{ a:"FL", b:"FR", text: solidDimLabel(d.base ?? d.s, unit, "edge") }];
  } else {
    throw new Error("unknown solid shape");
  }

  const rel = {};
  Object.keys(verts).forEach(k => { rel[k] = obliqueProject(...verts[k]); });
  const xs = Object.values(rel).map(p => p.px), ys = Object.values(rel).map(p => p.py);
  const bw = Math.max(...xs) - Math.min(...xs) || 1, bh = Math.max(...ys) - Math.min(...ys) || 1;
  const scale = Math.min((W - margin * 2) / bw, (h - margin * 2) / bh);
  const midx = (Math.max(...xs) + Math.min(...xs)) / 2, midy = (Math.max(...ys) + Math.min(...ys)) / 2;
  const pt = k => ({ x: W / 2 + (rel[k].px - midx) * scale, y: h / 2 + (rel[k].py - midy) * scale });

  let body = "";
  dashedEdges.forEach(([a, b]) => {
    const pa = pt(a), pb = pt(b);
    body += `<line x1="${num(pa.x)}" y1="${num(pa.y)}" x2="${num(pb.x)}" y2="${num(pb.y)}"
      stroke="${C_LINE}" stroke-width="1.6" stroke-dasharray="5 4"/>`;
  });
  guides.forEach(([a, b]) => {
    const pa = pt(a), pb = pt(b);
    body += `<line x1="${num(pa.x)}" y1="${num(pa.y)}" x2="${num(pb.x)}" y2="${num(pb.y)}"
      stroke="${C_ALT}" stroke-width="1.4" stroke-dasharray="2 3"/>`;
  });
  solidEdges.forEach(([a, b]) => {
    const pa = pt(a), pb = pt(b);
    body += `<line x1="${num(pa.x)}" y1="${num(pa.y)}" x2="${num(pb.x)}" y2="${num(pb.y)}"
      stroke="${C_LINE}" stroke-width="2"/>`;
  });
  dimLabels.forEach(({ a, b, text }) => {
    const pa = pt(a), pb = pt(b);
    const mx = (pa.x + pb.x) / 2, my = (pa.y + pb.y) / 2;
    const dx = pb.x - pa.x, dy = pb.y - pa.y, len = Math.hypot(dx, dy) || 1;
    const ox = -dy / len * 13, oy = dx / len * 13;
    body += txt(mx + ox, my + oy, text, { size:12, weight:600, fill:C_ALT, bg:"rgba(255,255,255,0.85)" });
  });

  return svg(body, W, h);
};

FIG.net = spec => {
  const shape = String(spec.shape || "").toLowerCase();
  const d = spec.dims || {};
  const unit = spec.unit || "";
  const margin = 40;
  let rects = [], tris = [], circles = [], totalW, totalH;

  const rect = (x, y, w, h, label) => rects.push({ x, y, w, h, label });
  const tri = (pts, label) => tris.push({ pts, label });

  if (shape === "cube" || shape === "cuboid"){
    const l = +d.l || +d.s || 1, ht = +d.h || +d.s || 1, w = +d.w || +d.s || 1;
    rect(w, 0, l, w, "Top");
    rect(0, w, w, ht, "Left");
    rect(w, w, l, ht, "Front");
    rect(w + l, w, w, ht, "Right");
    rect(w + l + w, w, l, ht, "Back");
    rect(w, w + ht, l, w, "Bottom");
    totalW = 2 * w + 2 * l; totalH = 2 * w + ht;
  } else if (shape === "triangularprism"){
    const b = +d.base || 1, ht = +d.height || 1, L = +d.length || 1;
    const s = Math.sqrt((b / 2) ** 2 + ht ** 2);
    rect(0, s, s, L, "");
    rect(s, s, b, L, "");
    rect(s + b, s, s, L, "");
    tri([[s, s], [s + b, s], [s + b / 2, 0]], "");
    tri([[s, s + L], [s + b, s + L], [s + b / 2, s + L + ht]], "");
    totalW = 2 * s + b; totalH = s + L + ht;
  } else if (shape === "squarepyramid"){
    const b = +d.base || 1, ht = +d.height || 1;
    const sl = Math.sqrt(ht ** 2 + (b / 2) ** 2);
    rect(sl, sl, b, b, "");
    tri([[sl, sl], [sl + b, sl], [sl + b / 2, 0]], "");
    tri([[sl, sl + b], [sl + b, sl + b], [sl + b / 2, sl * 2 + b]], "");
    tri([[sl, sl], [sl, sl + b], [0, sl + b / 2]], "");
    tri([[sl + b, sl], [sl + b, sl + b], [sl * 2 + b, sl + b / 2]], "");
    totalW = 2 * sl + b; totalH = 2 * sl + b;
  } else if (shape === "cylinder"){
    const r = +d.r || 1, ht = +d.h || 1, circ = 2 * Math.PI * r;
    rect(0, r, circ, ht, "");
    circles.push({ cx: circ / 2, cy: r, r });
    circles.push({ cx: circ / 2, cy: r + ht + r, r });
    totalW = circ; totalH = ht + 4 * r;
  } else if (shape === "pyramid"){
    // A general polygon-based right pyramid (kite, rectangle, irregular
    // quadrilateral, pentagon, ...), apex directly above the base's centroid.
    // The base draws as its own true shape; each side's triangular face is
    // unfolded outward by triangulating from the two known slant lengths
    // (apex-to-each-base-vertex), placing the unfolded apex on whichever of
    // the two solutions sits farther from the centroid — i.e. outside the
    // base, the way a real net unfolds.
    const baseVerts = (d.baseVertices || []).map(p => ({ x:+p.x, y:+p.y }));
    const ht = +d.height || 1;
    const n = baseVerts.length;
    if (n < 3) throw new Error("a pyramid net needs at least 3 base vertices");
    const cx = baseVerts.reduce((a, p) => a + p.x, 0) / n, cy = baseVerts.reduce((a, p) => a + p.y, 0) / n;
    const slant = baseVerts.map(p => Math.sqrt((p.x - cx) ** 2 + (p.y - cy) ** 2 + ht ** 2));

    const unfolded = [];
    for (let i = 0; i < n; i++){
      const v1 = baseVerts[i], v2 = baseVerts[(i + 1) % n];
      const L1 = slant[i], L2 = slant[(i + 1) % n];
      const dx = v2.x - v1.x, dy = v2.y - v1.y, edgeLen = Math.hypot(dx, dy);
      const a = (L1 * L1 - L2 * L2 + edgeLen * edgeLen) / (2 * edgeLen);
      const hDist = Math.sqrt(Math.max(0, L1 * L1 - a * a));
      const midx = v1.x + a * dx / edgeLen, midy = v1.y + a * dy / edgeLen;
      const perpx = -dy / edgeLen, perpy = dx / edgeLen;
      const cand1 = { x: midx + perpx * hDist, y: midy + perpy * hDist };
      const cand2 = { x: midx - perpx * hDist, y: midy - perpy * hDist };
      const farther = Math.hypot(cand1.x - cx, cand1.y - cy) > Math.hypot(cand2.x - cx, cand2.y - cy) ? cand1 : cand2;
      unfolded.push(farther);
    }

    const allPts = baseVerts.concat(unfolded);
    const minX = Math.min(...allPts.map(p => p.x)), minY = Math.min(...allPts.map(p => p.y));
    const shiftedBase = baseVerts.map(p => [p.x - minX, p.y - minY]);
    const shiftedApex = unfolded.map(p => [p.x - minX, p.y - minY]);
    tri(shiftedBase, "");
    for (let i = 0; i < n; i++) tri([shiftedBase[i], shiftedBase[(i + 1) % n], shiftedApex[i]], "");
    totalW = Math.max(...allPts.map(p => p.x)) - minX;
    totalH = Math.max(...allPts.map(p => p.y)) - minY;
  } else if (shape === "tetrahedron"){
    // One equilateral triangle of side 2b, quartered into 4 triangles of side
    // b by its own edge midpoints — 3 upright corner triangles plus one
    // inverted centre triangle. The standard tetrahedron net.
    const b = +d.base || 1, ht3 = b * 0.87;
    const top = [b, 0], midL = [b / 2, ht3], midR = [b * 1.5, ht3],
      botL = [0, ht3 * 2], botM = [b, ht3 * 2], botR = [2 * b, ht3 * 2];
    tri([top, midL, midR], "");
    tri([midL, botL, botM], "");
    tri([midR, botM, botR], "");
    tri([midL, midR, botM], "");
    totalW = 2 * b; totalH = ht3 * 2;
  } else {
    throw new Error("unknown net shape");
  }

  const h = 400;
  const scale = Math.min((W - margin * 2) / totalW, (h - margin * 2) / totalH);
  const ox = (W - totalW * scale) / 2, oy = (h - totalH * scale) / 2;
  const X = v => ox + v * scale, Y = v => oy + v * scale;

  let body = "";
  rects.forEach(r => {
    body += `<rect x="${num(X(r.x))}" y="${num(Y(r.y))}" width="${num(r.w * scale)}" height="${num(r.h * scale)}"
      fill="${C_FILL}" fill-opacity="0.10" stroke="${C_LINE}" stroke-width="1.8"/>`;
    if (r.label) body += txt(X(r.x) + r.w * scale / 2, Y(r.y) + r.h * scale / 2, r.label,
      { size:12, fill:C_AXIS });
  });
  tris.forEach(t => {
    const d3 = t.pts.map((p, i) => `${i ? "L" : "M"}${num(X(p[0]))} ${num(Y(p[1]))}`).join(" ") + " Z";
    body += `<path d="${d3}" fill="${C_FILL}" fill-opacity="0.10" stroke="${C_LINE}" stroke-width="1.8"/>`;
  });
  circles.forEach(c => {
    body += `<circle cx="${num(X(c.cx))}" cy="${num(Y(c.cy))}" r="${num(c.r * scale)}"
      fill="${C_FILL}" fill-opacity="0.10" stroke="${C_LINE}" stroke-width="1.8"/>`;
  });
  return svg(body, W, h);
};

// Front/side/top orthographic views of the same basic solids FIG.solid draws
// in one oblique picture — a different skill from that single 3-D view and
// from FIG.net's unfolded net: three flat 2-D panels, each what you'd see
// looking straight at the solid from one direction. Reuses FIG.solid's own
// shape/dims vocabulary so a "views" spec and a "solid" spec for the same
// object use identical fields.
FIG.views = spec => {
  const shape = String(spec.shape || "").toLowerCase();
  const d = spec.dims || {};
  const unit = spec.unit || "";
  const h = 260, panelW = W / 3, margin = 18, labelH = 26;
  const innerW = panelW - margin * 2, innerH = h - labelH - margin * 2;

  let list;
  if (shape === "cuboid" || shape === "cube"){
    const l = +d.l || +d.s || 1, w = +d.w || +d.s || 1, ht = +d.h || +d.s || 1;
    list = [
      { title:"Front view", kind:"rect", wTrue:l, hTrue:ht },
      { title:"Side view", kind:"rect", wTrue:w, hTrue:ht },
      { title:"Top view", kind:"rect", wTrue:l, hTrue:w }
    ];
  } else if (shape === "triangularprism"){
    const b = +d.base || 1, ht = +d.height || 1, len = +d.length || 1;
    list = [
      { title:"Front view", kind:"triangle", baseTrue:b, heightTrue:ht },
      { title:"Side view", kind:"rect", wTrue:len, hTrue:ht },
      { title:"Top view", kind:"rect", wTrue:len, hTrue:b }
    ];
  } else if (shape === "squarepyramid"){
    const b = +d.base || 1, ht = +d.height || 1;
    list = [
      { title:"Front view", kind:"triangle", baseTrue:b, heightTrue:ht },
      { title:"Side view", kind:"triangle", baseTrue:b, heightTrue:ht },
      { title:"Top view", kind:"squarex", sideTrue:b }
    ];
  } else if (shape === "cylinder"){
    const r = +d.r || 1, ht = +d.h || 1;
    list = [
      { title:"Front view", kind:"rect", wTrue:2 * r, hTrue:ht },
      { title:"Side view", kind:"rect", wTrue:2 * r, hTrue:ht },
      { title:"Top view", kind:"circle", rTrue:r }
    ];
  } else if (shape === "cone"){
    const r = +d.r || 1, ht = +d.h || 1;
    list = [
      { title:"Front view", kind:"triangle", baseTrue:2 * r, heightTrue:ht },
      { title:"Side view", kind:"triangle", baseTrue:2 * r, heightTrue:ht },
      { title:"Top view", kind:"circle", rTrue:r }
    ];
  } else {
    throw new Error("unsupported shape for views: " + shape);
  }

  let body = "";
  list.forEach((p, i) => {
    const panelX = i * panelW;
    body += txt(panelX + panelW / 2, 16, p.title, { size:13, weight:700, fill:C_LINE });
    if (i > 0) body += `<line x1="${num(panelX)}" y1="0" x2="${num(panelX)}" y2="${h}" stroke="${C_GRID}" stroke-width="1"/>`;

    const cx = panelX + panelW / 2, cyBase = h - margin;
    if (p.kind === "rect"){
      const scale = Math.min(innerW / p.wTrue, innerH / p.hTrue);
      const ww = p.wTrue * scale, hh = p.hTrue * scale;
      const x0 = cx - ww / 2, y0 = cyBase - hh;
      body += `<rect x="${num(x0)}" y="${num(y0)}" width="${num(ww)}" height="${num(hh)}"
        fill="${C_FILL}" fill-opacity="0.12" stroke="${C_LINE}" stroke-width="1.8"/>`;
      body += txt(cx, y0 - 10, solidDimLabel(p.wTrue, unit, ""), { size:11, fill:C_ALT });
      body += txt(x0 - 14, cyBase - hh / 2, solidDimLabel(p.hTrue, unit, ""), { size:11, fill:C_AXIS, anchor:"end" });
    } else if (p.kind === "triangle"){
      const scale = Math.min(innerW / p.baseTrue, innerH / p.heightTrue);
      const bb = p.baseTrue * scale, hh = p.heightTrue * scale;
      const x0 = cx - bb / 2, x1 = cx + bb / 2, yBase = cyBase, yApex = cyBase - hh;
      body += `<path d="M ${num(x0)} ${num(yBase)} L ${num(x1)} ${num(yBase)} L ${num(cx)} ${num(yApex)} Z"
        fill="${C_FILL}" fill-opacity="0.12" stroke="${C_LINE}" stroke-width="1.8"/>`;
      body += txt(cx, yBase + 14, solidDimLabel(p.baseTrue, unit, ""), { size:11, fill:C_ALT });
      body += txt(x0 - 10, (yBase + yApex) / 2, solidDimLabel(p.heightTrue, unit, ""), { size:11, fill:C_AXIS, anchor:"end" });
    } else if (p.kind === "circle"){
      const scale = Math.min(innerW, innerH) / (2 * p.rTrue);
      const rr = p.rTrue * scale;
      body += `<circle cx="${num(cx)}" cy="${num(cyBase - rr)}" r="${num(rr)}"
        fill="${C_FILL}" fill-opacity="0.12" stroke="${C_LINE}" stroke-width="1.8"/>`;
      body += txt(cx, cyBase - rr - 12, solidDimLabel(p.rTrue, unit, "r"), { size:11, fill:C_ALT });
    } else if (p.kind === "squarex"){
      const scale = Math.min(innerW, innerH) / p.sideTrue;
      const ss = p.sideTrue * scale;
      const x0 = cx - ss / 2, y0 = cyBase - ss, x1 = cx + ss / 2, y1 = cyBase;
      body += `<rect x="${num(x0)}" y="${num(y0)}" width="${num(ss)}" height="${num(ss)}"
        fill="${C_FILL}" fill-opacity="0.12" stroke="${C_LINE}" stroke-width="1.8"/>`;
      body += `<line x1="${num(x0)}" y1="${num(y0)}" x2="${num(x1)}" y2="${num(y1)}" stroke="${C_ALT}" stroke-width="1.2" stroke-dasharray="3 3"/>`;
      body += `<line x1="${num(x1)}" y1="${num(y0)}" x2="${num(x0)}" y2="${num(y1)}" stroke="${C_ALT}" stroke-width="1.2" stroke-dasharray="3 3"/>`;
      body += txt(cx, y0 - 10, solidDimLabel(p.sideTrue, unit, ""), { size:11, fill:C_ALT });
    }
  });

  return svg(body, W, h);
};

// True isometric projection (three axes 120° apart, not the oblique projection
// FIG.solid uses) for an arbitrary cluster of stacked unit cubes: u/v are the
// grid's two horizontal axes and both point down-and-outward on screen, z
// (height) points straight up. A light isometric dot lattice sits behind the
// cubes, matching the "isometric dot paper" students are actually given.
FIG.isocubes = spec => {
  const heights = spec.heights || [];
  if (!heights.length || !heights.some(row => (row || []).some(v => +v > 0))){
    throw new Error("need a non-empty heights grid");
  }
  const rows = heights.length, cols = Math.max(...heights.map(r => (r || []).length));
  const COS30 = Math.sqrt(3) / 2, SIN30 = 0.5;
  const proj = (u, v, z) => ({ x: (u - v) * COS30, y: (u + v) * SIN30 - z });

  const heightAt = (c, r) => {
    if (r < 0 || r >= rows || c < 0 || c >= cols) return 0;
    return Math.max(0, Math.trunc(+((heights[r] || [])[c]) || 0));
  };
  const cells = [];
  for (let r = 0; r < rows; r++){
    for (let c = 0; c < cols; c++){
      const hgt = heightAt(c, r);
      if (hgt > 0) cells.push({ col:c, row:r, h:hgt });
    }
  }
  if (!cells.length) throw new Error("no cubes given");

  const allPts = [];
  cells.forEach(({ col, row, h }) => {
    [0, 1].forEach(du => [0, 1].forEach(dv => {
      allPts.push(proj(col + du, row + dv, 0));
      allPts.push(proj(col + du, row + dv, h));
    }));
  });
  const xs = allPts.map(p => p.x), ys = allPts.map(p => p.y);
  const margin = 56, h = 380;
  const bw = Math.max(...xs) - Math.min(...xs) || 1, bh = Math.max(...ys) - Math.min(...ys) || 1;
  const scale = Math.min((W - margin * 2) / bw, (h - margin * 2) / bh);
  const midx = (Math.max(...xs) + Math.min(...xs)) / 2, midy = (Math.max(...ys) + Math.min(...ys)) / 2;
  const screen = (u, v, z) => {
    const p = proj(u, v, z);
    return { x: W / 2 + (p.x - midx) * scale, y: h / 2 + (p.y - midy) * scale };
  };

  let body = "";
  // Dot lattice: every lattice point one grid step beyond the cubes' own
  // footprint on every side, so the cubes sit visibly inside a field of dots
  // rather than right at its edge.
  for (let r = -1; r <= rows + 1; r++){
    for (let c = -1; c <= cols + 1; c++){
      const p = screen(c, r, 0);
      if (p.x >= -10 && p.x <= W + 10 && p.y >= -10 && p.y <= h + 10){
        body += `<circle cx="${num(p.x)}" cy="${num(p.y)}" r="2" fill="${C_GRID}"/>`;
      }
    }
  }

  const quad = (pts, fill) => {
    const d = pts.map((p, i) => `${i ? "L" : "M"}${num(p.x)} ${num(p.y)}`).join(" ") + " Z";
    return `<path d="${d}" fill="${fill}" stroke="${C_LINE}" stroke-width="1.6"/>`;
  };
  const TOP_FILL = blendWithWhite(C_FILL, 0.65), EAST_FILL = blendWithWhite(C_FILL, 0.4),
    SOUTH_FILL = blendWithWhite(C_FILL, 0.15);

  // A wall face is only drawn where nothing blocks it — the neighbouring
  // column's own height, not the full 0..own-height range regardless of what's
  // next door — which removes most redundant overdraw. But isometric
  // projection can still make a shorter column's top face and a taller
  // diagonal neighbour's wall share a screen-space corner even after that:
  // draw order (sorted by col+row, so the taller/nearer one paints later)
  // already covers it correctly, but the earlier fill-opacity overlays made
  // that correctly-covered overlap show up as a visibly blended patch —
  // hence solid, fully opaque fills instead of opacity here.
  cells.sort((a, b) => (a.col + a.row) - (b.col + b.row));
  cells.forEach(({ col, row, h: hgt }) => {
    const eastH = heightAt(col + 1, row), southH = heightAt(col, row + 1);
    for (let k = eastH; k < hgt; k++){
      body += quad([
        screen(col + 1, row, k), screen(col + 1, row + 1, k),
        screen(col + 1, row + 1, k + 1), screen(col + 1, row, k + 1)
      ], EAST_FILL);
    }
    for (let k = southH; k < hgt; k++){
      body += quad([
        screen(col, row + 1, k), screen(col + 1, row + 1, k),
        screen(col + 1, row + 1, k + 1), screen(col, row + 1, k + 1)
      ], SOUTH_FILL);
    }
    body += quad([
      screen(col, row, hgt), screen(col + 1, row, hgt),
      screen(col + 1, row + 1, hgt), screen(col, row + 1, hgt)
    ], TOP_FILL);
  });

  return svg(body, W, h);
};

// A labelled 3-D coordinate frame (x, y, z axes with unit tick marks) for
// "read off the coordinates" questions — plotting either small unit cubes
// or plain points at given (x,y,z) positions. Uses the same isometric
// projection as FIG.isocubes so a cube drawn here looks identical to one
// in an isocubes figure, but the axes themselves (with numbered ticks) are
// what isocubes never draws — that figure is about a stacked footprint,
// this one is about reading a coordinate against a labelled frame.
FIG.cubeaxes = spec => {
  const N = Math.max(1, Math.trunc(+spec.size || 4));
  const cubes = spec.cubes || [];
  const points = spec.points || [];
  if (!cubes.length && !points.length) throw new Error("need cubes or points");
  const COS30 = Math.sqrt(3) / 2, SIN30 = 0.5;
  const proj = (x, y, z) => ({ x: (x - y) * COS30, y: (x + y) * SIN30 - z });

  // Bounding box always spans the full N x N x N frame, regardless of where
  // the cubes/points sit, so the axes are never cropped.
  const corners = [];
  [0, N].forEach(x => [0, N].forEach(y => [0, N].forEach(z => corners.push(proj(x, y, z)))));
  const xs = corners.map(p => p.x), ys = corners.map(p => p.y);
  const margin = 60, h = 400;
  const bw = Math.max(...xs) - Math.min(...xs) || 1, bh = Math.max(...ys) - Math.min(...ys) || 1;
  const scale = Math.min((W - margin * 2) / bw, (h - margin * 2) / bh);
  const midx = (Math.max(...xs) + Math.min(...xs)) / 2, midy = (Math.max(...ys) + Math.min(...ys)) / 2;
  const screen = (x, y, z) => {
    const p = proj(x, y, z);
    return { x: W / 2 + (p.x - midx) * scale, y: h / 2 + (p.y - midy) * scale };
  };

  let body = "";
  const line = (a, b, stroke, width, dash) => {
    const pa = screen(...a), pb = screen(...b);
    body += `<line x1="${num(pa.x)}" y1="${num(pa.y)}" x2="${num(pb.x)}" y2="${num(pb.y)}"
      stroke="${stroke}" stroke-width="${width}"${dash ? ` stroke-dasharray="${dash}"` : ""}/>`;
  };

  // Axis lines, each drawn to N + 0.6 so the arrowhead-ish overshoot and the
  // axis label sit just past the last tick.
  const AXES = [
    { end: [N + 0.6, 0, 0], label: "x" },
    { end: [0, N + 0.6, 0], label: "y" },
    { end: [0, 0, N + 0.6], label: "z" }
  ];
  AXES.forEach(a => {
    line([0, 0, 0], a.end, C_AXIS, 1.6);
    const lp = screen(...a.end);
    body += txt(lp.x, lp.y, a.label, { size:14, weight:700, fill:C_AXIS });
  });
  // Tick text defaults to plain numbers, but some textbook diagrams label an
  // axis with letters instead (e.g. columns A-D) — spec.labels.x/y/z, given
  // as an array indexed from tick 1, overrides that axis's tick text only.
  const tickLabels = spec.labels || {};
  const tickText = (axis, k) => (tickLabels[axis] && tickLabels[axis][k - 1] !== undefined)
    ? tickLabels[axis][k - 1] : num(k);
  for (let k = 1; k <= N; k++){
    [["x", k, 0, 0], ["y", 0, k, 0], ["z", 0, 0, k]].forEach(([axis, x, y, z]) => {
      const p = screen(x, y, z);
      body += txt(p.x, p.y, tickText(axis, k), { size:10, fill:C_AXIS });
    });
  }

  const quad = (pts, fill) => {
    const d = pts.map((p, i) => `${i ? "L" : "M"}${num(p.x)} ${num(p.y)}`).join(" ") + " Z";
    return `<path d="${d}" fill="${fill}" stroke="${C_LINE}" stroke-width="1.4"/>`;
  };
  const drawCube = (x, y, z, color) => {
    const base = color || C_FILL;
    const TOP_FILL = blendWithWhite(base, 0.65), EAST_FILL = blendWithWhite(base, 0.4),
      SOUTH_FILL = blendWithWhite(base, 0.15);
    body += quad([screen(x + 1, y, z), screen(x + 1, y + 1, z), screen(x + 1, y + 1, z + 1), screen(x + 1, y, z + 1)], EAST_FILL);
    body += quad([screen(x, y + 1, z), screen(x + 1, y + 1, z), screen(x + 1, y + 1, z + 1), screen(x, y + 1, z + 1)], SOUTH_FILL);
    body += quad([screen(x, y, z + 1), screen(x + 1, y, z + 1), screen(x + 1, y + 1, z + 1), screen(x, y + 1, z + 1)], TOP_FILL);
  };

  const drawList = cubes.map(c => ({ kind:"cube", x:+c.x, y:+c.y, z:+c.z, color:c.color, label:c.label,
    depth: +c.x + +c.y + +c.z }))
    .concat(points.map(p => ({ kind:"point", x:+p.x, y:+p.y, z:+p.z, label:p.label, depth: +p.x + +p.y + +p.z })));
  drawList.sort((a, b) => a.depth - b.depth);
  drawList.forEach(d => {
    if (d.kind === "cube"){
      drawCube(d.x, d.y, d.z, d.color);
      if (d.label){
        const c = screen(d.x + 0.5, d.y + 0.5, d.z + 0.5);
        body += txt(c.x, c.y, d.label, { size:11, weight:700, fill:"#fff" });
      }
    } else {
      const p = screen(d.x, d.y, d.z);
      body += `<circle cx="${num(p.x)}" cy="${num(p.y)}" r="4.5" fill="${C_ALT}" stroke="${C_LINE}" stroke-width="1.2"/>`;
      if (d.label) body += txt(p.x, p.y - 12, d.label, { size:12.5, weight:700, fill:C_LINE });
    }
  });

  return svg(body, W, h);
};

// A composite solid — several boxes and/or a pyramid joined together — drawn
// on plain square dot paper: unlike FIG.solid's 30-degree oblique projection
// (chosen to look reasonably 3-D without lining up to any grid), this uses a
// full unit-for-unit diagonal depth offset (x+z, -(y+z)) specifically so every
// vertex of an integer-dimensioned part lands exactly on a dot, the way a
// student actually draws one by hand.
FIG.compound = spec => {
  const parts = spec.parts || [];
  if (!parts.length) throw new Error("need at least one part");
  const P = (x, y, z) => ({ px: x + z, py: -(y + z) });

  const drawList = [];
  parts.forEach(part => {
    const o = part.origin || {};
    const ox = +o.x || 0, oy = +o.y || 0, oz = +o.z || 0;
    if (part.shape === "box"){
      const sz = part.size || {};
      const l = +sz.l || 1, ht = +sz.h || 1, w = +sz.w || 1;
      const v = {
        FBL:[ox,oy,oz], FBR:[ox+l,oy,oz], FTR:[ox+l,oy+ht,oz], FTL:[ox,oy+ht,oz],
        BBL:[ox,oy,oz+w], BBR:[ox+l,oy,oz+w], BTR:[ox+l,oy+ht,oz+w], BTL:[ox,oy+ht,oz+w]
      };
      const solidE = [["FBL","FBR"],["FBR","FTR"],["FTR","FTL"],["FTL","FBL"],
        ["FTL","BTL"],["BTL","BTR"],["BTR","FTR"],["FBR","BBR"],["BBR","BTR"]];
      const dashedE = [["BBL","FBL"],["BBL","BBR"],["BBL","BTL"]];
      drawList.push({ v, solidE, dashedE, depth: ox + oy + oz });
    } else if (part.shape === "pyramid"){
      const b = part.base || {};
      const l = +b.l || 1, w = +b.w || 1, ph = +part.height || 1;
      const v = {
        FL:[ox,oy,oz], FR:[ox+l,oy,oz], BR:[ox+l,oy,oz+w], BL:[ox,oy,oz+w],
        APEX:[ox+l/2, oy+ph, oz+w/2]
      };
      const solidE = [["FL","FR"],["FR","BR"],["FR","APEX"],["FL","APEX"],["BR","APEX"]];
      const dashedE = [["FL","BL"],["BL","BR"],["BL","APEX"]];
      drawList.push({ v, solidE, dashedE, depth: ox + oy + oz + 0.01 });
    } else {
      throw new Error("unknown compound part shape: " + part.shape);
    }
  });

  const allRaw = [];
  drawList.forEach(p => Object.values(p.v).forEach(pt => allRaw.push(P(...pt))));
  const xs = allRaw.map(p => p.px), ys = allRaw.map(p => p.py);
  const margin = 56, h = 380;
  const bw = Math.max(...xs) - Math.min(...xs) || 1, bh = Math.max(...ys) - Math.min(...ys) || 1;
  const scale = Math.min((W - margin * 2) / bw, (h - margin * 2) / bh);
  const midx = (Math.max(...xs) + Math.min(...xs)) / 2, midy = (Math.max(...ys) + Math.min(...ys)) / 2;
  const screen = (x, y, z) => {
    const p = P(x, y, z);
    return { x: W / 2 + (p.px - midx) * scale, y: h / 2 + (p.py - midy) * scale };
  };

  let body = "";
  if (spec.dots){
    const pxMin = Math.floor(Math.min(...xs)) - 1, pxMax = Math.ceil(Math.max(...xs)) + 1;
    const pyMin = Math.floor(Math.min(...ys)) - 1, pyMax = Math.ceil(Math.max(...ys)) + 1;
    for (let px = pxMin; px <= pxMax; px++){
      for (let py = pyMin; py <= pyMax; py++){
        const sx = W / 2 + (px - midx) * scale, sy = h / 2 + (py - midy) * scale;
        if (sx >= -10 && sx <= W + 10 && sy >= -10 && sy <= h + 10){
          body += `<circle cx="${num(sx)}" cy="${num(sy)}" r="2" fill="${C_GRID}"/>`;
        }
      }
    }
  }

  drawList.sort((a, b) => a.depth - b.depth);
  drawList.forEach(p => {
    const pt = k => screen(...p.v[k]);
    p.dashedE.forEach(([a, b]) => {
      const pa = pt(a), pb = pt(b);
      body += `<line x1="${num(pa.x)}" y1="${num(pa.y)}" x2="${num(pb.x)}" y2="${num(pb.y)}"
        stroke="${C_LINE}" stroke-width="1.6" stroke-dasharray="5 4"/>`;
    });
    p.solidE.forEach(([a, b]) => {
      const pa = pt(a), pb = pt(b);
      body += `<line x1="${num(pa.x)}" y1="${num(pa.y)}" x2="${num(pb.x)}" y2="${num(pb.y)}"
        stroke="${C_LINE}" stroke-width="2"/>`;
    });
  });

  return svg(body, W, h);
};

FIG.gridshape = spec => {
  const pts = (spec.points || []).map(p => ({ x:+p.x, y:+p.y }));
  if (pts.length < 3) throw new Error("need at least 3 points");
  const unit = spec.unit || "";
  const maxX = Math.max(...pts.map(p => p.x)), maxY = Math.max(...pts.map(p => p.y));
  const cols = Math.max(1, +spec.gridCols || Math.ceil(maxX) + 1);
  const rows = Math.max(1, +spec.gridRows || Math.ceil(maxY) + 1);

  const margin = 40, h = 380;
  const scale = Math.min((W - margin * 2) / cols, (h - margin * 2) / rows);
  const gridW = cols * scale, gridH = rows * scale;
  const ox = (W - gridW) / 2, oy = (h - gridH) / 2;
  const X = v => ox + v * scale, Y = v => oy + gridH - v * scale;

  let body = "";
  for (let c = 0; c <= cols; c++){
    body += `<line x1="${num(ox + c * scale)}" y1="${num(oy)}" x2="${num(ox + c * scale)}" y2="${num(oy + gridH)}"
      stroke="${C_GRID}" stroke-width="1.2"/>`;
  }
  for (let r = 0; r <= rows; r++){
    body += `<line x1="${num(ox)}" y1="${num(oy + r * scale)}" x2="${num(ox + gridW)}" y2="${num(oy + r * scale)}"
      stroke="${C_GRID}" stroke-width="1.2"/>`;
  }
  const d = pts.map((p, i) => `${i ? "L" : "M"}${num(X(p.x))} ${num(Y(p.y))}`).join(" ") + " Z";
  body += `<path d="${d}" fill="${C_FILL}" fill-opacity="0.18" stroke="${C_LINE}" stroke-width="2.4"/>`;
  if (unit) body += txt(ox + gridW / 2, oy + gridH + 24, `each square = 1 ${unit}²`,
    { size:12, fill:C_AXIS });

  return svg(body, W, h);
};

FIG.parallellines = spec => {
  // Two horizontal parallel lines cut by one transversal. The 4 angles at
  // each intersection sit at fixed bisector directions relative to the
  // transversal's own direction vector, not hardcoded compass directions —
  // that's what makes this work for any transversal tilt, not just one.
  const angleDeg = spec.angle !== undefined ? +spec.angle : 60;
  const h = 320, y1 = 110, y2 = 230, lineLeft = 70, lineRight = W - 70;
  const rad = angleDeg * Math.PI / 180;
  const dyT = y2 - y1, dxT = dyT / Math.tan(rad);
  const midX = W / 2;
  const p1 = { x: midX - dxT / 2, y: y1 }, p2 = { x: midX + dxT / 2, y: y2 };
  const len = Math.hypot(p2.x - p1.x, p2.y - p1.y) || 1;
  const ux = (p2.x - p1.x) / len, uy = (p2.y - p1.y) / len;
  const ext = 40;
  const tStart = { x: p1.x - ux * ext, y: p1.y - uy * ext };
  const tEnd = { x: p2.x + ux * ext, y: p2.y + uy * ext };

  let body = "";
  [y1, y2].forEach(y => {
    body += `<line x1="${num(lineLeft)}" y1="${num(y)}" x2="${num(lineRight)}" y2="${num(y)}"
      stroke="${C_LINE}" stroke-width="2"/>`;
    const mx = lineLeft + 40;
    body += `<path d="M ${num(mx - 6)} ${num(y - 5)} L ${num(mx + 4)} ${num(y)} L ${num(mx - 6)} ${num(y + 5)}"
      fill="none" stroke="${C_LINE}" stroke-width="1.6"/>`;
  });
  body += `<line x1="${num(tStart.x)}" y1="${num(tStart.y)}" x2="${num(tEnd.x)}" y2="${num(tEnd.y)}"
    stroke="${C_LINE}" stroke-width="2"/>`;

  const labelAt = (centre, quadrant, text) => {
    if (!text) return "";
    const r = 34;
    const upX = -ux, upY = -uy, downX = ux, downY = uy;
    let vx, vy;
    if (quadrant === "tl"){ vx = -1 + upX; vy = upY; }
    else if (quadrant === "tr"){ vx = 1 + upX; vy = upY; }
    else if (quadrant === "bl"){ vx = -1 + downX; vy = downY; }
    else { vx = 1 + downX; vy = downY; }
    const vlen = Math.hypot(vx, vy) || 1;
    return txt(centre.x + (vx / vlen) * r, centre.y + (vy / vlen) * r, text,
      { size:FIG_TEXT, weight:600, fill:C_LINE });
  };
  ["tl", "tr", "bl", "br"].forEach(q => { body += labelAt(p1, q, (spec.top || {})[q]); });
  ["tl", "tr", "bl", "br"].forEach(q => { body += labelAt(p2, q, (spec.bottom || {})[q]); });

  return svg(body, W, h);
};

FIG.piechart = spec => {
  // A general categorical pie/sector chart — distinct from piefraction,
  // which draws equal wedges for a single fraction, not proportional
  // wedges across several named categories.
  const cats = (spec.categories || []).map(c => ({ label:String(c.label || ""), value:+c.value || 0 }));
  if (!cats.length) throw new Error("no categories");
  const total = cats.reduce((a, c) => a + c.value, 0);
  if (!(total > 0)) throw new Error("total must be positive");
  const PALETTE = ["#4F2759", "#C59F40", "#6B3A78", "#8B6BA0", "#D9BC72", "#3A1E43"];
  const r = 110, cx = W / 2 - 60, cy = 180, h = 360;
  // angleDeg 0 is straight up, increasing clockwise, matching piefraction.
  const polar = (angleDeg, radius) => {
    const a = (angleDeg - 90) * Math.PI / 180;
    return { x: cx + radius * Math.cos(a), y: cy + radius * Math.sin(a) };
  };

  let body = "", cum = 0;
  cats.forEach((c, i) => {
    const a0 = cum / total * 360, a1 = (cum + c.value) / total * 360;
    const p0 = polar(a0, r), p1 = polar(a1, r);
    const largeArc = a1 - a0 > 180 ? 1 : 0;
    const colour = PALETTE[i % PALETTE.length];
    body += `<path d="M ${num(cx)} ${num(cy)} L ${num(p0.x)} ${num(p0.y)}
      A ${r} ${r} 0 ${largeArc} 1 ${num(p1.x)} ${num(p1.y)} Z" fill="${colour}" fill-opacity="0.88"
      stroke="#fff" stroke-width="1.5"/>`;
    if (a1 - a0 > 18){
      const lp = polar((a0 + a1) / 2, r * 0.62);
      body += txt(lp.x, lp.y, `${Math.round(c.value / total * 100)}%`,
        { size:FIG_TEXT * 0.85, weight:600, fill:"#fff" });
    }
    cum += c.value;
  });

  cats.forEach((c, i) => {
    const lx = cx + r + 60, ly = 50 + i * 26;
    body += `<rect x="${num(lx)}" y="${num(ly - 10)}" width="14" height="14" fill="${PALETTE[i % PALETTE.length]}"/>`;
    body += txt(lx + 20, ly - 2, c.label, { size:FIG_TEXT * 0.85, anchor:"start" });
  });

  return svg(body, W, h);
};

// Only the 3 regular tessellations (a single repeated regular polygon
// tiling the plane with no gaps) — the only ones EMAC8 ever asks to have
// drawn from scratch. A semi-regular (mixed-polygon) tessellation is always
// given as a picture to name, never something to draw, and a true general
// tessellation renderer (arbitrary polygons meeting edge-to-edge around a
// shared vertex configuration) is a much harder, more error-prone geometry
// problem than these three simple, well-understood grids — deliberately not
// attempted, the same call made for dodecahedron/icosahedron.
FIG.tessellation = spec => {
  const shape = String(spec.shape || "").toLowerCase();
  const s = 40, h = 340;
  let body = "";

  if (shape === "square"){
    const cols = 8, rows = 6, ox = W / 2 - cols * s / 2, oy = h / 2 - rows * s / 2;
    for (let r = 0; r < rows; r++){
      for (let c = 0; c < cols; c++){
        body += `<rect x="${num(ox + c * s)}" y="${num(oy + r * s)}" width="${s}" height="${s}"
          fill="${C_FILL}" fill-opacity="0.12" stroke="${C_LINE}" stroke-width="1.4"/>`;
      }
    }
  } else if (shape === "triangle"){
    const rowH = s * Math.sqrt(3) / 2, cols = 9, rows = 6;
    const ox = W / 2 - cols * s / 4, oy = h / 2 - rows * rowH / 2;
    for (let r = 0; r < rows; r++){
      for (let c = 0; c < cols; c++){
        const up = (r + c) % 2 === 0;
        const x0 = ox + c * s / 2, y0 = oy + r * rowH;
        const pts = up
          ? [[x0, y0 + rowH], [x0 + s / 2, y0], [x0 + s, y0 + rowH]]
          : [[x0, y0], [x0 + s, y0], [x0 + s / 2, y0 + rowH]];
        const d = pts.map((p, i) => `${i ? "L" : "M"}${num(p[0])} ${num(p[1])}`).join(" ") + " Z";
        body += `<path d="${d}" fill="${C_FILL}" fill-opacity="0.12" stroke="${C_LINE}" stroke-width="1.4"/>`;
      }
    }
  } else if (shape === "hexagon"){
    // Flat-top regular hexagons, radius s: width 2s, height sqrt(3)*s,
    // columns spaced 1.5s apart, alternate columns offset vertically by
    // half a hex-height to interlock — the standard honeycomb layout. That
    // stagger means the whole patch's true vertical span is rows*hexH +
    // hexH/2, not rows*hexH — centering on the wrong span clips the pattern.
    const hexH = Math.sqrt(3) * s, colSpacing = 1.5 * s, cols = 6, rows = 4;
    const totalSpan = rows * hexH + hexH / 2;
    const ox = W / 2 - cols * colSpacing / 2, oy = hexH / 2 + (h - totalSpan) / 2;
    const hexPts = (cx, cy) => {
      const pts = [];
      for (let i = 0; i < 6; i++){
        const a = Math.PI / 180 * (60 * i);
        pts.push([cx + s * Math.cos(a), cy + s * Math.sin(a)]);
      }
      return pts;
    };
    for (let c = 0; c < cols; c++){
      for (let r = 0; r < rows; r++){
        const cx = ox + c * colSpacing, cy = oy + r * hexH + (c % 2 ? hexH / 2 : 0);
        const pts = hexPts(cx, cy);
        const d = pts.map((p, i) => `${i ? "L" : "M"}${num(p[0])} ${num(p[1])}`).join(" ") + " Z";
        body += `<path d="${d}" fill="${C_FILL}" fill-opacity="0.12" stroke="${C_LINE}" stroke-width="1.4"/>`;
      }
    }
  } else {
    throw new Error(
      "MathWISE can only draw the 3 regular tessellations (triangle, square, hexagon) — a semi-regular " +
      "or mixed-polygon tessellation is always given as a picture to name in this course, never drawn " +
      "from scratch, and a correct general renderer for one is beyond what a simple SVG generator can " +
      "reliably produce."
    );
  }

  return svg(body, W, h);
};

FIG.bearing = spec => {
  // Points are plain Cartesian (y up = north, x right = east) — the bearing
  // angle at each named point is computed from the actual drawn direction to
  // its target, not trusted as a separately-given number, the same
  // "arithmetic can never disagree with the picture" rule as shortdivision.
  const pts = (spec.points || []).map(p => ({ name:String(p.name), x:+p.x, y:+p.y }));
  if (pts.length < 2) throw new Error("need at least 2 points");
  const at = n => pts.find(p => p.name === String(n));
  const allX = pts.map(p => p.x), allY = pts.map(p => p.y);
  const spanx = Math.max(...allX) - Math.min(...allX) || 1, spany = Math.max(...allY) - Math.min(...allY) || 1;
  const h = 360, m = 64;
  const k = Math.min((W - m * 2) / spanx, (h - m * 2) / spany);
  const X = v => m + (v - Math.min(...allX)) * k;
  const Y = v => h - m - (v - Math.min(...allY)) * k;

  let body = "";
  (spec.segments || []).forEach(s => {
    const a = at(s.from), b = at(s.to);
    if (!a || !b) return;
    body += `<line x1="${num(X(a.x))}" y1="${num(Y(a.y))}" x2="${num(X(b.x))}" y2="${num(Y(b.y))}"
      stroke="${C_LINE}" stroke-width="2"/>`;
  });

  (spec.bearings || []).forEach(bg => {
    const p = at(bg.at), q = at(bg.to);
    if (!p || !q) return;
    const cx = X(p.x), cy = Y(p.y);
    const northLen = 40;
    body += `<line x1="${num(cx)}" y1="${num(cy)}" x2="${num(cx)}" y2="${num(cy - northLen)}"
      stroke="${C_AXIS}" stroke-width="1.6" stroke-dasharray="4 3"/>`;
    body += txt(cx, cy - northLen - 10, "N", { size:12, weight:600, fill:C_AXIS });
    const dx = X(q.x) - cx, dy = Y(q.y) - cy;
    let bearingDeg = Math.atan2(dx, -dy) * 180 / Math.PI;
    if (bearingDeg < 0) bearingDeg += 360;
    const r = 30, rad = d => d * Math.PI / 180;
    const arcEnd = { x: cx + r * Math.sin(rad(bearingDeg)), y: cy - r * Math.cos(rad(bearingDeg)) };
    const largeArc = bearingDeg > 180 ? 1 : 0;
    body += `<path d="M ${num(cx)} ${num(cy - r)} A ${r} ${r} 0 ${largeArc} 1 ${num(arcEnd.x)} ${num(arcEnd.y)}"
      fill="none" stroke="${C_ALT}" stroke-width="1.6"/>`;
    const midDeg = bearingDeg / 2, labelR = r + 16;
    body += txt(cx + labelR * Math.sin(rad(midDeg)), cy - labelR * Math.cos(rad(midDeg)),
      bg.label || `${Math.round(bearingDeg)}°`, { size:12, weight:600, fill:C_ALT });
  });

  pts.forEach(p => {
    body += `<circle cx="${num(X(p.x))}" cy="${num(Y(p.y))}" r="4" fill="${C_LINE}"/>`;
    body += txt(X(p.x), Y(p.y) - 14, p.name, { size:13, weight:600 });
  });

  return svg(body, W, h);
};

function renderFigure(spec){
  const kind = spec && FIG[spec.type];
  if (!kind) return `<div class="figure"><p class="broken">Unknown diagram type.</p></div>`;
  try {
    return `<div class="figure">${kind(spec)}${spec.title ? `<p class="cap">${sx(spec.title)}</p>` : ""}</div>`;
  } catch (err){
    return `<div class="figure"><p class="broken">This diagram could not be drawn. The working above still stands.</p></div>`;
  }
}

/* --- Maths keyboard --------------------------------------------------- *
 * Students never see LaTeX. They see the rendered maths, and an empty
 * highlighted box wherever a value is wanted.
 *
 * A key inserts LaTeX containing SLOT characters. The first slot is then
 * *selected* in the hidden input, so whatever the student types replaces
 * it — no cursor arithmetic, and Tab moves to the next box.
 * ------------------------------------------------------------------ */

const SLOT = "\u25AF";                       // ▯ — never shown, always substituted
const SLOT_IDLE = "\\square ";
// No dollars in here: the preview is validated by splitting on $ to find the
// maths runs, and a nested pair would cut the expression in half.
const SLOT_LIVE = "\\textcolor{#C59F40}{\\boxed{\\square}} ";

// [label in LaTeX, LaTeX to insert]
const KEYS = {
  "Basic": [
    ["+", "+"], ["-", "-"], ["\\times", "\\times "], ["\\div", "\\div "],
    ["=", "="], ["\\neq", "\\neq "], ["<", "<"], [">", ">"],
    ["\\le", "\\le "], ["\\ge", "\\ge "], ["\\pm", "\\pm "],
    ["(\\square)", "(" + SLOT + ")"], ["\\%", "\\%"], ["\\square^{\\circ}", "^{\\circ}"],
    // fraction templates: the general one, a mixed number, then the fractions
    // that come up constantly in Years 7 and 8
    ["\\frac{\\square}{\\square}", "\\frac{" + SLOT + "}{" + SLOT + "}"],
    ["\\square\\frac{\\square}{\\square}", SLOT + "\\frac{" + SLOT + "}{" + SLOT + "}"],
    ["\\frac{1}{2}", "\\frac{1}{2}"], ["\\frac{1}{3}", "\\frac{1}{3}"],
    ["\\frac{2}{3}", "\\frac{2}{3}"], ["\\frac{1}{4}", "\\frac{1}{4}"],
    ["\\frac{3}{4}", "\\frac{3}{4}"], ["\\frac{1}{10}", "\\frac{1}{10}"]
  ],
  "Powers": [
    ["\\square^{2}", "^{2}"], ["\\square^{3}", "^{3}"],
    ["\\square^{\\square}", "^{" + SLOT + "}"],
    ["\\square_{\\square}", "_{" + SLOT + "}"],
    ["\\sqrt{\\square}", "\\sqrt{" + SLOT + "}"],
    ["\\sqrt[3]{\\square}", "\\sqrt[3]{" + SLOT + "}"],
    ["\\frac{\\square}{\\square}", "\\frac{" + SLOT + "}{" + SLOT + "}"],
    ["\\frac{1}{2}", "\\frac{1}{2}"],
    ["|\\square|", "\\left|" + SLOT + "\\right|"],
    ["\\times 10^{\\square}", "\\times 10^{" + SLOT + "}"]
  ],
  "Trig & logs": [
    ["\\sin", "\\sin(" + SLOT + ")"], ["\\cos", "\\cos(" + SLOT + ")"],
    ["\\tan", "\\tan(" + SLOT + ")"],
    ["\\sin^{-1}", "\\sin^{-1}(" + SLOT + ")"], ["\\cos^{-1}", "\\cos^{-1}(" + SLOT + ")"],
    ["\\tan^{-1}", "\\tan^{-1}(" + SLOT + ")"],
    ["\\log", "\\log(" + SLOT + ")"],
    ["\\log_{\\square}", "\\log_{" + SLOT + "}(" + SLOT + ")"],
    ["\\ln", "\\ln(" + SLOT + ")"],
    ["e^{\\square}", "e^{" + SLOT + "}"], ["\\pi", "\\pi "], ["\\theta", "\\theta "]
  ],
  "Calculus": [
    ["\\frac{dy}{dx}", "\\frac{dy}{dx}"], ["\\frac{d}{dx}", "\\frac{d}{dx}"],
    ["f'(x)", "f'(x)"], ["f''(x)", "f''(x)"],
    ["\\int \\square \\, dx", "\\int " + SLOT + " \\, dx"],
    ["\\int_{\\square}^{\\square}", "\\int_{" + SLOT + "}^{" + SLOT + "} " + SLOT + " \\, dx"],
    ["\\lim_{x \\to \\square}", "\\lim_{x \\to " + SLOT + "}"],
    ["\\sum_{\\square}^{\\square}", "\\sum_{" + SLOT + "}^{" + SLOT + "}"],
    ["\\infty", "\\infty "], ["\\to", "\\to "], ["\\delta", "\\delta "]
  ],
  "Sets & chance": [
    ["P(\\square)", "P(" + SLOT + ")"],
    ["P(\\square \\mid \\square)", "P(" + SLOT + " \\mid " + SLOT + ")"],
    ["\\square'", "'"],
    ["\\cup", "\\cup "], ["\\cap", "\\cap "], ["\\in", "\\in "],
    ["\\notin", "\\notin "], ["\\subset", "\\subset "],
    ["\\varnothing", "\\varnothing "],
    ["\\bar{\\square}", "\\bar{" + SLOT + "}"],
    ["\\sim", "\\sim "], ["\\hat{\\square}", "\\hat{" + SLOT + "}"]
  ],
  "Greek": [
    ["\\alpha", "\\alpha "], ["\\beta", "\\beta "], ["\\gamma", "\\gamma "],
    ["\\theta", "\\theta "], ["\\lambda", "\\lambda "], ["\\mu", "\\mu "],
    ["\\sigma", "\\sigma "], ["\\phi", "\\phi "], ["\\omega", "\\omega "],
    ["\\Delta", "\\Delta "], ["\\Sigma", "\\Sigma "], ["\\approx", "\\approx "],
    ["\\therefore", "\\therefore "], ["\\propto", "\\propto "]
  ],
  "Matrices": [
    ["\\begin{bmatrix}\\square&\\square\\\\\\square&\\square\\end{bmatrix}",
     "\\begin{bmatrix} " + SLOT + " & " + SLOT + " \\\\ " + SLOT + " & " + SLOT + " \\end{bmatrix}"],
    ["\\begin{bmatrix}\\square\\\\\\square\\end{bmatrix}",
     "\\begin{bmatrix} " + SLOT + " \\\\ " + SLOT + " \\end{bmatrix}"],
    ["\\begin{pmatrix}\\square&\\square\\\\\\square&\\square\\end{pmatrix}",
     "\\begin{pmatrix} " + SLOT + " & " + SLOT + " \\\\ " + SLOT + " & " + SLOT + " \\end{pmatrix}"],
    ["\\vec{\\square}", "\\vec{" + SLOT + "}"],
    ["\\binom{\\square}{\\square}", "\\binom{" + SLOT + "}{" + SLOT + "}"],
    ["\\det", "\\det "], ["\\square^{-1}", "^{-1}"],
    ["\\&", " & "], ["\\text{new row}", " \\\\ "]
  ],
  "Finance": [
    // Each key drops in one labelled TVM field (the student types over the
    // highlighted box), matching the Finance Solver's own N/I(%)/PV/Pmt/FV/
    // PpY/CpY field names so a typed-out question reads the same way the
    // calculator screen does. The last key inserts all five core fields in
    // one go for "given information" style questions.
    ["N=\\square", "N=" + SLOT + "\\ "],
    ["I(\\%)=\\square", "I(\\%)=" + SLOT + "\\ "],
    ["PV=\\square", "PV=" + SLOT + "\\ "],
    ["Pmt=\\square", "Pmt=" + SLOT + "\\ "],
    ["FV=\\square", "FV=" + SLOT + "\\ "],
    ["PpY=\\square", "PpY=" + SLOT + "\\ "],
    ["CpY=\\square", "CpY=" + SLOT + "\\ "],
    ["\\text{TVM template}",
     "N=" + SLOT + ",\\ I(\\%)=" + SLOT + ",\\ PV=" + SLOT + ",\\ Pmt=" + SLOT + ",\\ FV=" + SLOT + "\\ "]
  ]
};

const KEY_TABS = Object.keys(KEYS);

function keyLabel(latex){
  // throwOnError:true on purpose — otherwise KaTeX paints its own red error
  // markup onto the button instead of failing, and a broken key looks shipped.
  try {
    if (window.katex && katex.renderToString)
      return katex.renderToString(latex, { throwOnError:true, displayMode:false });
  } catch (e){}
  return esc(latex.replace(/\\text\{(.*?)\}/g, "$1").replace(/^\\/, ""));
}

/* Odd number of unescaped $ before the caret means we are already inside
   maths, so a key should not add another pair. */
function insideMaths(value, caret){
  let count = 0;
  for (let i = 0; i < caret && i < value.length; i++){
    if (value[i] === "$" && value[i - 1] !== "\\") count++;
  }
  return count % 2 === 1;
}

function askBox(){ return document.getElementById("ask"); }

function stripSlots(text){ return text.split(SLOT).join(""); }

// A plain rule, not \htmlClass: that macro needs KaTeX's trust option, and
// without it KaTeX prints the macro name instead of drawing anything.
const CARET_MATH = "\\textcolor{#4F2759}{\\rule[-0.22em]{1.5px}{1.1em}}";
const CARET_TEXT = "\uE001";                 // swapped for a styled span after escaping
const KATEX_OPTS = { throwOnError: true, strict: false };

let lastGoodPreview = "";

/* The rendered version: every slot becomes an empty square, the one being
   filled gets a gold box, and the caret is drawn where the student is
   actually typing. */
function previewLatex(withCaret){
  const box = askBox();
  const value = S.draft;
  let live = -1;
  if (box && box.selectionEnd - box.selectionStart === 1 && value[box.selectionStart] === SLOT){
    live = box.selectionStart;
  }
  const caretAt = (withCaret && box && box.selectionStart === box.selectionEnd)
    ? box.selectionStart : -1;
  let out = "";
  for (let i = 0; i <= value.length; i++){
    if (i === caretAt) out += insideMaths(value, i) ? CARET_MATH : CARET_TEXT;
    if (i < value.length){
      out += value[i] === SLOT ? (i === live ? SLOT_LIVE : SLOT_IDLE) : value[i];
    }
  }
  return out;
}

/* Split on unescaped dollars; the odd segments are maths. */
function mathSegments(text){
  const parts = [];
  let buf = "", inMath = false;
  for (let i = 0; i < text.length; i++){
    if (text[i] === "$" && text[i - 1] !== "\\"){
      if (inMath) parts.push(buf);
      buf = ""; inMath = !inMath; continue;
    }
    if (inMath) buf += text[i];
  }
  return parts;
}

function rendersCleanly(latex){
  if (!window.katex || !katex.renderToString) return true;
  return mathSegments(latex).every(seg => {
    try { katex.renderToString(seg, KATEX_OPTS); return true; }
    catch (e){ return false; }
  });
}

/* Preview-only heuristic: a typed word "looks like maths" if it carries a
 * digit, a caret (power) or an equals sign anywhere, or if it's a single
 * letter that isn't the everyday English words "a"/"A"/"I" — a lone "x" is
 * almost always a pronumeral in this app, but "a" and "I" are too common as
 * ordinary words to guess as variables. This never touches what's actually
 * sent to Claude — only how the live preview is drawn. */
function isMathWord(bare){
  if (!bare) return false;
  if (/[0-9^=]/.test(bare)) return true;
  // "i" is excluded alongside "I" and "a"/"A" — a casually-typed, uncapitalised
  // "i" ("so i can count them") is overwhelmingly the pronoun, not the
  // imaginary unit; a genuine imaginary unit almost always appears inside a
  // real expression ("3+4i"), which this single-bare-letter branch never sees.
  if (/^[a-zA-Z]$/.test(bare)) return !["a","A","i","I"].includes(bare);
  return false;
}

// Wraps math-looking words in $...$ inside one plain-text run, leaving
// whitespace, ordinary words, and trailing sentence punctuation (so "x^2."
// becomes "$x^2$." not "$x^2.$") outside the wrap. The caret marker CARET_TEXT
// is only ever valid outside a math region, so a word that gets wrapped and
// happens to contain it is switched to CARET_MATH instead, matching how
// previewLatex() itself chooses between the two.
function wrapMathWords(text){
  return text.split(/(\s+)/).map(tok => {
    if (!tok || /^\s+$/.test(tok)) return tok;
    const m = tok.match(/^(.*?)([.,;:!?]*)$/s);
    const core = m[1], trail = m[2];
    const bareCore = core.split(CARET_TEXT).join("");
    if (!isMathWord(bareCore)) return tok;
    return "$" + core.split(CARET_TEXT).join(CARET_MATH) + "$" + trail;
  }).join("");
}

// Leaves anything the student (or the on-screen keyboard) already wrapped in
// $...$ untouched, and only runs wrapMathWords() over the plain text in
// between — so a sentence like "The fish is x^2+3 cm long." renders with
// just the "x^2+3" part as an equation.
function autoMathify(str){
  return str.split(/(\$[^$]*\$)/).map(part =>
    (part.startsWith("$") && part.endsWith("$") && part.length > 1) ? part : wrapMathWords(part)
  ).join("");
}

// Same auto-math wrapping, but for text that's already been submitted and
// is just being displayed (a student's own reply in the thread, or in the
// PDF/print export) rather than live-typed — no caret to worry about, and
// if the guess produces something KaTeX can't parse, fall back to the
// plain original rather than showing broken maths.
function displayMathify(text){
  const withMath = autoMathify(text);
  return rendersCleanly(withMath) ? withMath : text;
}

function paintPreview(){
  const nodes = [document.getElementById("kbpreview")].filter(Boolean);
  if (!nodes.length) return;

  if (!S.draft){
    lastGoodPreview = "";
    nodes.forEach(n => { n.innerHTML = '<span class="mf-ghost">Ask a mathematics question</span>'; });
    return;
  }

  // Never show raw LaTeX. Try with the caret, then without it, and if the
  // expression is momentarily unparseable keep the last good picture.
  // autoMathify() adds the $...$ around anything that looks mathematical
  // and wasn't already wrapped by the on-screen keyboard, so free-typed
  // notation like "x^2" renders as an equation without needing the keys.
  let latex = autoMathify(previewLatex(true));
  if (!rendersCleanly(latex)){
    latex = autoMathify(previewLatex(false));
    if (!rendersCleanly(latex)) latex = null;
  }
  if (latex === null){
    if (lastGoodPreview) nodes.forEach(n => { n.innerHTML = lastGoodPreview; });
    return;
  }

  const html = esc(latex).split(CARET_TEXT).join('<span class="mf-text-caret"></span>');
  nodes.forEach(n => {
    n.innerHTML = html;
    if (window.renderMathInElement){
      try {
        renderMathInElement(n, {
          delimiters: [{ left:"$$", right:"$$", display:true }, { left:"$", right:"$", display:false }],
          errorColor: "#8A8291", throwOnError: false, strict: false
        });
      } catch (e){}
    }
  });
  lastGoodPreview = nodes[0].innerHTML;
}

function selectRange(from, to){
  const box = askBox();
  if (!box) return;
  box.focus();
  try { box.setSelectionRange(from, to); } catch (e){}
}

function insertLatex(text){
  const box = askBox();
  if (!box) return;
  const start = box.selectionStart === null ? box.value.length : box.selectionStart;
  const end = box.selectionEnd === null ? start : box.selectionEnd;
  const wrap = !insideMaths(box.value, start);
  const chunk = wrap ? "$" + text + "$" : text;
  box.value = box.value.slice(0, start) + chunk + box.value.slice(end);
  S.draft = box.value;
  const slot = chunk.indexOf(SLOT);
  const caret = slot >= 0 ? [start + slot, start + slot + 1]
                          : [start + chunk.length, start + chunk.length];
  selectRange(caret[0], caret[1]);
  paintPreview();
}

/* --- Moving through the expression ------------------------------------
 * Arrows step by whole construct, not by character. Stepping through the
 * raw source one character at a time moves the caret through \, f, r, a, c
 * with nothing visibly happening, which is what made arrowing feel broken.
 * ------------------------------------------------------------------ */

function skipGroup(v, j){
  if (v[j] === "{"){
    let depth = 0;
    for (let k = j; k < v.length; k++){
      if (v[k] === "{" && v[k-1] !== "\\") depth++;
      else if (v[k] === "}" && v[k-1] !== "\\"){ depth--; if (!depth) return k + 1; }
    }
    return v.length;
  }
  if (v[j] === "["){
    const k = v.indexOf("]", j);
    return k === -1 ? v.length : k + 1;
  }
  return -1;
}

/* Index just past the construct that starts at i. */
function atomEnd(v, i){
  if (i >= v.length) return v.length;
  const c = v[i];
  if (c === SLOT) return i + 1;

  if (c === "\\"){
    let j = i + 1;
    while (j < v.length && /[a-zA-Z]/.test(v[j])) j++;
    if (j === i + 1) j = i + 2;                       // \\ or \& and friends
    if (v.slice(i, j) === "\\begin"){
      const close = v.indexOf("}", j);
      if (close !== -1){
        const env = v.slice(close - (close - j) + 1, close);
        const tail = "\\end{" + v.slice(j + 1, close) + "}";
        const at = v.indexOf(tail, close);
        if (at !== -1) return at + tail.length;
      }
    }
    for (;;){
      const k = skipGroup(v, j);
      if (k === -1) break;
      j = k;
    }
    return j;
  }

  if (c === "^" || c === "_"){
    const k = skipGroup(v, i + 1);
    return k === -1 ? Math.min(i + 2, v.length) : k;
  }

  if (c === "("){
    let depth = 0;
    for (let k = i; k < v.length; k++){
      if (v[k] === "(") depth++;
      else if (v[k] === ")"){ depth--; if (!depth) return k + 1; }
    }
  }
  return i + 1;
}

/* Every position the caret is allowed to rest at: the boundary of each
   construct, plus every empty box, since a box inside a fraction has to be
   reachable even though the fraction is one construct from outside. */
function caretStops(v){
  const out = [];
  let i = 0;
  while (i < v.length){
    out.push(i);
    const j = atomEnd(v, i);
    i = j > i ? j : i + 1;
  }
  out.push(v.length);
  for (let k = 0; k < v.length; k++) if (v[k] === SLOT) out.push(k);
  return [...new Set(out)].sort((a, b) => a - b);
}

function moveCaret(dir){
  const box = askBox();
  if (!box) return false;
  const v = box.value, stops = caretStops(v);
  const from = dir > 0 ? box.selectionEnd : box.selectionStart;
  let target;
  if (dir > 0) target = stops.find(p => p > from);
  else { const before = stops.filter(p => p < from); target = before[before.length - 1]; }
  if (target === undefined) return false;
  // Landing on an empty box selects it, so typing fills it.
  if (dir > 0 && v[target] === SLOT) selectRange(target, target + 1);
  else if (dir < 0 && v[target] === SLOT) selectRange(target, target + 1);
  else selectRange(target, target);
  paintPreview();
  return true;
}

/* --- Deleting ---------------------------------------------------------
 * Backspace removes a whole construct, not a character. Chewing one brace
 * out of \frac{2}{3} leaves LaTeX that cannot render, which is exactly how
 * raw code ends up on screen.
 * ------------------------------------------------------------------ */

function matchingOpen(v, closeAt){
  let depth = 0;
  for (let i = closeAt; i >= 0; i--){
    if (v[i] === "}" && v[i - 1] !== "\\") depth++;
    else if (v[i] === "{" && v[i - 1] !== "\\"){ depth--; if (!depth) return i; }
  }
  return -1;
}

function macroStart(v, endAt){          // endAt is one past the last letter
  let i = endAt;
  while (i > 0 && /[a-zA-Z]/.test(v[i - 1])) i--;
  return (i > 0 && v[i - 1] === "\\") ? i - 1 : -1;
}

/* Where the "atom" ending at index i begins. */
function atomStart(v, i){
  if (i <= 0) return 0;
  const c = v[i - 1];

  if (c === SLOT) return i - 1;

  if (c === "}"){
    let open = matchingOpen(v, i - 1);
    if (open === -1) return i - 1;

    // \end{env} — take the whole environment out with it
    const endMacro = macroStart(v, open);
    if (endMacro !== -1 && v.slice(endMacro, open) === "\\end"){
      const env = v.slice(open + 1, i - 1);
      const begin = v.lastIndexOf("\\begin{" + env + "}", endMacro);
      if (begin !== -1) return begin;
    }

    // walk left over any further arguments, then the macro or ^ / _ itself
    let k = open;
    while (k > 0){
      if (v[k - 1] === "}"){
        const prev = matchingOpen(v, k - 1);
        if (prev === -1) break;
        k = prev;
        continue;
      }
      if (v[k - 1] === "]"){
        const br = v.lastIndexOf("[", k - 1);
        if (br === -1) break;
        k = br;
        continue;
      }
      break;
    }
    const macro = macroStart(v, k);
    if (macro !== -1) return macro;
    if (k > 0 && (v[k - 1] === "^" || v[k - 1] === "_")) return k - 1;
    return k;
  }

  if (c === ")"){
    let depth = 0;
    for (let k = i - 1; k >= 0; k--){
      if (v[k] === ")") depth++;
      else if (v[k] === "("){
        depth--;
        if (!depth){
          const macro = macroStart(v, k);      // \sin( ... ) goes together
          return macro !== -1 ? macro : k;
        }
      }
    }
    return i - 1;
  }

  if (/[a-zA-Z]/.test(c)){
    const macro = macroStart(v, i);
    if (macro !== -1) return macro;
  }
  return i - 1;
}

/* Drop maths delimiters left holding nothing. */
function tidy(v){
  let out = v.replace(/\$\s*\$/g, "");
  const dollars = (out.match(/(?:^|[^\\])\$/g) || []).length;
  if (dollars % 2 === 1) out = out.replace(/\$(?=[^$]*$)/, "");
  return out;
}

function deleteBackward(){
  const box = askBox();
  if (!box) return;
  const v = box.value, from = box.selectionStart, to = box.selectionEnd;
  let caret, next;
  if (from !== to){
    // A selected slot is emptied, not removed, so the shape stays put.
    if (to - from === 1 && v[from] === SLOT){ selectRange(from, to); return; }
    next = v.slice(0, from) + v.slice(to);
    caret = from;
  } else {
    let at = from;
    // Sitting just after a closing $: delete the last thing *inside* the
    // maths, not the delimiter. Losing a $ drops the whole expression out of
    // maths mode and shows the source, which is the one thing to avoid.
    if (v[at - 1] === "$"){
      if (at >= 2 && v[at - 2] === "$"){        // empty maths, take the pair
        next = v.slice(0, at - 2) + v.slice(at);
        caret = at - 2;
        const done = tidy(next);
        applyDelete(box, done, Math.min(caret, done.length));
        return;
      }
      at -= 1;
    }
    const start = atomStart(v, at);
    next = v.slice(0, start) + v.slice(at);
    caret = start;
  }
  applyDelete(box, tidy(next), caret);
}

function applyDelete(box, cleaned, caret){
  caret = Math.max(0, Math.min(caret, cleaned.length));
  box.value = cleaned;
  S.draft = cleaned;
  selectRange(caret, caret);
  paintPreview();
}

function nextSlot(){
  const box = askBox();
  if (!box) return false;
  let at = box.value.indexOf(SLOT, box.selectionEnd);
  if (at === -1) at = box.value.indexOf(SLOT);
  if (at === -1) return false;
  selectRange(at, at + 1);
  paintPreview();
  return true;
}

function prevSlot(){
  const box = askBox();
  if (!box) return false;
  let at = box.value.lastIndexOf(SLOT, Math.max(0, box.selectionStart - 1));
  if (at === -1) at = box.value.lastIndexOf(SLOT);
  if (at === -1) return false;
  selectRange(at, at + 1);
  paintPreview();
  return true;
}

/* True when the student is sitting in a box rather than in ordinary text. */
function onSlot(){
  const box = askBox();
  return !!box && box.selectionEnd - box.selectionStart === 1
    && box.value[box.selectionStart] === SLOT;
}

function keyboardHtml(){
  if (!S.showKeys) return "";
  const tab = KEYS[S.keysTab] ? S.keysTab : KEY_TABS[0];
  return `
    <div class="kb">
      <div class="kb-tabs">
        ${KEY_TABS.map(t => `<button class="kb-tab" role="tab" aria-selected="${t === tab}"
          data-kbtab="${esc(t)}">${esc(t)}</button>`).join("")}
      </div>
      <div class="kb-grid">
        ${KEYS[tab].map((k, i) => `<button class="kb-key" data-key="${esc(tab)}|${i}">${keyLabel(k[0])}</button>`).join("")}
      </div>
      <div class="kb-edit">
        <button class="btn-quiet" id="kb-prev">Previous box</button>
        <button class="btn-quiet" id="kb-next">Next box</button>
        <button class="btn-quiet" id="kb-back">Delete</button>
        <button class="btn-quiet" id="kb-space">Space</button>
        <button class="btn-quiet" id="kb-clear">Clear</button>
        <button class="btn-quiet" id="kb-hide">Hide keyboard</button>
        <p class="note">Delete removes a whole block. Tab or the arrows move between boxes.</p>
      </div>
    </div>`;
}

function wireKeyboard(scope){
  const box = askBox();
  if (box){
    box.oninput = () => { S.draft = box.value; paintPreview(); };
    box.onkeyup = paintPreview;
    box.onclick = paintPreview;
    box.onkeydown = e => {
      const hasSlots = S.draft.indexOf(SLOT) !== -1;
      if (e.key === "Enter"){
        e.preventDefault();
        const send = document.getElementById("send");
        if (send && !send.disabled) send.click();
        return;
      }
      if (e.key === "Backspace" && box.selectionStart === box.selectionEnd
          && box.selectionStart > 0){
        e.preventDefault();
        deleteBackward();
        return;
      }
      if (e.key === "Tab" && hasSlots){
        e.preventDefault();
        e.shiftKey ? prevSlot() : nextSlot();
        return;
      }
      if (e.key === "ArrowRight" || e.key === "ArrowLeft"){
        e.preventDefault();
        moveCaret(e.key === "ArrowRight" ? 1 : -1);
      }
    };
  }
  const holder = document.getElementById("field");
  if (holder) holder.onclick = () => { const b = askBox(); if (b) b.focus(); };

  scope.querySelectorAll("[data-kbtab]").forEach(b => b.onclick = () => {
    S.keysTab = b.dataset.kbtab;
    render();
    const again = askBox();
    if (again){
      again.focus();
      if (!nextSlot()) selectRange(S.draft.length, S.draft.length);
    }
  });
  scope.querySelectorAll("[data-key]").forEach(b => b.onclick = () => {
    const bar = b.dataset.key.lastIndexOf("|");
    const key = (KEYS[b.dataset.key.slice(0, bar)] || [])[+b.dataset.key.slice(bar + 1)];
    if (key) insertLatex(key[1]);
  });

  const wireK = (id, fn) => { const n = document.getElementById(id); if (n) n.onclick = fn; };
  wireK("kb-next", nextSlot);
  wireK("kb-prev", prevSlot);
  wireK("kb-space", () => insertLatex(" "));
  wireK("kb-back", deleteBackward);
  wireK("kb-clear", () => {
    const node = askBox();
    if (node){ node.value = ""; node.focus(); }
    S.draft = "";
    paintPreview();
  });
  wireK("kb-hide", () => { S.showKeys = false; render(); });
  wireK("kb-toggle", () => { S.showKeys = !S.showKeys; render(); });
}

/* A phone or tablet opens its camera for capture="environment". A laptop just
   shows a file picker, which is a pointless second button, so only offer it
   where it does something. */
const HAS_CAMERA = (() => {
  try {
    return window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  } catch (e){ return false; }
})();

/* --- Text to HTML ---------------------------------------------------- */

function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function bold(s){ return s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>"); }

/* KaTeX does not know most Unicode maths characters, and an en dash typed
   inside $...$ produces a warning and renders as nothing. Swap them for the
   commands they stand for, inside maths runs only — prose keeps its dashes. */
const MATH_FIXES = [
  [/[\u2010-\u2015\u2212]/g, "-"], [/\u00d7/g, "\\times "], [/\u00f7/g, "\\div "],
  [/\u2264/g, "\\le "], [/\u2265/g, "\\ge "], [/\u2248/g, "\\approx "],
  [/\u2260/g, "\\ne "], [/\u00b1/g, "\\pm "], [/\u221e/g, "\\infty "],
  [/\u03c0/g, "\\pi "], [/\u03b8/g, "\\theta "], [/\u00b0/g, "^\\circ "],
  [/\u2026/g, "\\dots "], [/\u2192/g, "\\to "], [/\u2044/g, "/"]
];

function fixMathRuns(text){
  let out = "", buf = "", inMath = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (c === "$" && text[i - 1] !== "\\"){
      if (inMath){
        let fixed = buf;
        MATH_FIXES.forEach(([re, to]) => { fixed = fixed.replace(re, to); });
        out += fixed + "$";
      } else {
        out += buf + "$";
      }
      buf = ""; inMath = !inMath;
      continue;
    }
    buf += c;
  }
  return out + buf;
}

/* --- Tables ----------------------------------------------------------- *
 * Frequency tables, two-way tables and grouped data are answers in their
 * own right, so they are rendered as tables rather than left as pipes.
 * ------------------------------------------------------------------ */

function isTableRow(t){ return /^\|.*\|$/.test(t) && t.length > 2; }
function isTableRule(line){
  const t = line.trim();
  return isTableRow(t) && /^[\s|:-]+$/.test(t) && t.includes("-");
}
// A naive split("|") breaks the moment a cell's own content needs a literal
// pipe — \| (a LaTeX norm bar), or \left|x\right| (absolute value) — since
// that's indistinguishable from a real column separator to a plain split.
// This walks the row instead, treating a "|" as a delimiter only when it's
// outside a $...$ math span and not itself escaped with a backslash.
function splitRow(t){
  const inner = t.replace(/^\||\|$/g, "");
  const cells = [];
  let buf = "", inMath = false;
  for (let i = 0; i < inner.length; i++){
    const c = inner[i];
    if (c === "$" && inner[i - 1] !== "\\"){ inMath = !inMath; buf += c; continue; }
    if (c === "|" && !inMath && inner[i - 1] !== "\\"){ cells.push(buf); buf = ""; continue; }
    buf += c;
  }
  cells.push(buf);
  return cells.map(c => c.trim());
}

function tableHtml(rows){
  if (!rows.length) return "";
  const width = Math.max(...rows.map(r => r.length));
  const pad = r => r.concat(Array(Math.max(0, width - r.length)).fill(""));
  const numeric = v => /^[-+]?[\d.,\s]+%?$/.test(v) && /\d/.test(v);
  const head = pad(rows[0]);
  const body = rows.slice(1).map(pad);
  const isTotal = r => /^(total|totals|sum)$/i.test((r[0] || "").replace(/\*/g, "").trim());
  return `<div class="tablewrap"><table class="mw-table">
    <thead><tr>${head.map(h => `<th>${bold(h)}</th>`).join("")}</tr></thead>
    <tbody>${body.map(r => `<tr${isTotal(r) ? ' class="total"' : ""}>${
      r.map((c, i) => `<td${i && numeric(c) ? ' class="num"' : ""}>${bold(c)}</td>`).join("")
    }</tr>`).join("")}</tbody>
  </table></div>`;
}

// Pull ```figure blocks out before touching anything else, so the JSON
// inside them never meets the markdown pass.
function splitFigures(text){
  const parts = [];
  const re = /```figure\s*([\s\S]*?)```/g;
  let last = 0, m;
  while ((m = re.exec(text)) !== null){
    if (m.index > last) parts.push({ kind:"text", value:text.slice(last, m.index) });
    let spec = null;
