  if (spec.label && !single) body += txt(W/2, 20, spec.label, { size:12, weight:600 });
  else if (spec.label) body += txt(W/2, 24, spec.label, { size:12, weight:600 });
  return svg(body, W, h2);
};

FIG.stemleaf = spec => {
  const valsA = (spec.values || []).map(Number).filter(v => isFinite(v));
  if (!valsA.length) throw new Error("no values");
  // spec.valuesB turns this into a back-to-back stem-and-leaf plot comparing
  // two data sets on one shared stem column — A's leaves run outward to the
  // LEFT (smallest digit nearest the stem), B's run outward to the right,
  // the standard convention for comparing two groups this way.
  const valsB = spec.valuesB ? spec.valuesB.map(Number).filter(v => isFinite(v)) : null;
  const backToBack = !!(valsB && valsB.length);
  const allVals = backToBack ? valsA.concat(valsB) : valsA;
  const stems = allVals.map(v => Math.floor(v / 10));
  const loStem = Math.min(...stems), hiStem = Math.max(...stems);
  const rows = [];
  for (let s = loStem; s <= hiStem; s++){
    const leavesA = valsA.filter(v => Math.floor(v / 10) === s).map(v => v % 10).sort((a, b) => a - b);
    const row = { stem: s, text: leavesA.join("  "), textLeft: [...leavesA].sort((a, b) => b - a).join("  ") };
    if (backToBack){
      const leavesB = valsB.filter(v => Math.floor(v / 10) === s).map(v => v % 10).sort((a, b) => a - b);
      row.textB = leavesB.join("  ");
    }
    rows.push(row);
  }
  const stemW = 60, rowH = 30;
  const headY = 44, ruleY = headY + 12, top = ruleY + 32;

  let body, h, boxL, boxR, midX;
  if (backToBack){
    const leftChars = Math.max(4, ...rows.map(r => r.textLeft.length));
    const rightChars = Math.max(4, ...rows.map(r => r.textB.length));
    const leftW = Math.max(120, leftChars * 10 + 20), rightW = Math.max(120, rightChars * 10 + 20);
    const boxW = leftW + stemW + rightW;
    boxL = (W - boxW) / 2; midX = boxL + leftW + stemW / 2; boxR = boxL + boxW;
    const stemL = boxL + leftW, stemR = stemL + stemW;
    const rectTop = headY - 26, rectBottom = top + rows.length * rowH - rowH / 2 + 14;
    h = rectBottom + 60;
    body = `<rect x="${num(boxL)}" y="${num(rectTop)}" width="${num(boxW)}" height="${num(rectBottom - rectTop)}"
      fill="none" stroke="${C_AXIS}" stroke-width="1.4"/>`;
    body += txt(boxL + leftW - 8, headY, spec.labelA || "Leaf", { size:13.5, weight:700, fill:C_LINE, anchor:"end" });
    body += txt(midX, headY, "Stem", { size:13.5, weight:700, fill:C_LINE });
    body += txt(stemR + 8, headY, spec.labelB || "Leaf", { size:13.5, weight:700, fill:C_LINE, anchor:"start" });
    body += `<line x1="${num(boxL)}" y1="${num(ruleY)}" x2="${num(boxR)}" y2="${num(ruleY)}" stroke="${C_AXIS}" stroke-width="1.2"/>`;
    body += `<line x1="${num(stemL)}" y1="${num(ruleY)}" x2="${num(stemL)}" y2="${num(rectBottom)}" stroke="${C_AXIS}" stroke-width="1.2"/>`;
    body += `<line x1="${num(stemR)}" y1="${num(ruleY)}" x2="${num(stemR)}" y2="${num(rectBottom)}" stroke="${C_AXIS}" stroke-width="1.2"/>`;
    rows.forEach((r, i) => {
      const y = top + i * rowH;
      body += txt(boxL + leftW - 8, y, r.textLeft || "—", { size:14, fill:C_INK, anchor:"end" });
      body += txt(midX, y, num(r.stem), { size:14, fill:C_INK });
      body += txt(stemR + 8, y, r.textB || "—", { size:14, fill:C_INK, anchor:"start" });
    });
    const minVal = Math.min(...allVals);
    const keyStem = Math.floor(minVal / 10), keyLeaf = minVal % 10;
    body += txt(W / 2, rectBottom + 30, `${num(keyStem)}|${num(keyLeaf)} means ${num(minVal)}`, { size:12.5, fill:C_AXIS });
  } else {
    const maxChars = Math.max(4, ...rows.map(r => r.text.length));
    const leafW = Math.max(150, maxChars * 10 + 30);
    const boxW = stemW + leafW; boxL = (W - boxW) / 2; midX = boxL + stemW; boxR = boxL + boxW;
    const rectTop = headY - 26, rectBottom = top + rows.length * rowH - rowH / 2 + 14;
    h = rectBottom + 60;
    body = `<rect x="${num(boxL)}" y="${num(rectTop)}" width="${num(boxW)}" height="${num(rectBottom - rectTop)}"
      fill="none" stroke="${C_AXIS}" stroke-width="1.4"/>`;
    body += txt(boxL + stemW / 2, headY, "Stem", { size:13.5, weight:700, fill:C_LINE });
    body += txt(midX + 16, headY, "Leaf", { size:13.5, weight:700, fill:C_LINE, anchor:"start" });
    body += `<line x1="${num(boxL)}" y1="${num(ruleY)}" x2="${num(boxR)}" y2="${num(ruleY)}" stroke="${C_AXIS}" stroke-width="1.2"/>`;
    body += `<line x1="${num(midX)}" y1="${num(ruleY)}" x2="${num(midX)}" y2="${num(rectBottom)}" stroke="${C_AXIS}" stroke-width="1.2"/>`;
    rows.forEach((r, i) => {
      const y = top + i * rowH;
      body += txt(boxL + stemW / 2, y, num(r.stem), { size:14, fill:C_INK });
      body += txt(midX + 16, y, r.text || "—", { size:14, fill:C_INK, anchor:"start" });
    });
    const minVal = Math.min(...valsA);
    const keyStem = Math.floor(minVal / 10), keyLeaf = minVal % 10;
    body += txt(W / 2, rectBottom + 30, `${num(keyStem)}|${num(keyLeaf)} means ${num(minVal)}`, { size:12.5, fill:C_AXIS });
  }

  return svg(body, W, h);
};

FIG.dotplot = spec => {
  const vals = (spec.values || []).map(Number).filter(v => isFinite(v));
  if (!vals.length) throw new Error("no values");
  const min = Math.min(...vals), max = Math.max(...vals);
  const counts = {};
  vals.forEach(v => { counts[v] = (counts[v] || 0) + 1; });
  const maxCount = Math.max(...Object.values(counts));
  const dotR = 8, dotGap = 19;
  // Height derives from the tallest stack so a small dataset doesn't leave a
  // huge empty canvas and a big one doesn't run out of room.
  const axisY = 60 + maxCount * dotGap;
  const h = axisY + 50;
  const X = v => PAD + (v - min) / ((max - min) || 1) * (W - PAD * 2);

  let body = `<line x1="${num(PAD - 10)}" y1="${num(axisY)}" x2="${num(W - PAD + 10)}" y2="${num(axisY)}"
    stroke="${C_AXIS}" stroke-width="2"/>`;
  for (let v = min; v <= max; v++){
    body += `<line x1="${num(X(v))}" y1="${num(axisY - 6)}" x2="${num(X(v))}" y2="${num(axisY + 6)}"
      stroke="${C_AXIS}" stroke-width="1.5"/>`;
    body += txt(X(v), axisY + 26, num(v), { size:13, fill:C_AXIS });
    const c = counts[v] || 0;
    for (let k = 0; k < c; k++){
      body += `<circle cx="${num(X(v))}" cy="${num(axisY - 12 - k * dotGap)}" r="${dotR}" fill="${C_FILL}" opacity="0.85"/>`;
    }
  }
  if (spec.xlabel) body += txt(W / 2, axisY + 48, spec.xlabel, { size:13, fill:C_AXIS });
  return svg(body, W, h);
};

FIG.scatter = spec => {
  const pts = (spec.points || []).map(p => ({ x:+p.x, y:+p.y }));
  if (!pts.length) throw new Error("no points");
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  const padx = (Math.max(...xs) - Math.min(...xs)) * 0.1 || 1;
  const pady = (Math.max(...ys) - Math.min(...ys)) * 0.1 || 1;
  const xmin = Math.min(...xs) - padx, xmax = Math.max(...xs) + padx;
  const ymin = Math.min(...ys) - pady, ymax = Math.max(...ys) + pady;
  const { g, X, Y } = axes(xmin, xmax, ymin, ymax, spec.xlabel || "", spec.ylabel || "");
  let body = g;
  if (spec.line && isFinite(+spec.line.m)){
    const m = +spec.line.m, c = +spec.line.c || 0;
    body += `<line x1="${num(X(xmin))}" y1="${num(Y(m*xmin+c))}" x2="${num(X(xmax))}"
      y2="${num(Y(m*xmax+c))}" stroke="${C_ALT}" stroke-width="2"/>`;
  }
  pts.forEach(p => { body += `<circle cx="${num(X(p.x))}" cy="${num(Y(p.y))}" r="4" fill="${C_FILL}" opacity="0.8"/>`; });
  return svg(body);
};

/* Cumulative frequency curve (ogive), with the dashed reading-off lines a
   student is expected to draw for a median, a quartile or a percentile. */
FIG.ogive = spec => {
  const pts = (spec.points || []).map(p => ({ x:+p.x, y:+p.y }))
    .filter(p => isFinite(p.x) && isFinite(p.y))
    .sort((a, b) => a.x - b.x);
  if (pts.length < 2) throw new Error("need at least two points");

  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  const xmin = spec.xmin !== undefined ? +spec.xmin : Math.min(...xs);
  const xmax = spec.xmax !== undefined ? +spec.xmax : Math.max(...xs);
  const ymax = spec.ymax !== undefined ? +spec.ymax : Math.max(...ys, 0) * 1.06;
  const ax = axes(xmin, xmax, 0, ymax,
    spec.xlabel || "", spec.ylabel || "Cumulative frequency");
  const { g, X, Y } = ax;
  let body = g;

  // Smooth but never dipping: a cumulative curve cannot go down.
  let d = `M ${num(X(pts[0].x))} ${num(Y(pts[0].y))} `;
  for (let i = 0; i < pts.length - 1; i++){
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const lo = Math.min(p1.y, p2.y), hi = Math.max(p1.y, p2.y);
    let c1y = Math.min(Math.max(p1.y + (p2.y - p0.y) / 6, lo), hi);
    let c2y = Math.min(Math.max(p2.y - (p3.y - p1.y) / 6, lo), hi);
    // Keep the control points in order too, or the curve bulges past a data
    // point on its way to the next one.
    if (p2.y >= p1.y ? c1y > c2y : c1y < c2y){ const mid = (c1y + c2y) / 2; c1y = mid; c2y = mid; }
    d += `C ${num(X(p1.x + (p2.x - p1.x) / 3))} ${num(Y(c1y))}, ` +
         `${num(X(p2.x - (p2.x - p1.x) / 3))} ${num(Y(c2y))}, ` +
         `${num(X(p2.x))} ${num(Y(p2.y))} `;
  }
  body += `<path d="${d}" fill="none" stroke="${C_LINE}" stroke-width="2.4"/>`;

  // read a value off the curve the way a student would: straight lines between points
  const yAt = x => {
    if (x <= pts[0].x) return pts[0].y;
    if (x >= pts[pts.length-1].x) return pts[pts.length-1].y;
    for (let i = 0; i < pts.length - 1; i++){
      if (x >= pts[i].x && x <= pts[i+1].x){
        const t = (x - pts[i].x) / ((pts[i+1].x - pts[i].x) || 1);
        return pts[i].y + t * (pts[i+1].y - pts[i].y);
      }
    }
    return pts[pts.length-1].y;
  };
  const xAt = y => {
    for (let i = 0; i < pts.length - 1; i++){
      if ((y >= pts[i].y && y <= pts[i+1].y) || (y <= pts[i].y && y >= pts[i+1].y)){
        const span = (pts[i+1].y - pts[i].y) || 1;
        return pts[i].x + (y - pts[i].y) / span * (pts[i+1].x - pts[i].x);
      }
    }
    return y > pts[pts.length-1].y ? pts[pts.length-1].x : pts[0].x;
  };

  const READ = "#B4453C";
  const readings = spec.readings || [];
  if (readings.length){
    body += `<defs><marker id="rd" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="${READ}"/></marker></defs>`;
  }
  readings.forEach(r => {
    const hasY = r.y !== undefined && r.y !== null && r.y !== "";
    const y = hasY ? +r.y : yAt(+r.x);
    const x = r.x !== undefined && r.x !== null && r.x !== "" ? +r.x : xAt(y);
    if (!isFinite(x) || !isFinite(y)) return;
    body += `<path d="M ${num(X(xmin))} ${num(Y(y))} H ${num(X(x))}" fill="none"
      stroke="${READ}" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#rd)"/>`;
    body += `<path d="M ${num(X(x))} ${num(Y(y))} V ${num(Y(0))}" fill="none"
      stroke="${READ}" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#rd)"/>`;
    // Print the value the curve actually gives. The reading is computed here,
    // so a wrong number in the surrounding text shows up against the diagram
    // instead of passing unnoticed.
    const shown = r.showValue === false ? String(r.label || "")
      : ((r.label ? r.label + " \u2248 " : "") + (Math.round(x * 10) / 10));
    if (shown){
      const wpx = shown.length * 6.6 + 12;
      body += `<rect x="${num(X(x) - wpx / 2)}" y="${num(Y(0) + 6)}" width="${num(wpx)}"
        height="17" rx="3" fill="#fff" opacity="0.92"/>`;
      body += txt(X(x), Y(0) + 19, shown, { size:11.5, weight:600, fill:READ });
    }
  });

  if (spec.markers !== false){
    pts.forEach(p => {
      body += `<circle cx="${num(X(p.x))}" cy="${num(Y(p.y))}" r="4" fill="${C_FILL}"/>`;
    });
  }
  return svg(body);
};

/* Time series: points joined in time order, with optional smoothing and a
   least-squares trend line. A time series drawn as loose dots is the wrong
   plot — the joining line is what shows the trend. */
FIG.timeseries = spec => {
  const pts = (spec.points || []).map(p => ({ x:+p.x, y:+p.y }))
    .filter(p => isFinite(p.x) && isFinite(p.y))
    .sort((a, b) => a.x - b.x);
  if (pts.length < 2) throw new Error("need at least two points");

  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  const xmin = spec.xmin !== undefined ? +spec.xmin : Math.min(...xs);
  const xmax = spec.xmax !== undefined ? +spec.xmax : Math.max(...xs);
  const spread = Math.max(...ys) - Math.min(...ys) || 1;
  const ymin = spec.ymin !== undefined ? +spec.ymin : Math.max(0, Math.min(...ys) - spread * 0.15);
  const ymax = spec.ymax !== undefined ? +spec.ymax : Math.max(...ys) + spread * 0.15;
  const ax = axes(xmin, xmax, ymin, ymax, spec.xlabel || "", spec.ylabel || "");
  const { g, X, Y } = ax;
  let body = g;

  const path = list => list.map((p, i) =>
    (i ? "L" : "M") + num(X(p.x)) + " " + num(Y(p.y))).join(" ");

  body += `<path d="${path(pts)}" fill="none" stroke="${C_LINE}" stroke-width="2.2"
    stroke-linejoin="round"/>`;

  // smoothing: a centred moving mean or median over an odd window
  const sm = spec.smooth;
  if (sm && +sm.window >= 3){
    const win = Math.floor(+sm.window / 2) * 2 + 1;
    const half = (win - 1) / 2;
    const out = [];
    for (let i = half; i < pts.length - half; i++){
      const slice = pts.slice(i - half, i + half + 1).map(p => p.y).sort((a, b) => a - b);
      const value = (sm.type === "median")
        ? slice[half]
        : slice.reduce((t, v) => t + v, 0) / win;
      out.push({ x: pts[i].x, y: value });
    }
    if (out.length > 1){
      body += `<path d="${path(out)}" fill="none" stroke="${C_ALT}" stroke-width="2.4"
        stroke-dasharray="7 4" stroke-linejoin="round"/>`;
      body += txt(W - ax.R - 4, ax.T + 34,
        `${win}-point moving ${sm.type === "median" ? "median" : "mean"}`,
        { anchor:"end", size:12, weight:600, fill:C_ALT });
    }
  }

  // least-squares trend line, computed here rather than taken on trust
  if (spec.trend){
    let m, c;
    if (typeof spec.trend === "object" && isFinite(+spec.trend.m)){
      m = +spec.trend.m; c = +spec.trend.c || 0;
    } else {
      const n = pts.length;
      const mx = xs.reduce((t, v) => t + v, 0) / n, my = ys.reduce((t, v) => t + v, 0) / n;
      let num1 = 0, den = 0;
      pts.forEach(p => { num1 += (p.x - mx) * (p.y - my); den += (p.x - mx) ** 2; });
      m = den ? num1 / den : 0;
      c = my - m * mx;
    }
    body += `<line x1="${num(X(xmin))}" y1="${num(Y(m * xmin + c))}" x2="${num(X(xmax))}"
      y2="${num(Y(m * xmax + c))}" stroke="#6B3A78" stroke-width="2"/>`;
    const sign = c < 0 ? "-" : "+";
    body += txt(W - ax.R - 4, ax.T + 16,
      `trend: y = ${Math.round(m * 100) / 100}x ${sign} ${Math.abs(Math.round(c * 100) / 100)}`,
      { anchor:"end", size:12, weight:600, fill:"#6B3A78" });
  }

  if (spec.markers !== false){
    pts.forEach(p => {
      body += `<circle cx="${num(X(p.x))}" cy="${num(Y(p.y))}" r="4" fill="${C_FILL}"/>`;
    });
  }
  return svg(body);
};

FIG.network = spec => {
  const vs = (spec.vertices || []).map((v, i) => ({
    id: String(v.id), label: v.label !== undefined ? String(v.label) : String(v.id),
    x: v.x !== undefined ? +v.x : 50 + 38 * Math.cos(2*Math.PI*i/(spec.vertices.length||1)),
    y: v.y !== undefined ? +v.y : 50 + 38 * Math.sin(2*Math.PI*i/(spec.vertices.length||1)),
    value: v.value, circled: !!v.circled
  }));
  if (!vs.length) throw new Error("no vertices");
  const at = id => vs.find(v => v.id === String(id));
  const X = v => PAD + v / 100 * (W - PAD * 2);
  const Y = v => PAD + v / 100 * (H - PAD * 2);
  const directed = !!spec.directed;
  // e.highlight marks an edge as part of the algorithm's chosen answer (a
  // minimum spanning tree from Prim's/Kruskal's, or a shortest path from
  // Dijkstra's) — drawn bolder and in the answer colour against the rest of
  // the original graph, matching the textbook's own "draw it in red" convention.
  let body = directed ? `<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="${C_AXIS}"/></marker>
      <marker id="arh" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="${C_ALT}"/></marker></defs>` : "";
  (spec.edges || []).forEach(e => {
    const a = at(e.from), b = at(e.to);
    if (!a || !b) return;
    const hi = !!e.highlight;
    const x1 = X(a.x), y1 = Y(a.y), x2 = X(b.x), y2 = Y(b.y);
    const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1, r = 19;
    const ux = dx / len, uy = dy / len;
    body += `<line x1="${num(x1+ux*r)}" y1="${num(y1+uy*r)}" x2="${num(x2-ux*r)}" y2="${num(y2-uy*r)}"
      stroke="${hi ? C_ALT : C_AXIS}" stroke-width="${hi ? 3.2 : 1.8}"
      ${(directed||e.directed)?`marker-end="url(#${hi?"arh":"ar"})"`:""}/>`;
    if (e.weight !== undefined && e.weight !== null && e.weight !== ""){
      const mx = (x1 + x2) / 2 - uy * 12, my = (y1 + y2) / 2 + ux * 12;
      body += `<rect x="${num(mx-13)}" y="${num(my-10)}" width="26" height="17" rx="3" fill="#fff" opacity="0.9"/>`;
      body += txt(mx, my + 3, e.weight, { size:12, weight:600, fill:hi ? C_ALT : C_ALT });
    }
  });
  vs.forEach(v => {
    // v.circled draws a second, slightly larger ring around the vertex —
    // Dijkstra's algorithm's own convention for "this vertex's distance is
    // now finalised" — and v.value shows a running total (e.g. the assigned
    // distance-from-source) just outside the vertex, distinct from its name.
    if (v.circled) body += `<circle cx="${num(X(v.x))}" cy="${num(Y(v.y))}" r="22"
      fill="none" stroke="${C_LINE}" stroke-width="1.6"/>`;
    body += `<circle cx="${num(X(v.x))}" cy="${num(Y(v.y))}" r="18" fill="#fff" stroke="${C_LINE}" stroke-width="2"/>`;
    body += txt(X(v.x), Y(v.y) + 4.5, v.label, { size:13, weight:600, fill:C_LINE });
    if (v.value !== undefined && v.value !== null && v.value !== ""){
      body += txt(X(v.x) + 24, Y(v.y) - 22, v.value, { size:12, weight:700, fill:C_ALT, bg:"rgba(255,255,255,0.88)" });
    }
  });
  return svg(body);
};

/* Draw a string that may contain fractions like 1/2 or 1/2 x 1/4 = 1/8, as
   real LaTeX: each fraction becomes \frac{}{} and "x" between two fractions
   reads as multiplication, matching the tree figure's documented convention. */
function exprWidth(str, size){
  return String(str).split(/\s+/).reduce((total, tok) => {
    const f = tok.match(/^(-?\d+)\/(\d+)$/);
    const chars = f ? Math.max(f[1].length, f[2].length) : tok.length;
    return total + chars * size * 0.58 + size * 0.34;
  }, 0);
}

function texExpr(str){
  return String(str).split(/\s+/).filter(Boolean).map(tok => {
    const f = tok.match(/^(-?\d+)\/(\d+)$/);
    if (f) return `\\frac{${f[1]}}{${f[2]}}`;
    if (tok === "x" || tok === "X" || tok === "*") return "\\times";
    return texWrap(tok);
  }).join("\\ ");
}

function drawExpr(x, y, str, o){
  const opts = o || {};
  const size = opts.size || 13;
  const anchor = opts.anchor === "start" ? "start" : "middle";
  const latex = texExpr(str);
  const w = Math.max(exprWidth(str, size) + size, size * 2.4);
  const h = size * 2.3;
  const bx = anchor === "start" ? x : x - w / 2;
  const by = y - h / 2;
  const justify = anchor === "start" ? "flex-start" : "center";
  return `<foreignObject x="${num(bx)}" y="${num(by)}" width="${num(w)}" height="${num(h)}">
    <div xmlns="http://www.w3.org/1999/xhtml" class="mw-mathlabel" data-latex="${sx(latex)}"
      style="width:100%;height:100%;display:flex;align-items:center;justify-content:${justify};
      white-space:nowrap;font-size:${size}px;color:${opts.fill || C_INK};${opts.weight ? `font-weight:${opts.weight};` : ""}">${sx(latex)}</div>
  </foreignObject>`;
}

FIG.tree = spec => {
  const roots = spec.branches || [];
  if (!roots.length) throw new Error("no branches");

  let depth = 0;
  // Only count a level that has nodes in it, or an empty children array at the
  // last stage counts as another column and shifts every header along one.
  (function walk(ns, k){
    if (!ns || !ns.length) return;
    depth = Math.max(depth, k);
    ns.forEach(n => walk(n.children || [], k + 1));
  })(roots, 1);
  const leaves = [];
  (function collect(ns){
    ns.forEach(n => (n.children && n.children.length) ? collect(n.children) : leaves.push(n));
  })(roots);

  const hasOutcome = leaves.some(l => l.outcome);
  const hasResult = leaves.some(l => l.result);
  const headers = spec.headers || [];
  const top = headers.length ? 56 : 24;
  const rowH = 76;
  const h = Math.max(250, top + leaves.length * rowH + 24);
  const treeSpan = (hasOutcome || hasResult) ? 360 : 500;
  const colW = treeSpan / depth;
  const labelW = (n, size) => (String(n.label || "").length * size * 0.6) + 8;

  // place every node: x by level, y by the band of leaves beneath it
  const place = (nodes, level, bandTop, band) => {
    const each = band / nodes.length;
    nodes.forEach((n, i) => {
      n._x = 46 + (level + 1) * colW;
      n._y = bandTop + each * i + each / 2;
      if (n.children && n.children.length) place(n.children, level + 1, bandTop + each * i, each);
    });
  };
  place(roots, 0, top, h - top - 18);

  // Columns are placed from where the content actually ends, not at fixed
  // positions: a long leaf label would otherwise run under the outcome.
  const textW = (str, size) => String(str || "").length * size * 0.6;
  const leafEnd = Math.max(...leaves.map(n => n._x + 9 + textW(n.label, 14)));
  const outW = hasOutcome ? Math.max(...leaves.map(l => textW(l.outcome, 13))) : 0;
  const resW = hasResult ? Math.max(...leaves.map(l => exprWidth(l.result || "", 13))) : 0;
  const gap = 46;
  const outcomeX = hasOutcome ? leafEnd + gap + outW / 2 : leafEnd;
  const afterOutcome = hasOutcome ? outcomeX + outW / 2 : leafEnd;
  const resultX = hasResult ? afterOutcome + gap + resW / 2 : afterOutcome;
  const WT = Math.max(640, (hasResult ? resultX + resW / 2 : afterOutcome) + 28);

  let body = "";
  headers.forEach((head, i) => {
    let x;
    if (i < depth) x = 46 + (i + 1) * colW;
    else if (i === depth && hasOutcome) x = outcomeX;
    else if (hasResult) x = resultX;
    else return;
    body += txt(x, 30, head, { size:12.5, weight:600, fill:C_ALT });
  });

  const draw = (nodes, parent) => {
    nodes.forEach(n => {
      const px = parent ? parent._x + labelW(parent, 14) : 30;
      const py = parent ? parent._y : h / 2;
      const ex = n._x - 5, ey = n._y;

      body += `<line x1="${num(px)}" y1="${num(py)}" x2="${num(ex)}" y2="${num(ey)}"
        stroke="${C_AXIS}" stroke-width="1.6"/>`;

      // the probability sits above the branch, clear of the line
      if (n.prob !== undefined && n.prob !== null && n.prob !== ""){
        const mx = (px + ex) / 2, my = (py + ey) / 2;
        const dx = ex - px, dy = ey - py, len = Math.hypot(dx, dy) || 1;
        const off = 16;
        body += drawExpr(mx - (dy / len) * off, my + (dx / len) * off - 2, n.prob,
          { size:14, weight:600, fill:C_ALT });
      }

      body += `<circle cx="${num(n._x)}" cy="${num(n._y)}" r="4" fill="${C_LINE}"/>`;
      body += txt(n._x + 9, n._y + 5, n.label || "",
        { size:14, weight:600, anchor:"start", fill:C_INK });

      const leaf = !(n.children && n.children.length);
      if (leaf && n.outcome) body += txt(outcomeX, n._y + 5, n.outcome, { size:13, fill:C_INK });
      if (leaf && n.result) body += drawExpr(resultX, n._y, n.result, { size:13, fill:C_LINE });

      if (!leaf) draw(n.children, n);
    });
  };
  body += `<circle cx="26" cy="${num(h / 2)}" r="4.5" fill="${C_LINE}"/>`;
  draw(roots, null);
  return svg(body, WT, h);
};

/* Region keys arrive spelled every which way — "AB", "BA", "A and B",
   "both", "A only", "neither" — so resolve them rather than demanding one
   exact form. A Venn with blank regions is a failed diagram. */
function vennLookup(regions){
  const map = {};
  Object.keys(regions || {}).forEach(k => {
    const norm = String(k).toLowerCase()
      .replace(/[\s_\-∩∪&+.,'"]/g, "")
      .replace(/^only/, "").replace(/only$/, "");
    if (map[norm] === undefined) map[norm] = regions[k];
  });
  const pick = names => {
    for (const n of names){
      const v = map[String(n).toLowerCase().replace(/[\s_\-∩∪&+.,'"]/g, "")];
      if (v !== undefined && v !== null && v !== "") return v;
    }
    return "";
  };
  const perms = list => {
    if (list.length === 2) return [list.join(""), list.slice().reverse().join("")];
    const [a, b, c] = list;
    return [a+b+c, a+c+b, b+a+c, b+c+a, c+a+b, c+b+a];
  };
  return {
    only: name => pick([name, name + "only"]),
    both: list => pick([...perms(list),
      list.join("and"), list.slice().reverse().join("and"),
      list.length === 2 ? "both" : "allthree", list.length === 3 ? "all" : "both"]),
    none: () => pick(["none", "neither", "outside", "nothing", "other", "notinany"])
  };
}

FIG.dividedbar = spec => {
  const cats = (spec.categories || []).map(c => ({ label:String(c.label || ""), value:+c.value || 0 }));
  if (!cats.length) throw new Error("no categories");
  const total = spec.total !== undefined ? +spec.total : cats.reduce((a, c) => a + c.value, 0);
  if (!(total > 0)) throw new Error("total must be positive");
  const PALETTE = ["#4F2759", "#C59F40", "#6B3A78", "#8B6BA0", "#D9BC72", "#3A1E43"];
  const barX = 40, barW = W - 80, barY = 130, barH = 64;
  let body = "", cum = 0;
  cats.forEach((c, i) => {
    const segW = (c.value / total) * barW;
    const x0 = barX + (cum / total) * barW;
    const colour = PALETTE[i % PALETTE.length];
    body += `<rect x="${num(x0)}" y="${num(barY)}" width="${num(segW)}" height="${num(barH)}"
      fill="${colour}" fill-opacity="0.78" stroke="#fff" stroke-width="1.5"/>`;
    const midX = x0 + segW / 2;
    if (segW > 54){
      body += txt(midX, barY + barH / 2 - 8, c.label, { size:12, weight:600, fill:"#fff" });
      body += txt(midX, barY + barH / 2 + 10, num(c.value), { size:11, fill:"#fff" });
    } else {
      body += `<line x1="${num(midX)}" y1="${num(barY)}" x2="${num(midX)}" y2="${num(barY - 16)}"
        stroke="${C_AXIS}" stroke-width="1.2"/>`;
      body += txt(midX, barY - 22, `${c.label} (${num(c.value)})`, { size:11, fill:C_AXIS });
    }
    cum += c.value;
  });
  body += `<rect x="${num(barX)}" y="${num(barY)}" width="${num(barW)}" height="${num(barH)}"
    fill="none" stroke="${C_INK}" stroke-width="1.8"/>`;

  // The scale below is the point of a divided bar graph: boundary ticks sit
  // exactly at each cumulative total so a student can read a category's
  // value straight off the axis, not just compare relative segment widths.
  const scaleY = barY + barH + 30;
  body += `<line x1="${num(barX)}" y1="${num(scaleY)}" x2="${num(barX + barW)}" y2="${num(scaleY)}"
    stroke="${C_AXIS}" stroke-width="1.4"/>`;
  let cum2 = 0;
  const boundaries = [0];
  cats.forEach(c => { cum2 += c.value; boundaries.push(cum2); });
  boundaries.forEach(v => {
    const x = barX + (v / total) * barW;
    body += `<line x1="${num(x)}" y1="${num(scaleY - 6)}" x2="${num(x)}" y2="${num(scaleY + 6)}"
      stroke="${C_AXIS}" stroke-width="1.4"/>`;
    body += `<line x1="${num(x)}" y1="${num(barY + barH)}" x2="${num(x)}" y2="${num(scaleY - 6)}"
      stroke="${C_GRID}" stroke-width="1" stroke-dasharray="3 3"/>`;
    body += txt(x, scaleY + 20, num(v), { size:11, fill:C_AXIS });
  });
  if (spec.title) body += txt(W / 2, 30, spec.title, { size:14, weight:600, fill:C_INK });
  return svg(body, W, scaleY + 40);
};

FIG.venn = spec => {
  const sets = (spec.sets || []).map(String);
  const look = vennLookup(spec.regions);
  const h = 300;
  let body = `<rect x="30" y="30" width="${W-60}" height="${h-60}" fill="none" stroke="${C_AXIS}" stroke-dasharray="4 4"/>`;
  if (sets.length <= 2){
    const A = sets[0] || "A", B = sets[1] || "B";
    body += `<circle cx="255" cy="${h/2}" r="95" fill="${C_FILL}" opacity="0.10" stroke="${C_LINE}" stroke-width="1.8"/>`;
    body += `<circle cx="385" cy="${h/2}" r="95" fill="${C_ALT}" opacity="0.14" stroke="${C_ALT}" stroke-width="1.8"/>`;
    body += txt(200, 62, A, { weight:600, fill:C_LINE, size:14 });
    body += txt(440, 62, B, { weight:600, fill:C_ALT, size:14 });
    body += txt(205, h/2 + 5, look.only(A), { size:16, weight:600 });
    body += txt(320, h/2 + 5, look.both([A, B]), { size:16, weight:600 });
    body += txt(435, h/2 + 5, look.only(B), { size:16, weight:600 });
    body += txt(W - 62, h - 46, look.none(), { size:14 });
  } else {
    const [A, B, C3] = sets;
    const cx = 320, cy = 140, rr = 82;
    const pos = [[cx-52,cy-22],[cx+52,cy-22],[cx,cy+62]];
    const cols = [C_LINE, C_ALT, "#6B3A78"];
    pos.forEach((p, i) => {
      body += `<circle cx="${p[0]}" cy="${p[1]}" r="${rr}" fill="${cols[i]}" opacity="0.10" stroke="${cols[i]}" stroke-width="1.8"/>`;
    });
    body += txt(pos[0][0]-58, pos[0][1]-58, A, { weight:600, fill:cols[0] });
    body += txt(pos[1][0]+58, pos[1][1]-58, B, { weight:600, fill:cols[1] });
    body += txt(pos[2][0], pos[2][1]+82, C3, { weight:600, fill:cols[2] });
    body += txt(pos[0][0]-32, pos[0][1]-6, look.only(A), { size:15, weight:600 });
    body += txt(pos[1][0]+32, pos[1][1]-6, look.only(B), { size:15, weight:600 });
    body += txt(pos[2][0], pos[2][1]+38, look.only(C3), { size:15, weight:600 });
    body += txt(cx, cy - 34, look.both([A, B]), { size:14 });
    body += txt(cx - 46, cy + 32, look.both([A, C3]), { size:14 });
    body += txt(cx + 46, cy + 32, look.both([B, C3]), { size:14 });
    body += txt(cx, cy + 10, look.both([A, B, C3]), { size:15, weight:600 });
    body += txt(W - 62, h - 46, look.none(), { size:14 });
  }
  return svg(body, W, h);
};

FIG.geometry = spec => {
  const pts = (spec.points || []).map(p => ({ name:String(p.name), x:+p.x, y:+p.y }));
  const circles = spec.circles || [];
  const sectors = spec.sectors || [];
  const all = pts.concat(circles.flatMap(c => [
    { x:+c.cx - +c.r, y:+c.cy - +c.r }, { x:+c.cx + +c.r, y:+c.cy + +c.r }]))
    .concat(sectors.flatMap(s => [
    { x:+s.cx - +s.r, y:+s.cy - +s.r }, { x:+s.cx + +s.r, y:+s.cy + +s.r }]));
  if (!all.length) throw new Error("nothing to draw");
  const xs = all.map(p => p.x), ys = all.map(p => p.y);
  const spanx = Math.max(...xs) - Math.min(...xs) || 1, spany = Math.max(...ys) - Math.min(...ys) || 1;
  const h = 360, m = 52;
  const k = Math.min((W - m*2) / spanx, (h - m*2) / spany);
  const X = v => m + (v - Math.min(...xs)) * k;
  const Y = v => h - m - (v - Math.min(...ys)) * k;
  const at = n => pts.find(p => p.name === String(n));
  let body = "";
  circles.forEach(c => {
    body += `<circle cx="${num(X(+c.cx))}" cy="${num(Y(+c.cy))}" r="${num(+c.r * k)}"
      fill="none" stroke="${C_LINE}" stroke-width="1.8"/>`;
  });
  // A sector (minor or major) for arc-length/area-of-a-sector questions —
  // the arc is sampled point-by-point and joined with straight segments
  // rather than built from a single SVG arc command, so there's no sweep/
  // large-arc-flag ambiguity to get wrong: it always sweeps from start to
  // end exactly as given (degrees, standard maths convention: 0 = east,
  // increasing counterclockwise) — go from the larger angle to the smaller
  // one, or vice versa, whichever direction is the wanted sector.
  sectors.forEach(sec => {
    const cx = +sec.cx, cy = +sec.cy, r = +sec.r;
    if (!(r > 0)) return;
    const a0 = +sec.start, a1 = +sec.end;
    const N = 60, rad = deg => deg * Math.PI / 180;
    const arcPt = deg => ({ x: X(cx + r * Math.cos(rad(deg))), y: Y(cy + r * Math.sin(rad(deg))) });
    let d = "";
    for (let i = 0; i <= N; i++){
      const p = arcPt(a0 + (a1 - a0) * i / N);
      d += (i ? "L" : "M") + num(p.x) + " " + num(p.y) + " ";
    }
    if (sec.filled){
      const c0 = { x: X(cx), y: Y(cy) };
      body += `<path d="${d} L ${num(c0.x)} ${num(c0.y)} Z" fill="${C_FILL}" fill-opacity="0.30"
        stroke="${C_LINE}" stroke-width="1.8"/>`;
    } else {
      body += `<path d="${d}" fill="none" stroke="${C_LINE}" stroke-width="1.8"/>`;
      const p0 = arcPt(a0), p1 = arcPt(a1), c0 = { x: X(cx), y: Y(cy) };
      body += `<line x1="${num(c0.x)}" y1="${num(c0.y)}" x2="${num(p0.x)}" y2="${num(p0.y)}" stroke="${C_LINE}" stroke-width="1.8"/>`;
      body += `<line x1="${num(c0.x)}" y1="${num(c0.y)}" x2="${num(p1.x)}" y2="${num(p1.y)}" stroke="${C_LINE}" stroke-width="1.8"/>`;
    }
    if (sec.label){
      const lp = arcPt((a0 + a1) / 2);
      const lx = X(cx) + (lp.x - X(cx)) * 0.6, ly = Y(cy) + (lp.y - Y(cy)) * 0.6;
      body += txt(lx, ly, sec.label, { size:12, weight:600, fill:C_ALT, bg:"rgba(255,255,255,0.85)" });
    }
  });
  (spec.segments || []).forEach(s => {
    const a = at(s.from), b = at(s.to);
    if (!a || !b) return;
    body += `<line x1="${num(X(a.x))}" y1="${num(Y(a.y))}" x2="${num(X(b.x))}" y2="${num(Y(b.y))}"
      stroke="${C_LINE}" stroke-width="2"${s.dashed ? ' stroke-dasharray="5 4"' : ""}/>`;
    const dx0 = X(b.x) - X(a.x), dy0 = Y(b.y) - Y(a.y), L0 = Math.hypot(dx0, dy0) || 1;
    if (s.ticks){
      // The number of tick marks groups sides as equal for a congruence proof
      // (matching ticks = matching lengths) — this is the mark itself, not a
      // measured length, so it deliberately carries no number.
      const n = Math.min(3, Math.max(1, Math.trunc(+s.ticks)));
      const ux = dx0 / L0, uy = dy0 / L0, px = -uy, py = ux;
      const mx = (X(a.x) + X(b.x)) / 2, my = (Y(a.y) + Y(b.y)) / 2;
      const spacing = 6, tickLen = 7;
      for (let i = 0; i < n; i++){
        const off = (i - (n - 1) / 2) * spacing;
        const cx2 = mx + ux * off, cy2 = my + uy * off;
        body += `<line x1="${num(cx2 - px * tickLen)}" y1="${num(cy2 - py * tickLen)}"
          x2="${num(cx2 + px * tickLen)}" y2="${num(cy2 + py * tickLen)}" stroke="${C_LINE}" stroke-width="1.8"/>`;
      }
    }
    if (s.label){
      const mx = (X(a.x) + X(b.x)) / 2, my = (Y(a.y) + Y(b.y)) / 2;
      const dx = dx0, dy = dy0, L = L0;
      body += `<rect x="${num(mx - 16 - dy/L*10)}" y="${num(my - 10 + dx/L*10)}" width="32" height="16" rx="3" fill="#fff" opacity="0.88"/>`;
      body += txt(mx - dy/L*10, my + 3 + dx/L*10, s.label, { size:12, weight:600, fill:C_ALT });
    }
  });
  (spec.rightangles || []).forEach(a => {
    const v = at(a.at), p = at(a.from), q = at(a.to);
    if (!v || !p || !q) return;
    const u1 = norm(X(p.x)-X(v.x), Y(p.y)-Y(v.y)), u2 = norm(X(q.x)-X(v.x), Y(q.y)-Y(v.y));
    const s = 13;
    body += `<path d="M ${num(X(v.x)+u1[0]*s)} ${num(Y(v.y)+u1[1]*s)}
      L ${num(X(v.x)+(u1[0]+u2[0])*s)} ${num(Y(v.y)+(u1[1]+u2[1])*s)}
      L ${num(X(v.x)+u2[0]*s)} ${num(Y(v.y)+u2[1]*s)}" fill="none" stroke="${C_AXIS}" stroke-width="1.4"/>`;
  });
  (spec.angles || []).forEach(a => {
    const v = at(a.at), p = at(a.from), q = at(a.to);
    if (!v || !p || !q) return;
    const u1 = norm(X(p.x)-X(v.x), Y(p.y)-Y(v.y)), u2 = norm(X(q.x)-X(v.x), Y(q.y)-Y(v.y));
    // One arc per tick, concentric — the count groups angles as equal for a
    // congruence proof, the same convention as a segment's tick marks.
    const n = Math.min(3, Math.max(1, Math.trunc(+a.ticks) || 1));
    let s = 24;
    for (let i = 0; i < n; i++){
      body += `<path d="M ${num(X(v.x)+u1[0]*s)} ${num(Y(v.y)+u1[1]*s)} A ${s} ${s} 0 0 1
        ${num(X(v.x)+u2[0]*s)} ${num(Y(v.y)+u2[1]*s)}" fill="none" stroke="${C_ALT}" stroke-width="1.6"/>`;
      s += 6;
    }
    if (a.label){
      const b = norm(u1[0]+u2[0], u1[1]+u2[1]);
      body += txt(X(v.x)+b[0]*(s+12), Y(v.y)+b[1]*(s+12)+4, a.label, { size:12, fill:C_ALT, weight:600 });
    }
  });
  pts.forEach(p => {
    body += `<circle cx="${num(X(p.x))}" cy="${num(Y(p.y))}" r="4" fill="${C_LINE}"/>`;
    body += txt(X(p.x), Y(p.y) - 12, p.name, { size:13, weight:600 });
  });
  return svg(body, W, h);
};

FIG.transform = spec => {
  const shapes = (spec.shapes || []).map(s => ({
    points: (s.points || []).map(p => ({ x:+p.x, y:+p.y, label:p.label ? String(p.label) : "" })),
    label: s.label || "",
    style: s.style === "image" ? "image" : "original"
  }));
  if (!shapes.length || shapes.some(s => s.points.length < 2)) throw new Error("need shapes with points");

  const allPts = shapes.flatMap(s => s.points);
  if (spec.centre) allPts.push({ x:+spec.centre.x, y:+spec.centre.y });
  if (spec.vector){
    if (spec.vector.from) allPts.push({ x:+spec.vector.from.x, y:+spec.vector.from.y });
    if (spec.vector.to) allPts.push({ x:+spec.vector.to.x, y:+spec.vector.to.y });
  }
  if (spec.mirrorLine && spec.mirrorLine.type === "line"){
    allPts.push({ x:+spec.mirrorLine.from.x, y:+spec.mirrorLine.from.y });
    allPts.push({ x:+spec.mirrorLine.to.x, y:+spec.mirrorLine.to.y });
  }
  const xs = allPts.map(p => p.x), ys = allPts.map(p => p.y);
  const pad = 1;
  const xmin = spec.xmin !== undefined ? +spec.xmin : Math.floor(Math.min(...xs)) - pad;
  const xmax = spec.xmax !== undefined ? +spec.xmax : Math.ceil(Math.max(...xs)) + pad;
  const ymin = spec.ymin !== undefined ? +spec.ymin : Math.floor(Math.min(...ys)) - pad;
  const ymax = spec.ymax !== undefined ? +spec.ymax : Math.ceil(Math.max(...ys)) + pad;

  // A transformation grid has to keep its unit squares actually square — an
  // independent x-scale and y-scale (the usual axes() approach, fine for a
  // function plot) silently stretches angles and side-length ratios, which
  // defeats the point of drawing a reflection/rotation/translation on a grid.
  const h = 400, L = 42, R = 22, T = 22, B = 38;
  const availW = W - L - R, availH = h - T - B;
  const xspan = (xmax - xmin) || 1, yspan = (ymax - ymin) || 1;
  const scale = Math.min(availW / xspan, availH / yspan);
  const drawnW = xspan * scale, drawnH = yspan * scale;
  const offsetX = L + (availW - drawnW) / 2, offsetYtop = T + (availH - drawnH) / 2;
  const X = v => offsetX + (v - xmin) * scale;
  const Y = v => offsetYtop + drawnH - (v - ymin) * scale;

  const top = offsetYtop, bottom = offsetYtop + drawnH, left = offsetX, right = offsetX + drawnW;
  let body = "";
  for (let v = Math.ceil(xmin); v <= xmax; v++){
    body += `<line x1="${num(X(v))}" y1="${num(top)}" x2="${num(X(v))}" y2="${num(bottom)}" stroke="${C_GRID}"/>`;
  }
  for (let v = Math.ceil(ymin); v <= ymax; v++){
    body += `<line x1="${num(left)}" y1="${num(Y(v))}" x2="${num(right)}" y2="${num(Y(v))}" stroke="${C_GRID}"/>`;
  }
  if (xmin <= 0 && xmax >= 0) body += `<line x1="${num(X(0))}" y1="${num(top)}" x2="${num(X(0))}" y2="${num(bottom)}"
    stroke="${C_AXIS}" stroke-width="1.6"/>`;
  if (ymin <= 0 && ymax >= 0) body += `<line x1="${num(left)}" y1="${num(Y(0))}" x2="${num(right)}" y2="${num(Y(0))}"
    stroke="${C_AXIS}" stroke-width="1.6"/>`;
  const xStep = (xmax - xmin) > 14 ? 2 : 1, yStep = (ymax - ymin) > 14 ? 2 : 1;
  for (let v = Math.ceil(xmin / xStep) * xStep; v <= xmax; v += xStep){
    body += txt(X(v), bottom + 16, num(v), { size:11, fill:C_AXIS });
  }
  for (let v = Math.ceil(ymin / yStep) * yStep; v <= ymax; v += yStep){
    body += txt(left - 9, Y(v) + 4, num(v), { size:11, fill:C_AXIS, anchor:"end" });
  }

  if (spec.mirrorLine){
    const ml = spec.mirrorLine;
    let x1, y1, x2, y2;
    if (ml.type === "horizontal"){ x1 = left; x2 = right; y1 = y2 = Y(+ml.y); }
    else if (ml.type === "vertical"){ y1 = top; y2 = bottom; x1 = x2 = X(+ml.x); }
    else if (ml.type === "line"){ x1 = X(+ml.from.x); y1 = Y(+ml.from.y); x2 = X(+ml.to.x); y2 = Y(+ml.to.y); }
    if (x1 !== undefined){
      body += `<line x1="${num(x1)}" y1="${num(y1)}" x2="${num(x2)}" y2="${num(y2)}"
        stroke="${C_ALT}" stroke-width="2" stroke-dasharray="6 4"/>`;
      if (ml.label) body += txt((x1 + x2) / 2, (y1 + y2) / 2 - 8, ml.label,
        { size:12, weight:600, fill:C_ALT, bg:"rgba(255,255,255,0.85)" });
    }
  }

  if (spec.centre){
    const cx = X(+spec.centre.x), cy = Y(+spec.centre.y);
    body += `<circle cx="${num(cx)}" cy="${num(cy)}" r="4" fill="${C_AXIS}"/>`;
    body += txt(cx + 10, cy - 8, spec.centre.label || "centre", { size:11, fill:C_AXIS });

    // Enlargement rays: a dashed line from the centre through each vertex
    // pair, out to whichever of the original/image point sits farther away —
    // that same line necessarily passes through the nearer one too, since an
    // enlargement's image points are collinear with the centre by definition.
    if (spec.rays){
      const orig = shapes.find(s => s.style === "original");
      const img = shapes.find(s => s.style === "image");
      if (orig && img && orig.points.length === img.points.length){
        orig.points.forEach((p, i) => {
          const q = img.points[i];
          if (!q) return;
          const dOrig = Math.hypot(p.x - spec.centre.x, p.y - spec.centre.y);
          const dImg = Math.hypot(q.x - spec.centre.x, q.y - spec.centre.y);
          const far = dImg > dOrig ? q : p;
          body += `<line x1="${num(cx)}" y1="${num(cy)}" x2="${num(X(far.x))}" y2="${num(Y(far.y))}"
            stroke="${C_AXIS}" stroke-width="1.2" stroke-dasharray="4 3"/>`;
        });
      }
    }
  }

  if (spec.vector){
    const from = spec.vector.from || { x:0, y:0 };
    const to = spec.vector.to || { x:+spec.vector.dx, y:+spec.vector.dy };
    body += `<defs><marker id="tvArrow" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="${C_LINE}"/></marker></defs>`;
    body += `<line x1="${num(X(+from.x))}" y1="${num(Y(+from.y))}" x2="${num(X(+to.x))}" y2="${num(Y(+to.y))}"
      stroke="${C_LINE}" stroke-width="2.2" marker-end="url(#tvArrow)"/>`;
  }

  shapes.forEach(s => {
    const isImage = s.style === "image";
    const colour = isImage ? C_ALT : C_LINE;
    const d = s.points.map((p, i) => `${i ? "L" : "M"}${num(X(p.x))} ${num(Y(p.y))}`).join(" ") + " Z";
    body += `<path d="${d}" fill="${colour}" fill-opacity="${isImage ? 0.12 : 0.16}"
      stroke="${colour}" stroke-width="2" ${isImage ? 'stroke-dasharray="6 4"' : ""}/>`;
    s.points.forEach(p => {
      body += `<circle cx="${num(X(p.x))}" cy="${num(Y(p.y))}" r="3.2" fill="${colour}"/>`;
      if (p.label) body += txt(X(p.x) + 9, Y(p.y) - 8, p.label,
        { size:12, weight:600, fill:colour, bg:"rgba(255,255,255,0.85)" });
    });
    if (s.label && !s.points.some(p => p.label)){
      const cx = s.points.reduce((a, p) => a + X(p.x), 0) / s.points.length;
      const cy = s.points.reduce((a, p) => a + Y(p.y), 0) / s.points.length;
      body += txt(cx, cy, s.label, { size:14, weight:700, fill:colour, bg:"rgba(255,255,255,0.85)" });
    }
  });

  return svg(body, W, h);
};

function norm(x, y){ const l = Math.hypot(x, y) || 1; return [x / l, y / l]; }

FIG.mindmap = spec => {
  const branches = (spec.branches || []).slice(0, 5);
  if (!branches.length) throw new Error("no branches");
  const h = 420, cx = W / 2, cy = h / 2;

  const wrap = (text, per) => {
    const words = String(text).split(/\s+/);
    const lines = [];
    let line = "";
    words.forEach(word => {
      if ((line + " " + word).trim().length > per && line){ lines.push(line); line = word; }
      else line = (line + " " + word).trim();
    });
    if (line) lines.push(line);
    return lines.slice(0, 2);
  };

  const centre = wrap(spec.centre || "Topic", 18);
  let body = `<ellipse cx="${cx}" cy="${cy}" rx="88" ry="36" fill="${C_FILL}" opacity="0.12"
    stroke="${C_LINE}" stroke-width="2"/>`;
  centre.forEach((line, i) => {
    body += txt(cx, cy + 5 + (i - (centre.length - 1) / 2) * 16, line,
      { size:14, weight:600, fill:C_LINE });
  });

  const n = branches.length;
  branches.forEach((b, i) => {
    const ang = -Math.PI / 2 + (2 * Math.PI * i / n);
    const bx = cx + Math.cos(ang) * 196, by = cy + Math.sin(ang) * 142;
    const lines = wrap(b.label || "", 17);
    const bw = Math.max(96, Math.min(168, 8 * Math.max(...lines.map(l => l.length)) + 22));
    const bh = lines.length > 1 ? 42 : 30;

    body += `<line x1="${num(cx + Math.cos(ang) * 86)}" y1="${num(cy + Math.sin(ang) * 35)}"
      x2="${num(bx)}" y2="${num(by)}" stroke="${C_ALT}" stroke-width="2.2"/>`;
    body += `<rect x="${num(bx - bw/2)}" y="${num(by - bh/2)}" width="${num(bw)}" height="${bh}"
      rx="4" fill="#fff" stroke="${C_ALT}" stroke-width="1.8"/>`;
    lines.forEach((line, k) => {
      body += txt(bx, by + 5 + (k - (lines.length - 1) / 2) * 15, line,
        { size:12, weight:600, fill:C_ALT });
    });
    body += `<circle cx="${num(bx - bw/2 - 9)}" cy="${num(by)}" r="9" fill="${C_LINE}"/>`;
    body += txt(bx - bw/2 - 9, by + 4, String(i + 1), { size:11, weight:600, fill:"#fff" });
  });
  return svg(body, W, h);
};

/* --- Pictorial models ------------------------------------------------ *
 * The models Years 7 to 9 are actually taught with: the balance, the
 * backtracking flow chart, bar models, number lines and area models.
 * These carry more of the explanation at that level than a graph does.
 * ------------------------------------------------------------------ */

FIG.numberline = spec => {
  const min = +spec.min, max = +spec.max;
  if (!(max > min)) throw new Error("range");
  const h = 190, y = 122;
  const X = v => PAD + (v - min) / (max - min) * (W - PAD * 2);
  const step = +spec.step || niceStep(max - min);
  let body = `<line x1="${PAD - 14}" y1="${y}" x2="${W - PAD + 14}" y2="${y}"
    stroke="${C_AXIS}" stroke-width="2"/>`;
  body += `<path d="M${W-PAD+14} ${y} l-9 -5 v10 z" fill="${C_AXIS}"/>`;
  body += `<path d="M${PAD-14} ${y} l9 -5 v10 z" fill="${C_AXIS}"/>`;
  for (let v = Math.ceil(min / step) * step; v <= max + 1e-9; v += step){
    body += `<line x1="${num(X(v))}" y1="${y-7}" x2="${num(X(v))}" y2="${y+7}" stroke="${C_AXIS}" stroke-width="1.5"/>`;
    body += txt(X(v), y + 26, num(v), { size:12, fill:C_AXIS });
  }
  (spec.jumps || []).forEach((j, i) => {
    const a = X(+j.from), b = X(+j.to), lift = 34 + (i % 2) * 22;
    body += `<path d="M${num(a)} ${y-9} Q ${num((a+b)/2)} ${num(y-9-lift)} ${num(b)} ${y-9}"
      fill="none" stroke="${C_ALT}" stroke-width="2.2"/>`;
    const dir = b >= a ? -1 : 1;
    body += `<path d="M${num(b)} ${y-9} l${dir*8} -8 l1 10 z" fill="${C_ALT}"/>`;
    if (j.label) body += txt((a + b) / 2, y - 16 - lift, j.label, { size:12, weight:600, fill:C_ALT });
  });
  (spec.marks || []).forEach(m => {
    // The actual answer needs to read as the point, not just one dot among
    // several reference marks along the way — bigger, gold, bolder label.
    const isAnswer = !!m.answer;
    body += `<circle cx="${num(X(+m.at))}" cy="${y}" r="${isAnswer ? 8 : 4.5}"
      fill="${isAnswer ? C_ALT : C_LINE}" fill-opacity="${isAnswer ? 1 : 0.5}"/>`;
    if (m.label) body += txt(X(+m.at), y + 46, m.label,
      { size:isAnswer ? 13 : 12, weight:isAnswer ? 700 : 600, fill:isAnswer ? C_ALT : C_LINE });
  });
  return svg(body, W, h);
};

FIG.barmodel = spec => {
  const rows = spec.rows || [];
  if (!rows.length) throw new Error("no rows");
  const widest = Math.max(...rows.map(r => (r.parts || []).reduce((t, p) => t + (+p.value || 1), 0)));
  const rowH = 52, h = 34 + rows.length * rowH + 16;
  const left = 96, span = W - left - PAD;
  let body = "";
  rows.forEach((r, i) => {
    const y = 26 + i * rowH;
    body += txt(left - 12, y + 27, r.label || "", { size:12.5, anchor:"end", fill:C_LINE, weight:600 });
    let x = left;
    (r.parts || []).forEach((p, k) => {
      const wpx = (+p.value || 1) / widest * span;
      const fill = p.highlight ? C_ALT : C_FILL;
      body += `<rect x="${num(x)}" y="${y}" width="${num(wpx)}" height="40" rx="3"
        fill="${fill}" fill-opacity="${p.highlight ? 0.28 : 0.16}" stroke="${fill}" stroke-width="1.8"/>`;
      body += txt(x + wpx / 2, y + 25, p.label !== undefined ? p.label : "",
        { size:13, weight:600, fill: p.highlight ? C_ALT : C_LINE });
      x += wpx;
    });
    if (r.total !== undefined && r.total !== ""){
      body += `<path d="M${left} ${y+46} v6 H${num(x)} v-6" fill="none" stroke="${C_AXIS}" stroke-width="1.3"/>`;
      body += txt((left + x) / 2, y + 66, r.total, { size:12, fill:C_AXIS });
    }
  });
  return svg(body, W, h);
};

// Builds one side's term, e.g. three "x" blocks -> "3x", two blocks each
// labelled "1" -> "2". Read straight off the same data the pans are drawn
// from, so the equation shown can never disagree with the blocks a student
// is actually looking at.
function balanceSide(items){
  return (items || []).map(item => {
    const n = Math.max(1, +item.count || 1);
    if ((item.kind || "unit") === "var"){
      const label = item.label !== undefined ? item.label : "x";
      return (n === 1 ? "" : n) + label;
    }
    const per = (item.label !== undefined && item.label !== "" && !isNaN(+item.label)) ? +item.label : 1;
    return String(n * per);
  }).join(" + ") || "0";
}

// Real KaTeX typesetting, not plain SVG text — plain <text> can't be
// rendered as LaTeX, so this drops an HTML box into the SVG via
// foreignObject. typesetIn()'s own $...$-scanning pass explicitly skips
// <svg> subtrees, so this can't rely on that — instead the exact source is
// stashed in data-latex, and typesetIn() renders every .mw-mathlabel node
// directly with katex.render() once the figure is actually in the DOM.
// The plain text starts as a fallback in case that render never runs.
function mathLabel(cx, cy, latex){
  const wpx = 130, hpx = 44;
  return `<foreignObject x="${num(cx - wpx / 2)}" y="${num(cy - hpx / 2)}" width="${wpx}" height="${hpx}">
    <div xmlns="http://www.w3.org/1999/xhtml" class="mw-mathlabel" data-latex="${sx(latex)}"
      style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;
      font-size:21px;color:${C_LINE};">${sx(latex)}</div>
  </foreignObject>`;
}

FIG.balance = spec => {
  const h = 300, midX = W / 2, beamY = 96;
  const draw = (items, cx) => {
    let out = "", x = cx - 108;
    let y = beamY + 34;
    (items || []).forEach(item => {
      const n = Math.max(1, +item.count || 1);
      const isVar = (item.kind || "unit") === "var";
      for (let k = 0; k < n; k++){
        const wpx = isVar ? 40 : 26, hpx = isVar ? 46 : 26;
        if (x + wpx > cx + 108){ x = cx - 108; y += 54; }
        out += `<rect x="${num(x)}" y="${num(y + (isVar ? 0 : 12))}" width="${wpx}" height="${hpx}" rx="3"
          fill="${isVar ? C_FILL : C_ALT}" fill-opacity="0.2" stroke="${isVar ? C_LINE : C_ALT}" stroke-width="1.8"/>`;
        out += txt(x + wpx / 2, y + (isVar ? 28 : 30), item.label !== undefined ? item.label : (isVar ? "x" : "1"),
          { size:13, weight:600, fill: isVar ? C_LINE : C_ALT });
        x += wpx + 8;
      }
    });
    return out;
  };
  let body = `<line x1="${midX - 210}" y1="${beamY}" x2="${midX + 210}" y2="${beamY}"
    stroke="${C_AXIS}" stroke-width="4" stroke-linecap="round"/>`;
  body += `<path d="M${midX} ${beamY} l-26 74 h52 z" fill="${C_FILL}" fill-opacity="0.18" stroke="${C_LINE}" stroke-width="2"/>`;
  [-1, 1].forEach(side => {
    const cx = midX + side * 150;
    body += `<line x1="${cx}" y1="${beamY}" x2="${cx}" y2="${beamY + 26}" stroke="${C_AXIS}" stroke-width="2"/>`;
    body += `<line x1="${cx - 112}" y1="${beamY + 26}" x2="${cx + 112}" y2="${beamY + 26}" stroke="${C_AXIS}" stroke-width="3"/>`;
  });
  body += draw(spec.left, midX - 150);
  body += draw(spec.right, midX + 150);
  body += txt(midX, beamY - 14, "=", { size:20, weight:600, fill:C_AXIS });
  body += mathLabel(midX - 150, beamY - 14, balanceSide(spec.left));
  body += mathLabel(midX + 150, beamY - 14, balanceSide(spec.right));
  if (spec.leftLabel) body += txt(midX - 150, 26, spec.leftLabel, { size:13, weight:600, fill:C_LINE });
  if (spec.rightLabel) body += txt(midX + 150, 26, spec.rightLabel, { size:13, weight:600, fill:C_LINE });
  return svg(body, W, h);
};

FIG.backtrack = spec => {
  const steps = spec.steps || [];
  if (!steps.length) throw new Error("no steps");
  const cells = [spec.start !== undefined ? spec.start : "x", ...steps.map(t => t.value !== undefined ? t.value : "")];
  const h = 236, y = 96, bw = Math.min(104, (W - PAD * 2 - steps.length * 46) / cells.length);
  const gap = (W - PAD * 2 - cells.length * bw) / Math.max(1, cells.length - 1);
  const cx = i => PAD + i * (bw + gap) + bw / 2;
  let body = "";
  cells.forEach((c, i) => {
    body += `<rect x="${num(cx(i) - bw/2)}" y="${y}" width="${num(bw)}" height="46" rx="4"
      fill="#fff" stroke="${C_LINE}" stroke-width="2"/>`;
    body += txt(cx(i), y + 29, c, { size:14, weight:600, fill:C_LINE });
  });
  steps.forEach((t, i) => {
    const a = cx(i) + bw / 2, b = cx(i + 1) - bw / 2, mid = (a + b) / 2;
    body += `<path d="M${num(a+4)} ${y+12} H${num(b-10)}" stroke="${C_ALT}" stroke-width="2"/>`;
    body += `<path d="M${num(b-4)} ${y+12} l-9 -5 v10 z" fill="${C_ALT}"/>`;
    body += txt(mid, y - 8, t.op || "", { size:13, weight:600, fill:C_ALT });
    body += `<path d="M${num(b-4)} ${y+36} H${num(a+10)}" stroke="${C_AXIS}" stroke-width="2" stroke-dasharray="5 4"/>`;
    body += `<path d="M${num(a+4)} ${y+36} l9 -5 v10 z" fill="${C_AXIS}"/>`;
    body += txt(mid, y + 62, t.inverse || "", { size:13, weight:600, fill:C_AXIS });
  });
  body += txt(PAD, y + 106, "forward: what the equation does", { size:11.5, anchor:"start", fill:C_ALT });
  body += txt(PAD, y + 126, "backwards: how you undo it", { size:11.5, anchor:"start", fill:C_AXIS });
  return svg(body, W, h);
};

FIG.areamodel = spec => {
  const rows = spec.rows || [], cols = spec.cols || [], cells = spec.cells || [];
  if (!rows.length || !cols.length) throw new Error("rows and cols needed");
  const cw = Math.min(150, (W - PAD * 2 - 70) / cols.length);
  const ch = 66;
  const x0 = PAD + 70, y0 = 66;
  const h = y0 + rows.length * ch + 34;
  let body = "";
  cols.forEach((c, j) => body += txt(x0 + j * cw + cw / 2, y0 - 14, c, { size:14, weight:600, fill:C_ALT }));
  rows.forEach((r, i) => {
    body += txt(x0 - 16, y0 + i * ch + ch / 2 + 5, r, { size:14, weight:600, anchor:"end", fill:C_ALT });
    cols.forEach((c, j) => {
      body += `<rect x="${num(x0 + j*cw)}" y="${num(y0 + i*ch)}" width="${num(cw)}" height="${ch}"
        fill="${C_FILL}" fill-opacity="0.07" stroke="${C_LINE}" stroke-width="1.6"/>`;
      const v = (cells[i] || [])[j];
      if (v !== undefined) body += txt(x0 + j*cw + cw/2, y0 + i*ch + ch/2 + 6, v, { size:15, weight:600, fill:C_LINE });
    });
  });
  if (spec.result) body += txt(W / 2, h - 12, spec.result, { size:13.5, weight:600, fill:C_ALT });
  return svg(body, W, h);
};

FIG.fractionbar = spec => {
  const bars = spec.bars || [];
  if (!bars.length) throw new Error("no bars");
  const span = W - PAD * 2 - 74;
  let body = "", y = 28;
  bars.forEach(b => {
    const parts = Math.max(1, +b.parts || 1), shaded = Math.max(0, +b.shaded || 0);
    const rows = Math.max(1, Math.trunc(+b.rows) || 1);
    if (rows === 1){
      // Unchanged single-strip layout — every existing caller renders exactly as before.
      const pw = span / parts;
      for (let k = 0; k < parts; k++){
        body += `<rect x="${num(PAD + k*pw)}" y="${y}" width="${num(pw)}" height="46"
          fill="${k < shaded ? C_FILL : "#fff"}" fill-opacity="${k < shaded ? 0.3 : 1}"
          stroke="${C_LINE}" stroke-width="1.6"/>`;
      }
      if (b.label) body += txt(W - PAD - 4, y + 29, b.label, { size:14, weight:600, anchor:"start", fill:C_LINE });
      y += 74;
    } else {
      // A genuine rows x cols grid (e.g. 4 rows for "four horizontal strips", or
      // 2x2 for "a square cut into quarters") — fixed square cells rather than
      // stretched full-width, so it actually reads as the shape being described.
      const cols = Math.max(1, Math.trunc(+b.cols) || Math.ceil(parts / rows));
      const cell = 62;
      for (let r = 0; r < rows; r++){
        for (let c = 0; c < cols; c++){
          const idx = r * cols + c;
          if (idx >= parts) continue;
          body += `<rect x="${num(PAD + c * cell)}" y="${num(y + r * cell)}" width="${cell}" height="${cell}"
            fill="${idx < shaded ? C_FILL : "#fff"}" fill-opacity="${idx < shaded ? 0.3 : 1}"
            stroke="${C_LINE}" stroke-width="1.6"/>`;
        }
      }
      const gridH = rows * cell;
      if (b.label) body += txt(PAD + cols * cell + 30, y + gridH / 2 + 5, b.label, { size:14, weight:600, anchor:"start", fill:C_LINE });
      y += gridH + 28;
    }
  });
  return svg(body, W, y + 12);
};

FIG.piefraction = spec => {
  const pies = spec.pies || [];
  if (!pies.length) throw new Error("no pies");
  const r = 56, gap = 160, cy = 74;
  // angleDeg 0 is straight up, increasing clockwise — matches how a pie
  // chart or a sliced pizza is normally drawn and read.
  const polar = (cx, angleDeg) => {
    const a = (angleDeg - 90) * Math.PI / 180;
    return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
  };
  let body = "";
  pies.forEach((p, i) => {
    const parts = Math.max(1, Math.trunc(+p.parts) || 1);
    const shaded = Math.max(0, Math.min(parts, Math.trunc(+p.shaded) || 0));
    const cx = 80 + i * gap, step = 360 / parts;
    for (let k = 0; k < shaded; k++){
      const a0 = k * step, a1 = (k + 1) * step;
      const p0 = polar(cx, a0), p1 = polar(cx, a1);
      const largeArc = a1 - a0 > 180 ? 1 : 0;
      body += `<path d="M ${num(cx)} ${num(cy)} L ${num(p0.x)} ${num(p0.y)}
        A ${r} ${r} 0 ${largeArc} 1 ${num(p1.x)} ${num(p1.y)} Z" fill="${C_FILL}" fill-opacity="0.3"/>`;
    }
    body += `<circle cx="${num(cx)}" cy="${num(cy)}" r="${r}" fill="none" stroke="${C_LINE}" stroke-width="2.2"/>`;
    for (let k = 0; k < parts; k++){
      const pt = polar(cx, k * step);
      body += `<line x1="${num(cx)}" y1="${num(cy)}" x2="${num(pt.x)}" y2="${num(pt.y)}" stroke="${C_LINE}" stroke-width="1.8"/>`;
    }
    if (p.label) body += txt(cx, cy + r + 26, p.label, { size:14, weight:600, fill:C_LINE });
  });
  // Learned the hard way on three earlier figures: the svg stretches to fill
  // the full width of the figure box regardless of its own viewBox, so a
  // narrow canvas renders far larger than intended once stretched — keep a
  // generous floor here too rather than waiting to hit the same bug again.
  const w = Math.max(320, 80 + (pies.length - 1) * gap + r + 40);
  return svg(body, w, 190);
};

FIG.equivfrac = spec => {
  const a = spec.from || {}, b = spec.to || {};
  const vals = [a.num, a.den, b.num, b.den];
  if (vals.some(v => v === undefined || v === null || isNaN(+v))) throw new Error("from/to need num and den");
  const op = String(spec.op || "");
  // The numerator/bar/denominator gap was only 22px against 22px-tall digits —
  // tight enough that the bar (and the arrow curves anchored just past it)
  // crowded straight into the top of the denominator glyphs. Widened well
  // clear rather than trimming a few pixels at a time against an unknown margin.
  const yNum = 64, yBar = 106, yDen = 148, barHalf = 22, x1 = 140, x2 = 340;
  let body = `<defs><marker id="eqar" viewBox="0 0 10 10" refX="8" refY="5"
    markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="${C_ALT}"/></marker></defs>`;
  body += txt(x1, yNum, String(a.num), { size:22, weight:600, fill:C_INK });
  body += `<line x1="${x1-barHalf}" y1="${yBar}" x2="${x1+barHalf}" y2="${yBar}" stroke="${C_INK}" stroke-width="2"/>`;
  body += txt(x1, yDen, String(a.den), { size:22, weight:600, fill:C_INK });
  body += txt((x1 + x2) / 2, yBar + 3, "=", { size:22, weight:600, fill:C_AXIS });
  body += txt(x2, yNum, String(b.num), { size:22, weight:600, fill:C_INK });
  body += `<line x1="${x2-barHalf}" y1="${yBar}" x2="${x2+barHalf}" y2="${yBar}" stroke="${C_INK}" stroke-width="2"/>`;
  body += txt(x2, yDen, String(b.den), { size:22, weight:600, fill:C_INK });
  const topPeak = yNum - 34, botPeak = yDen + 34;
  body += `<path d="M${x1} ${yNum-20} Q ${(x1+x2)/2} ${topPeak} ${x2-4} ${yNum-20}"
    fill="none" stroke="${C_ALT}" stroke-width="2" marker-end="url(#eqar)"/>`;
  body += `<path d="M${x1} ${yDen+20} Q ${(x1+x2)/2} ${botPeak} ${x2-4} ${yDen+20}"
    fill="none" stroke="${C_ALT}" stroke-width="2" marker-end="url(#eqar)"/>`;
  if (op){
    body += txt((x1 + x2) / 2, topPeak - 6, op, { size:13, weight:600, fill:C_ALT });
    body += txt((x1 + x2) / 2, botPeak + 18, op, { size:13, weight:600, fill:C_ALT });
  }
  return svg(body, 460, 240);
};

function digitAt(n, p){ return Math.floor(Math.abs(n) / Math.pow(10, p)) % 10; }
function numDigits(n){ return String(Math.trunc(Math.abs(n))).length; }

// Column addition/subtraction/multiplication, digit-column-aligned the way a
// student writes it by hand — place 0 is the units column, increasing places
// go left, so every row (addends, partial products, the answer) lines up by
// real place value regardless of how many digits it has.
FIG.columnalgorithm = spec => {
  const op = String(spec.op || "add").toLowerCase();
  const a = Math.trunc(+spec.a), b = Math.trunc(+spec.b);
  if (!isFinite(a) || !isFinite(b) || a < 0 || b < 0){
    throw new Error("whole, non-negative a and b are needed");
  }
  if (op === "subtract" && a < b) throw new Error("a must be >= b for column subtraction");
  const setup = !!spec.setup;

  const colW = 32, rightX = 460, w = 560;
  const colX = p => rightX - p * colW;
  let body = "", h;

  if (op === "add"){
    const n = Math.max(numDigits(a), numDigits(b));
    const sumDigits = [], carryOut = [];
    let carry = 0;
    for (let p = 0; p < n; p++){
      const total = digitAt(a, p) + digitAt(b, p) + carry;
      sumDigits[p] = total % 10;
      carry = Math.floor(total / 10);
      carryOut[p] = carry;
    }
    if (carry > 0) sumDigits[n] = carry;
    const total = sumDigits.length;
    const margin = colX(total) - 10;
    const yCarry = 34, yA = 64, yB = 98, yRule = 112, ySum = 142;

    if (!setup){
      for (let p = 0; p < n; p++){
        if (carryOut[p] > 0) body += txt(colX(p + 1), yCarry, String(carryOut[p]), { size:13, weight:700, fill:C_ALT });
      }
    }
    for (let p = 0; p < numDigits(a); p++) body += txt(colX(p), yA, String(digitAt(a, p)), { size:22, weight:600, fill:C_INK });
    for (let p = 0; p < numDigits(b); p++) body += txt(colX(p), yB, String(digitAt(b, p)), { size:22, weight:600, fill:C_INK });
    body += txt(margin, yB, "+", { size:20, weight:700, fill:C_LINE });
    body += `<line x1="${num(margin - 6)}" y1="${yRule}" x2="${num(rightX + colW / 2)}" y2="${yRule}"
      stroke="${C_INK}" stroke-width="2"/>`;
    if (setup){
      h = yRule + 30;
    } else {
      for (let p = 0; p < total; p++) body += txt(colX(p), ySum, String(sumDigits[p]), { size:22, weight:700, fill:C_LINE });
      h = ySum + 30;
    }

  } else if (op === "subtract"){
    const n = Math.max(numDigits(a), numDigits(b));
    const diffDigits = [], borrowInto = [], lentAway = [], avail = [];
    let owed = 0;
    for (let p = 0; p < n; p++){
      const da = digitAt(a, p), db = digitAt(b, p);
      let av = da - owed, needsBorrow = false;
      if (av < db){ av += 10; needsBorrow = true; }
      avail[p] = av;
      diffDigits[p] = av - db;
      lentAway[p] = owed === 1;
      borrowInto[p] = needsBorrow;
      owed = needsBorrow ? 1 : 0;
    }
    const margin = colX(n) - 10;
    const yCarry = 34, yA = 64, yB = 98, yRule = 112, yDiff = 142;

    if (!setup){
      for (let p = 0; p < n; p++){
        if (borrowInto[p]) body += txt(colX(p) - colW * 0.32, yCarry, "1", { size:12, weight:700, fill:C_ALT });
      }
    }
    for (let p = 0; p < numDigits(a); p++){
      const x = colX(p);
      if (!setup && lentAway[p]){
        body += `<line x1="${num(x - 10)}" y1="${num(yA - 7)}" x2="${num(x + 10)}" y2="${num(yA - 7)}"
          stroke="${C_ALT}" stroke-width="1.6"/>`;
        body += txt(x, yA, String(digitAt(a, p)), { size:22, weight:600, fill:C_AXIS });
        body += txt(x + 12, yA - 16, String(avail[p]), { size:12, weight:700, fill:C_ALT });
      } else {
        body += txt(x, yA, String(digitAt(a, p)), { size:22, weight:600, fill:C_INK });
      }
    }
    for (let p = 0; p < numDigits(b); p++) body += txt(colX(p), yB, String(digitAt(b, p)), { size:22, weight:600, fill:C_INK });
    body += txt(margin, yB, "-", { size:20, weight:700, fill:C_LINE });
    body += `<line x1="${num(margin - 6)}" y1="${yRule}" x2="${num(rightX + colW / 2)}" y2="${yRule}"
      stroke="${C_INK}" stroke-width="2"/>`;
    if (setup){
      h = yRule + 30;
    } else {
      for (let p = 0; p < n; p++) body += txt(colX(p), yDiff, String(diffDigits[p]), { size:22, weight:700, fill:C_LINE });
      h = yDiff + 30;
    }

  } else if (op === "multiply"){
    const nb = numDigits(b), rowH = 34;
    if (nb === 1){
      const n = numDigits(a);
      const prodDigits = [], carryOut = [];
      let carry = 0;
      for (let p = 0; p < n; p++){
        const total = digitAt(a, p) * b + carry;
        prodDigits[p] = total % 10;
        carry = Math.floor(total / 10);
        carryOut[p] = carry;
      }
      let p2 = n;
      while (carry > 0){ prodDigits[p2] = carry % 10; carry = Math.floor(carry / 10); p2++; }
      const total = prodDigits.length;
      const margin = colX(total) - 10;
      const yCarry = 34, yA = 64, yB = 98, yRule = 112, yProd = 142;

      if (!setup){
        for (let p = 0; p < n; p++){
          if (carryOut[p] > 0) body += txt(colX(p + 1), yCarry, String(carryOut[p]), { size:13, weight:700, fill:C_ALT });
        }
      }
      for (let p = 0; p < n; p++) body += txt(colX(p), yA, String(digitAt(a, p)), { size:22, weight:600, fill:C_INK });
      body += txt(colX(0), yB, String(b), { size:22, weight:600, fill:C_INK });
      body += txt(margin, yB, "\\times", { size:20, weight:700, fill:C_LINE });
      body += `<line x1="${num(margin - 6)}" y1="${yRule}" x2="${num(rightX + colW / 2)}" y2="${yRule}"
        stroke="${C_INK}" stroke-width="2"/>`;
      if (setup){
        h = yRule + 30;
      } else {
        for (let p = 0; p < total; p++) body += txt(colX(p), yProd, String(prodDigits[p]), { size:22, weight:700, fill:C_LINE });
        h = yProd + 30;
      }
    } else {
      const na = numDigits(a), sum = a * b, totalPlaces = numDigits(sum);
      const margin = colX(totalPlaces) - 10;
      const yA = 50, yB = yA + 34, yRuleTop = yB + 20;
      let y = yRuleTop + 24;
      const partialRows = [];
      for (let k = 0; k < nb; k++){
        partialRows.push({ k, partial: a * digitAt(b, k), y });
        y += rowH;
      }
      const yRuleBottom = y + 10, ySum = yRuleBottom + 30;

      for (let p = 0; p < na; p++) body += txt(colX(p), yA, String(digitAt(a, p)), { size:22, weight:600, fill:C_INK });
      for (let p = 0; p < nb; p++) body += txt(colX(p), yB, String(digitAt(b, p)), { size:22, weight:600, fill:C_INK });
      body += txt(margin, yB, "\\times", { size:20, weight:700, fill:C_LINE });
      body += `<line x1="${num(margin - 6)}" y1="${num(yRuleTop)}" x2="${num(rightX + colW / 2)}" y2="${num(yRuleTop)}"
        stroke="${C_INK}" stroke-width="2"/>`;

      if (setup){
        h = yRuleTop + 30;
      } else {
        partialRows.forEach(row => {
          const pn = numDigits(row.partial);
          for (let q = 0; q < pn; q++){
            body += txt(colX(q + row.k), row.y, String(digitAt(row.partial, q)), { size:22, weight:600, fill:C_INK });
          }
          for (let s = 0; s < row.k; s++) body += txt(colX(s), row.y, "0", { size:22, weight:600, fill:C_AXIS });
        });

        body += `<line x1="${num(margin - 6)}" y1="${num(yRuleBottom)}" x2="${num(rightX + colW / 2)}" y2="${num(yRuleBottom)}"
          stroke="${C_INK}" stroke-width="2"/>`;
        for (let p = 0; p < totalPlaces; p++){
          body += txt(colX(p), ySum, String(digitAt(sum, p)), { size:22, weight:700, fill:C_LINE });
        }
        h = ySum + 30;
      }
    }
  } else {
    throw new Error("unknown column algorithm op");
  }

  return svg(body, w, Math.max(160, h));
};

// Works out the short-division bracket digit by digit. Leading zero quotient
// digits are suppressed, the way a student would leave that column blank
// (a wholly-zero quotient still shows a single "0"). A carry is only drawn
// where the step that produced it was itself a visible, non-suppressed
// quotient digit — nothing is "brought down" from a leading-zero step nobody
// wrote, even though it mathematically did leave a remainder: e.g. 195/7
// carries only the "5" before the final digit, not also a "1" before the
// "9" — the leading "1" alone never got a quotient digit of its own.
function shortDivisionSteps(dividend, divisor){
  const digits = String(Math.trunc(Math.abs(dividend))).split("").map(Number);
  let carry = 0;
  const quotientDigits = [], remainders = [];
  digits.forEach(d => {
    const combined = carry * 10 + d;
    quotientDigits.push(Math.floor(combined / divisor));
    carry = combined % divisor;
    remainders.push(carry);
  });
  let started = false;
  const shownQuotient = quotientDigits.map(q => {
    if (q !== 0) started = true;
    return started ? q : null;
  });
  if (!started) shownQuotient[shownQuotient.length - 1] = 0;
  const carryIn = digits.map((_, i) =>
    (i > 0 && shownQuotient[i - 1] !== null && remainders[i - 1] > 0) ? remainders[i - 1] : null);
  return { digits, shownQuotient, carryIn, remainder: carry };
}

FIG.shortdivision = spec => {
  const divisor = Math.trunc(+spec.divisor), dividend = Math.trunc(+spec.dividend);
  if (!(divisor > 0) || !isFinite(dividend) || dividend < 0){
    throw new Error("a positive whole-number divisor and dividend are needed");
  }
  const setup = !!spec.setup;
  const { digits, shownQuotient, carryIn } = shortDivisionSteps(dividend, divisor);
  // Sized off FIG_TEXT (matches surrounding LaTeX/body text once the SVG
  // stretches to fill its container) rather than a hand-picked pixel value —
  // widening the viewBox to match other figures' W fixed the relative
  // mismatch against them, but this content is sparse enough that only
  // deriving the actual font size from FIG_TEXT gets it genuinely right.
  const fs = FIG_TEXT, colW = fs * 1.75, x0 = fs * 7;
  // A blank setup has nothing written above the bracket, so it doesn't need
  // the quotient row's headroom — vinculumY sits near the top of its own
  // canvas instead of leaving that space empty above a shorter figure.
  const vinculumY = setup ? (spec.label ? fs * 3.2 : fs * 1.8) : fs * 4.8, quotientY = fs * 3.5;
  const dividendY = vinculumY + fs * 1.7;
  const bracketX = x0 - colW / 2 - fs * 0.75, rightEdge = x0 + (digits.length - 1) * colW + colW / 2 + fs * 0.75;
  const topY = vinculumY - fs * 0.3, bottomY = dividendY + fs * 0.85;
  const w = Math.max(W, rightEdge + 50), h = bottomY + fs * 1.7;

  let body = `<path d="M ${num(bracketX)} ${num(bottomY)} L ${num(bracketX)} ${num(topY)} L ${num(rightEdge)} ${num(topY)}"
    fill="none" stroke="${C_LINE}" stroke-width="1.3"/>`;
  body += txt(bracketX - fs * 1.3, dividendY, String(divisor), { size:fs, weight:600, fill:C_LINE });
  digits.forEach((d, i) => {
    const x = x0 + i * colW;
    body += txt(x, dividendY, String(d), { size:fs, weight:600, fill:C_INK });
    if (setup) return;
    if (carryIn[i]) body += txt(x - colW * 0.34, dividendY - fs * 0.85, String(carryIn[i]),
      { size:fs * 0.65, weight:600, fill:C_ALT });
    if (shownQuotient[i] !== null) body += txt(x, quotientY, String(shownQuotient[i]), { size:fs, weight:600, fill:C_LINE });
  });
  if (spec.label) body += txt(w / 2, fs * 1.3, spec.label, { size:fs * 0.85, weight:600 });
  return svg(body, w, h);
};

// The model chooses which factor pair to split at each step — there's no
// single correct tree the way there's one correct short division — so this
// only checks the structure is well-formed (a number, and either no
// children or exactly two) and lays out whatever tree it's given, the same
// trust-the-model contract as FIG.tree and FIG.backtrack.
FIG.factortree = spec => {
  (function validate(node){
    if (node.n === undefined || node.n === null || isNaN(+node.n)) throw new Error("every node needs a number");
    if (node.children){
      if (node.children.length !== 2) throw new Error("a factor tree splits into exactly two factors at a time");
      node.children.forEach(validate);
    }
  })(spec);

  const colW = 48, rowH = 50;
  let leafCount = 0;
  (function layout(node, depth){
    if (!node.children){
      node._x = leafCount * colW;
      leafCount++;
    } else {
      layout(node.children[0], depth + 1);
      layout(node.children[1], depth + 1);
      node._x = (node.children[0]._x + node.children[1]._x) / 2;
    }
    node._y = depth * rowH;
  })(spec, 0);

  // The svg stretches to fill the full width of the figure box regardless of
  // its own viewBox, so — as with the short-division figure — a canvas sized
  // to just fit a small tree renders its digits far larger than intended
  // once stretched. A wide fixed minimum keeps the same nominal font size
  // looking normal; centring keeps a small tree from sitting squashed to
  // one side of all that extra width.
  const pad = 30, gap = 12;
  const contentWidth = (leafCount - 1) * colW;
  const w = Math.max(340, contentWidth + pad * 2);
  const xOff = pad + (w - pad * 2 - contentWidth) / 2;
  let body = "";
  (function draw(node){
    body += txt(node._x + xOff, node._y + pad, String(node.n), { size:15, weight:600, fill:C_INK });
    if (node.children){
      node.children.forEach(c => {
        body += `<line x1="${num(node._x + xOff)}" y1="${num(node._y + pad + gap)}"
          x2="${num(c._x + xOff)}" y2="${num(c._y + pad - gap)}" stroke="${C_AXIS}" stroke-width="1.6"/>`;
      });
      node.children.forEach(draw);
    }
  })(spec);

  const maxDepth = (function depth(node){ return node.children ? 1 + Math.max(...node.children.map(depth)) : 0; })(spec);
  if (spec.label) body += txt(w / 2, 16, spec.label, { size:12, weight:600 });
  return svg(body, w, Math.max(140, maxDepth * rowH + pad * 2));
};

FIG.stickpattern = spec => {
  const shape = String(spec.shape || "triangle").toLowerCase();
  const count = Math.max(1, Math.trunc(+spec.count) || 1);
  const shared = !!spec.shared;
  // The svg stretches to fill the full width of the figure box regardless of
  // its own viewBox, so — the same lesson as the short-division and factor-
  // tree figures — a canvas sized to just fit the pattern renders far larger
  // than intended once stretched. left keeps the very first stick's rounded
  // cap from sitting on the viewBox edge and getting clipped there too.
  const s = 44, top = 30, left = 30;
  const dots = [];
  let body = "";
  const stick = (x1, y1, x2, y2) => {
    body += `<line x1="${num(x1)}" y1="${num(y1)}" x2="${num(x2)}" y2="${num(y2)}"
      stroke="${C_ALT}" stroke-width="3" stroke-linecap="round"/>`;
  };
  const dot = (x, y) => dots.push([x, y]);
  let contentWidth, h;

  if (shape === "square"){
    // A shared square only needs the vertical it doesn't already have from its
    // neighbour, drawn a second time on the same line — invisible, and exact.
    const gapPx = shared ? 0 : 16, yTop = top, yBot = top + s;
    for (let i = 0; i < count; i++){
      const x0 = left + i * (s + gapPx), x1 = x0 + s;
      stick(x0, yTop, x1, yTop); stick(x0, yBot, x1, yBot);
      stick(x0, yTop, x0, yBot); stick(x1, yTop, x1, yBot);
      [[x0, yTop], [x1, yTop], [x0, yBot], [x1, yBot]].forEach(p => dot(...p));
    }
    contentWidth = count * s + (count - 1) * gapPx; h = yBot + 30;
  } else if (shared){
    // An alternating zigzag strip: N+2 points give N triangles, each sharing
    // one slanted side with the last — the classic "2 new sticks per shape"
    // pattern. The N "skip one" connectors below close each triangle's base.
    const half = s / 2, yTop = top, yBot = top + s * 0.87;
    const pts = [];
    for (let i = 0; i <= count + 1; i++) pts.push({ x: left + i * half, y: i % 2 === 0 ? yBot : yTop });
    for (let i = 0; i < pts.length - 1; i++) stick(pts[i].x, pts[i].y, pts[i + 1].x, pts[i + 1].y);
    for (let i = 0; i < pts.length - 2; i++) stick(pts[i].x, pts[i].y, pts[i + 2].x, pts[i + 2].y);
    pts.forEach(p => dot(p.x, p.y));
    contentWidth = pts[pts.length - 1].x - left; h = yBot + 30;
  } else {
    // Every triangle is fully independent (three sticks of its own) whether
    // there's a gap or not — spec.touching only closes that gap to zero, so
    // neighbouring corners land on the same point without any stick actually
    // being reused. At a touching corner two collinear "through" sticks (the
    // top edges either side) read as one straight line, alongside the two
    // slants meeting there — three visible directions, no shared edge.
    const gapPx = spec.touching ? 0 : 16, yTop = top, yBot = top + s * 0.87;
    for (let i = 0; i < count; i++){
      const x0 = left + i * (s + gapPx), x1 = x0 + s, xa = x0 + s / 2;
      stick(x0, yTop, x1, yTop); stick(x0, yTop, xa, yBot); stick(x1, yTop, xa, yBot);
      [[x0, yTop], [x1, yTop], [xa, yBot]].forEach(p => dot(...p));
    }
    contentWidth = count * s + (count - 1) * gapPx; h = yBot + 30;
  }

  const w = Math.max(340, contentWidth + left * 2);
  dots.forEach(([x, y]) => { body += `<circle cx="${num(x)}" cy="${num(y)}" r="3.2" fill="${C_INK}"/>`; });
  if (spec.label) body += txt(w / 2, 16, spec.label, { size:12, weight:600 });
  return svg(body, w, Math.max(120, h));
};

// Blends a hex colour toward white by `ratio` (0 = unchanged, 1 = white).
// Used for isocubes' three face shades: they must be fully opaque, not
// fill-opacity overlays, because isometric projection can make a shorter
// column's face and a taller neighbour's face share a screen-space corner —
// draw order alone covers that correctly, but a semi-transparent fill would
// still show a visibly blended patch exactly at the overlap.
function blendWithWhite(hex, ratio){
  const n = parseInt(hex.slice(1), 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  const mix = c => Math.round(c + (255 - c) * ratio);
  return "#" + [mix(r), mix(g), mix(b)].map(c => c.toString(16).padStart(2, "0")).join("");
}

function solidDimLabel(value, unit, fallback){
  if (value === undefined || value === null || value === "") return fallback;
  return num(+value) + (unit ? " " + unit : "");
}

// Oblique (cavalier-style) projection shared by every polyhedron in FIG.solid:
// x is true horizontal, y true vertical, z the "into the page" depth drawn as
// a shorter offset up and to the right so the shape still reads as 3-D.
function obliqueProject(x, y, z){
  const ang = Math.PI / 6, ds = 0.5;
  return { px: x + z * ds * Math.cos(ang), py: -(y + z * ds * Math.sin(ang)) };
}

// A circle-viewed-edge-on ellipse, drawn with its far half dashed and its
// near half solid, for a cylinder/cone base. Clipping two copies of a native
// <ellipse> at y=cy is more robust than hand-splitting the curve into two
// arc paths: dasharray spacing on an arc bunches up unevenly near the sharp
// curvature at its own tangent points (rx >> ry here), which read as a
// small hooked kink right where the slant sides meet the base — clipping a
// whole ellipse sidesteps that because the dash pattern is computed around
// the complete, evenly-parametrised shape, not a hand-picked sub-arc.
function halfDashedEllipse(cx, cy, rx, ry){
  const id = "ell" + Math.random().toString(36).slice(2, 9);
  return `<clipPath id="${id}b"><rect x="${num(cx - rx - 4)}" y="${num(cy - ry - 4)}"
      width="${num(2 * rx + 8)}" height="${num(ry + 4)}"/></clipPath>
    <clipPath id="${id}f"><rect x="${num(cx - rx - 4)}" y="${num(cy)}"
      width="${num(2 * rx + 8)}" height="${num(ry + 4)}"/></clipPath>
    <ellipse cx="${num(cx)}" cy="${num(cy)}" rx="${num(rx)}" ry="${num(ry)}" fill="none" stroke="${C_LINE}"
      stroke-width="1.6" stroke-dasharray="4 4" clip-path="url(#${id}b)"/>
