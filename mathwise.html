    try { spec = JSON.parse(m[1].trim()); } catch (e){ spec = null; }
    parts.push({ kind:"figure", value:spec });
    last = re.lastIndex;
  }
  if (last < text.length){
    const tail = text.slice(last);
    // An opening fence with nothing closing it means the reply was cut off
    // mid-diagram. Drop the half-written JSON rather than printing it.
    const open = tail.search(/```\s*figure/);
    if (open !== -1){
      if (open > 0) parts.push({ kind:"text", value:tail.slice(0, open) });
      parts.push({ kind:"figure", value:null, cut:true });
    } else {
      parts.push({ kind:"text", value:tail.replace(/```\w*\s*$/, "") });
    }
  }
  return parts;
}

// Deliberately minimal. Anything more starts eating LaTeX backslashes.
function markup(text){
  return splitFigures(String(text)).map(part => {
    if (part.kind === "figure"){
      if (part.value) return renderFigure(part.value);
      return `<div class="figure"><p class="broken">${part.cut
        ? "The answer ran out of room before this diagram finished. Ask for the diagram on its own and it will come through."
        : "A diagram was sent but could not be read."}</p></div>`;
    }
    const lines = esc(fixMathRuns(part.value)).split("\n");
    let html = "", inList = false;
    for (let idx = 0; idx < lines.length; idx++){
      const line = lines[idx];
      const t = line.trim();

      // A pipe table: header row, a dashed separator, then the body.
      if (isTableRow(t) && isTableRule(lines[idx + 1] || "")){
        if (inList){ html += "</ul>"; inList = false; }
        const rows = [];
        let k = idx;
        rows.push(splitRow(lines[k].trim()));
        k += 2;
        while (k < lines.length && isTableRow(lines[k].trim())){
          rows.push(splitRow(lines[k].trim()));
          k++;
        }
        html += tableHtml(rows);
        idx = k - 1;
        continue;
      }

      if (/^[-*]\s+/.test(t)){
        if (inList === "ol"){ html += "</ol>"; inList = false; }
        if (!inList){ html += "<ul>"; inList = "ul"; }
        html += "<li>" + bold(t.replace(/^[-*]\s+/, "")) + "</li>";
        continue;
      }
      if (/^\d+[.)]\s+/.test(t)){
        if (inList === "ul"){ html += "</ul>"; inList = false; }
        if (!inList){ html += "<ol>"; inList = "ol"; }
        html += "<li>" + bold(t.replace(/^\d+[.)]\s+/, "")) + "</li>";
        continue;
      }
      if (inList){ html += inList === "ol" ? "</ol>" : "</ul>"; inList = false; }
      if (!t) continue;
      if (/^(-{3,}|\*{3,}|_{3,})$/.test(t)){ html += '<hr class="rule">'; continue; }
      const head = t.match(/^(#{1,6})\s+(.*)$/);
      if (head){
        const level = Math.min(4, head[1].length + 2);
        html += `<h${level} class="ans-h">` + bold(head[2].replace(/#+\s*$/, "")) + `</h${level}>`;
        continue;
      }
      if (/^\*\*(.+)\*\*$/.test(t)){ html += "<h4>" + t.replace(/\*\*/g, "") + "</h4>"; continue; }
      if (/^(Hint|Answer|Method|Check|Working):?$/i.test(t)){
        html += '<div class="lead">' + t.replace(/:$/, "") + "</div>"; continue;
      }
      // Display maths must not sit inside a <p>: KaTeX puts a block element
      // there and the browser splits the paragraph around it.
      if (/^\$\$[\s\S]*\$\$$/.test(t)){ html += "<div>" + t + "</div>"; continue; }
      html += "<p>" + bold(t) + "</p>";
    }
    if (inList) html += inList === "ol" ? "</ol>" : "</ul>";
    return html;
  }).join("");
}

function typesetIn(el, errorColour){
  if (!el) return;
  // renderMathInElement's own traversal explicitly ignores <svg> subtrees
  // (see ignoredTags below), so $...$ text placed inside a figure's
  // foreignObject — see mathLabel() — is never reached by the call below.
  // Render those directly instead: each is marked with its exact source in
  // data-latex, so there's no delimiter-scanning involved for these at all.
  if (window.katex && katex.render){
    el.querySelectorAll(".mw-mathlabel").forEach(node => {
      try { katex.render(node.dataset.latex || "", node, { throwOnError:false, strict:false }); }
      catch (e){}
    });
  }
  if (!window.renderMathInElement) return;
  try {
    renderMathInElement(el, {
      errorColor: errorColour || "#8C2F39",
      delimiters: [
        { left:"$$", right:"$$", display:true },
        { left:"\\[", right:"\\]", display:true },
        { left:"$", right:"$", display:false },
        { left:"\\(", right:"\\)", display:false }
      ],
      ignoredTags: ["script","noscript","style","textarea","pre","option","svg"],
      throwOnError: false,
      strict: false
    });
  } catch (e){}
}

/* --- Speech ---------------------------------------------------------- *
 * The browser speaks. Anthropic's API returns text, so the spoken summary
 * is written by the model and voiced by the device: free, instant and
 * offline, at the cost of using whatever voice the machine has.
 * ------------------------------------------------------------------ */

const SPEECH_OK = "speechSynthesis" in window;
let keepAlive = null;

function loadVoices(){
  if (!SPEECH_OK) return;
  const all = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
  if (!all.length) return;
  const rank = v => (/en[-_]AU/i.test(v.lang) ? 0 : /en[-_](GB|NZ)/i.test(v.lang) ? 1 : 2);
  all.sort((a, b) => rank(a) - rank(b) || a.name.localeCompare(b.name));
  S.voices = all;
  if (!S.voiceURI || !all.some(v => v.voiceURI === S.voiceURI)) S.voiceURI = all[0].voiceURI;
}
if (SPEECH_OK){
  loadVoices();
  speechSynthesis.onvoiceschanged = () => { loadVoices(); if (S.screen === "app") render(); };
}

function stopSpeech(){
  if (!SPEECH_OK) return;
  clearInterval(keepAlive); keepAlive = null;
  speechSynthesis.cancel();
  S.speaking = false; S.paused = false;
}

function speak(text){
  if (!SPEECH_OK) return;
  stopSpeech();
  const parts = (text.match(/[^.!?]+[.!?]*/g) || [text]).map(p => p.trim()).filter(Boolean);
  const voice = S.voices.find(v => v.voiceURI === S.voiceURI) || null;
  parts.forEach((part, i) => {
    const u = new SpeechSynthesisUtterance(part);
    if (voice){ u.voice = voice; u.lang = voice.lang; }
    u.rate = 0.95;
    if (i === parts.length - 1){
      u.onend = () => { stopSpeech(); if (S.screen === "app") render(); };
      u.onerror = u.onend;
    }
    speechSynthesis.speak(u);
  });
  S.speaking = true; S.paused = false;
  // Chrome stops speaking after about fifteen seconds without this.
  keepAlive = setInterval(() => {
    if (!speechSynthesis.speaking) return;
    speechSynthesis.pause(); speechSynthesis.resume();
  }, 10000);
  render();
}

function togglePause(){
  if (!SPEECH_OK || !S.speaking) return;
  if (S.paused){ speechSynthesis.resume(); S.paused = false; }
  else { speechSynthesis.pause(); S.paused = true; }
  render();
}

function lastAnswer(){
  for (let i = S.messages.length - 1; i >= 0; i--)
    if (S.messages[i].role === "assistant") return S.messages[i];
  return null;
}

async function readAloud(){
  const msg = lastAnswer();
  if (!msg || S.speechBusy) return;
  if (msg.spoken){ speak(msg.spoken); return; }
  const isSolution = /^##\s*full solution/i.test(msg.content.trim());
  S.speechBusy = true; S.speechError = ""; render();
  try {
    const script = await callClaude(
      (isSolution ? SPOKEN_SYSTEM : SPOKEN_SYSTEM_HINT) + "\n\n" + courseContext(S.courseKey),
      [{ role:"user", content:"Say this out loud to the student:\n\n" + msg.content }], 700, "speech");
    msg.spoken = script.replace(/[*_#`$\\]/g, "").replace(/\s+/g, " ").trim();
    S.speechBusy = false;
    speak(msg.spoken);
  } catch (err){
    S.speechError = err.message; S.speechBusy = false; render();
  }
}

// VCE, IB Diploma and MYP Year 10 courses use a TI-Nspire CX II CAS (course.cas
// is true for these); IB locks CAS off (Press-to-Test) while VCE and Year 10
// assume it's available — same physical button-press knowledge either way,
// different set of moves are legal, so CALCULATOR_SYSTEM is paired with a
// band-specific CAS note. MYP Years 7-9 (course.cas is falsy) use a TI-30XB
// MultiView scientific calculator instead — a different device entirely, so
// it gets its own SCIENTIFIC_CALCULATOR_SYSTEM prompt with no CAS note.
// "Show me on my calculator" always gives the complete calculator solution,
// independent of how far the Socratic hint dialogue has gotten — it's an
// explicit opt-out of the hint flow, not another hint. The full conversation
// so far is sent as context so the calculator method lines up with whichever
// part of the question is actually in play (e.g. part c of a multi-part
// question), even though the request is for the whole worked solution.
function firstQuestion(){
  const m = S.messages.find(mm => mm.role === "user" && mm.visible !== false);
  return m ? m.content : "";
}

function transcriptSoFar(){
  return S.messages.filter(m => m.visible !== false)
    .map(m => (m.role === "user" ? "Student: " : "MathWISE: ") + m.content)
    .join("\n\n");
}

async function showCalcSteps(){
  const msg = lastAnswer();
  if (!msg || S.calcBusy || msg.calcSteps) return;
  S.calcBusy = true; S.calcError = ""; render();
  try {
    const course = courseOf(S.courseKey);
    const system = course.cas
      ? [CALCULATOR_SYSTEM, course.band === "IB Diploma" ? CAS_OFF : CAS_ON, courseContext(S.courseKey)].join("\n\n")
      : [SCIENTIFIC_CALCULATOR_SYSTEM, courseContext(S.courseKey)].join("\n\n");
    const steps = await callClaude(system,
      [{ role:"user", content:"Question:\n\n" + firstQuestion()
        + "\n\nConversation so far:\n\n" + transcriptSoFar() }], 1200, "calculator");
    msg.calcSteps = steps;
  } catch (err){
    S.calcError = err.message;
  }
  S.calcBusy = false; render();
}

// A one-off summary of THIS conversation for the student's own study notes: how independently
// they worked through it, plus fresh practice questions targeting whatever they seemed least sure
// of. Feeds into the existing PDF/copy export automatically once set, since those already just
// serialise whatever is in S.messages/S.studySummary.
async function buildStudySummary(){
  if (S.studySummaryBusy || S.studySummary) return;
  S.studySummaryBusy = true; S.studySummaryError = ""; render();
  try {
    const system = [STUDY_SUMMARY_SYSTEM, courseContext(S.courseKey)].join("\n\n");
    S.studySummary = await callClaude(system,
      [{ role:"user", content:"Conversation:\n\n" + transcriptSoFar() }], 1200, "study-summary");
  } catch (err){
    S.studySummaryError = err.message;
  }
  S.studySummaryBusy = false; render();
}

// A small centred LaTeX label for the hero-art svg frames: katex.render() (called
// from typesetIn) replaces the placeholder text once it runs.
function heroMathLabel(cx, cy, w, h, latex, opts){
  const o = opts || {};
  return `<foreignObject x="${cx - w / 2}" y="${cy - h / 2}" width="${w}" height="${h}">
    <div xmlns="http://www.w3.org/1999/xhtml" class="mw-mathlabel" data-latex="${sx(latex)}"
      style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;
      white-space:nowrap;font-size:${o.size || 13}px;color:${o.color || "#8A8291"};">${sx(latex)}</div>
  </foreignObject>`;
}

function heroEquation(){

  // that inside our own <svg><foreignObject> loses the radical entirely in some

    <line x1="${cx}" y1="${cy}" x2="${num(px)}" y2="${num(py)}" stroke="${C_LINE}" stroke-width="2.2"/>
    <line x1="${num(px)}" y1="${num(py)}" x2="${num(px)}" y2="${cy}" stroke="${C_ALT}" stroke-width="1.4" stroke-dasharray="4 3"/>
    <line x1="${cx}" y1="${cy}" x2="${num(px)}" y2="${cy}" stroke="${C_ALT}" stroke-width="1.4" stroke-dasharray="4 3"/>
    <circle cx="${num(px)}" cy="${num(py)}" r="4.5" fill="${C_LINE}"/>`;
  body += txt(cx + 34, cy - 12, "\\theta", { size:13, fill:C_ALT });
  body += txt((cx + px) / 2, cy + 16, "\\cos\\theta", { size:11.5, fill:C_ALT });
  body += txt(px + 8, (cy + py) / 2, "\\sin\\theta", { size:11.5, fill:C_ALT, anchor:"start" });
  body += txt((cx + px) / 2 - 12, (cy + py) / 2 - 12, "1", { size:12, weight:600, fill:C_LINE });
  body += txt(px, py - 20, "(\\cos\\theta,\\ \\sin\\theta)", { size:11.5, fill:C_INK });
  return `<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${body}</svg>`;
}

function heroMeasurement(){
  const x0 = 70, y0 = 44, w = 180, h = 90;
  const dimY = y0 - 14, dimX = x0 - 16;
  let body = `
    <rect x="${x0}" y="${y0}" width="${w}" height="${h}" fill="${C_FILL}" fill-opacity="0.10" stroke="${C_LINE}" stroke-width="2"/>
    <line x1="${x0}" y1="${dimY}" x2="${x0 + w}" y2="${dimY}" stroke="${C_ALT}" stroke-width="1.3"/>
    <line x1="${x0}" y1="${dimY - 5}" x2="${x0}" y2="${dimY + 5}" stroke="${C_ALT}" stroke-width="1.3"/>
    <line x1="${x0 + w}" y1="${dimY - 5}" x2="${x0 + w}" y2="${dimY + 5}" stroke="${C_ALT}" stroke-width="1.3"/>
    <line x1="${dimX}" y1="${y0}" x2="${dimX}" y2="${y0 + h}" stroke="${C_ALT}" stroke-width="1.3"/>
    <line x1="${dimX - 5}" y1="${y0}" x2="${dimX + 5}" y2="${y0}" stroke="${C_ALT}" stroke-width="1.3"/>
    <line x1="${dimX - 5}" y1="${y0 + h}" x2="${dimX + 5}" y2="${y0 + h}" stroke="${C_ALT}" stroke-width="1.3"/>`;
  body += txt(x0 + w / 2, dimY - 8, "6\\text{ cm}", { size:12, fill:C_ALT });
  body += txt(dimX - 16, y0 + h / 2, "4\\text{ cm}", { size:12, fill:C_ALT });
  body += txt(x0 + w / 2, y0 + h + 32, "A = 6 \\times 4 = 24\\ \\text{cm}^2", { size:13, weight:600, fill:C_LINE });
  body += txt(x0 + w / 2, y0 + h + 54, "P = 2(6 + 4) = 20\\ \\text{cm}", { size:13, fill:C_AXIS });
  return `<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${body}</svg>`;
}

// A little tour of what MathWISE can draw, not just the one diagram that got us here.
const HERO_FRAMES = [() => HERO_LINE, heroParabola, heroEquation, heroHistogram, heroUnitCircle, heroMeasurement];
let heroTimer = null, heroIndex = 0;

function heroFrame(i){
  try { return HERO_FRAMES[i % HERO_FRAMES.length](); }
  catch (e){ return HERO_LINE; }
}

function startHeroRotation(){
  if (heroTimer) return;
  heroTimer = setInterval(() => {
    const el = document.querySelector(".hero-art");
    if (!el){ clearInterval(heroTimer); heroTimer = null; return; }
    heroIndex = (heroIndex + 1) % HERO_FRAMES.length;
    el.innerHTML = heroFrame(heroIndex);
    typesetIn(el);
  }, 20000);
}

async function submit(text, visible, shot, image, apiText){
  if (visible) maybeNudgeCourse();
  // A visible message is the student asking something; the invisible ones are
  // follow-ups like "explain that" within the question already open.
  if (visible && !AS) analyticsStart(text);
  analyticsTouch();
  stopSpeech();
  // apiText lets what's sent to Claude differ from what's shown in the
  // transcript — used to add "now give the full solution" onto a genuine
  // typed attempt without that instruction cluttering the student's own
  // words in the chat bubble and the PDF/copy export.
  S.messages.push({ role:"user", content:text, apiText, visible, shot, image });
  S.busy = true; S.error = ""; S.speechError = ""; S.showIntake = false;
  S.attemptPrompt = false; S.attemptError = "";
  render();

  const system = [HOUSE_RULES, courseContext(S.courseKey), FIGURE_SPEC, TABLE_SPEC,
                  ANSWER_SHAPE].join("\n\n");
  const payload = S.messages.map(m => {
    const t = m.apiText || m.content;
    return m.image
      ? { role:m.role, content:[
          { type:"image", source:{ type:"base64", media_type:m.image.mime, data:m.image.b64 } },
          { type:"text", text:t } ] }
      : { role:m.role, content:t };
  });
  // Cache everything up to and including this turn's newest message. The next
  // turn's payload starts with this exact prefix (plus this turn's reply and
  // the student's next message appended), so it comes back as a cache read
  // instead of reprocessing the whole growing conversation from scratch.
  if (payload.length){
    const last = payload[payload.length - 1];
    if (Array.isArray(last.content)){
      last.content[last.content.length - 1].cache_control = { type:"ephemeral" };
    } else {
      last.content = [{ type:"text", text:last.content, cache_control:{ type:"ephemeral" } }];
    }
  }
  try {
    const reply = await callClaude(system, payload, 4000, "tutoring");
    S.messages.push({ role:"assistant", content:reply });
    S.hintTurns += 1;
    const nowSolved = /^##\s*full solution/i.test(reply.trim());
    S.solved = S.solved || nowSolved;
    if (AS) AS.turns += 1;
    if (nowSolved) analyticsEnd("solved");
  } catch (err){
    S.error = err.message;
    S.messages.pop();
  }
  S.busy = false;
  render();
}

/* --- Question intake ------------------------------------------------- */

// Turns the (possibly student-edited) network from a photographed graph question into a short,
// explicit text block sent to Claude alongside the photo — telling it to trust these confirmed
// values instead of re-reading (and possibly re-misreading) the same numbers from the image.
function networkConfirmText(network){
  const vs = (network && network.vertices) || [];
  const es = (network && network.edges) || [];
  if (!vs.length) return "";
  const labelOf = id => {
    const v = vs.find(v => v.id === id);
    return v ? v.label : id;
  };
  const vertexList = vs.map(v => v.label).join(", ");
  const edgeList = es.map(e => {
    const a = labelOf(e.from), b = labelOf(e.to);
    const bits = [];
    if (e.weight !== undefined && e.weight !== null && e.weight !== "") bits.push(`weight ${e.weight}`);
    if (e.directed) bits.push("directed");
    return bits.length ? `${a}-${b} (${bits.join(", ")})` : `${a}-${b}`;
  }).join(", ");
  return `Confirmed network — use exactly this, not the diagram in the photo:\nVertices: ${vertexList}.\n`
    + (edgeList ? `Edges: ${edgeList}.` : "Edges: none.");
}

// A tiny disjoint-set (union-find) structure over vertex ids, used by Kruskal's algorithm to test
// "would adding this edge close a cycle?" in O(~1) per check.
function unionFind(vertexIds){
  const parent = {};
  vertexIds.forEach(id => { parent[id] = id; });
  const find = x => (parent[x] === x ? x : (parent[x] = find(parent[x])));
  const union = (a, b) => { const ra = find(a), rb = find(b); if (ra !== rb) parent[ra] = rb; };
  return { find, union };
}

// True only if every vertex can be reached from every other, treating every edge as undirected —
// Kruskal's/Prim's only make sense (and can only ever finish) on a connected graph.
function networkIsConnected(network){
  const vs = network.vertices || [];
  if (!vs.length) return false;
  const adj = {};
  vs.forEach(v => { adj[v.id] = []; });
  (network.edges || []).forEach(e => {
    if (adj[e.from] && adj[e.to]){ adj[e.from].push(e.to); adj[e.to].push(e.from); }
  });
  const seen = new Set([vs[0].id]);
  const stack = [vs[0].id];
  while (stack.length){
    const cur = stack.pop();
    (adj[cur] || []).forEach(n => { if (!seen.has(n)){ seen.add(n); stack.push(n); } });
  }
  return seen.size === vs.length;
}

// Kruskal's algorithm: at every step, the valid next edges are whichever unchosen, non-cycle-
// forming edges share the smallest weight (there is often more than one — a genuine tie).
function kruskalValidChoices(network, chosenIdx){
  const uf = unionFind(network.vertices.map(v => v.id));
  const chosenSet = new Set(chosenIdx);
  chosenIdx.forEach(i => { const e = network.edges[i]; uf.union(e.from, e.to); });
  const candidates = network.edges
    .map((e, i) => ({ i, e }))
    .filter(({ i, e }) => !chosenSet.has(i) && uf.find(e.from) !== uf.find(e.to));
  const valid = new Set();
  if (candidates.length){
    const minWeight = Math.min(...candidates.map(c => +c.e.weight));
    candidates.forEach(c => { if (+c.e.weight === minWeight) valid.add(c.i); });
  }
  const reasonFor = i => {
    if (chosenSet.has(i) || valid.has(i)) return null;
    const e = network.edges[i];
    if (uf.find(e.from) === uf.find(e.to)){
      return "That edge would create a cycle — its two vertices are already connected through edges you've already chosen.";
    }
    return "There's a cheaper edge available that doesn't create a cycle — look for the smallest weight you haven't used yet.";
  };
  return { valid, reasonFor };
}

// Prim's algorithm's own starting vertex: the textbooks' worked examples never ask the student to
// pick one, they just begin from one — default to the alphabetically-first vertex, unless the
// question's own wording names a specific starting vertex.
function primStartVertex(network, fullQuestion){
  const text = String(fullQuestion || "").toLowerCase();
  for (const v of network.vertices){
    const label = String(v.label).toLowerCase().replace(/[^a-z0-9]/g, "");
    if (!label) continue;
    const re = new RegExp(`start(?:ing)?\\s*(?:at|from)?\\s*(?:vertex\\s*)?${label}\\b`);
    if (re.test(text)) return v.id;
  }
  const sorted = [...network.vertices].sort((a, b) => String(a.label).localeCompare(String(b.label)));
  return sorted[0].id;
}

// Prim's algorithm: the valid next edges are whichever unchosen "frontier" edges (exactly one
// endpoint already in the growing tree) share the smallest weight.
function primValidChoices(network, chosenIdx, startVertexId){
  const inTree = new Set([startVertexId]);
  chosenIdx.forEach(i => { const e = network.edges[i]; inTree.add(e.from); inTree.add(e.to); });
  const chosenSet = new Set(chosenIdx);
  const candidates = network.edges
    .map((e, i) => ({ i, e }))
    .filter(({ i, e }) => !chosenSet.has(i) && inTree.has(e.from) !== inTree.has(e.to));
  const valid = new Set();
  if (candidates.length){
    const minWeight = Math.min(...candidates.map(c => +c.e.weight));
    candidates.forEach(c => { if (+c.e.weight === minWeight) valid.add(c.i); });
  }
  const reasonFor = i => {
    if (chosenSet.has(i) || valid.has(i)) return null;
    const e = network.edges[i];
    const aIn = inTree.has(e.from), bIn = inTree.has(e.to);
    if (!aIn && !bIn) return "That edge doesn't connect to your tree yet — pick one with at least one end already included.";
    if (aIn && bIn) return "Both ends of that edge are already in your tree — adding it would create a cycle.";
    return "There's a cheaper edge available that doesn't create a cycle — look for the smallest weight you haven't used yet.";
  };
  return { valid, reasonFor };
}

// Builds the plain-text summary appended to the chat transcript once the tree is complete.
function mstSummaryText(network, chosenIdx, autoIdx){
  const labelOf = id => { const v = network.vertices.find(v => v.id === id); return v ? v.label : id; };
  const parts = chosenIdx.map(i => {
    const e = network.edges[i];
    return `${labelOf(e.from)}-${labelOf(e.to)} (${e.weight})`;
  });
  const total = chosenIdx.reduce((sum, i) => sum + (+network.edges[i].weight || 0), 0);
  let text = parts.join(", ") + ` — total weight ${total}.`;
  if (autoIdx.length){
    const manual = chosenIdx.length - autoIdx.length;
    text += ` You worked out ${manual} of these ${chosenIdx.length} edges yourself; MathWISE filled in the rest.`;
  }
  return text;
}

// Whether a confirmed network is actually usable for the Kruskal's/Prim's exercise: needs at
// least 2 vertices, at least one edge, every edge weighted (the algorithms are meaningless
// without complete weights), no directed edges (MST algorithms are for undirected graphs), and the
// graph must actually be connected (or the exercise could never reach a complete spanning tree).
function mstExerciseUsable(net){
  if (!net || !Array.isArray(net.vertices) || net.vertices.length < 2) return false;
  if (!Array.isArray(net.edges) || !net.edges.length) return false;
  if (net.edges.some(e => e.directed)) return false;
  if (net.edges.some(e => e.weight === undefined || e.weight === null || e.weight === "")) return false;
  return networkIsConnected(net);
}

function mstValidChoices(){
  const st = S.mst;
  return st.algorithm === "kruskal"
    ? kruskalValidChoices(st.network, st.chosen)
    : primValidChoices(st.network, st.chosen, st.startVertex);
}

// A fixed, per-algorithm reminder of the decision rule itself — shown throughout the exercise so
// the student is taught the general process, not just told after the fact whether one click was
// right or wrong. Deliberately never names a specific edge (that's what "Hint" is for).
function mstStepGuidance(algorithm){
  return algorithm === "kruskal"
    ? "Look at every edge you haven't used yet. Pick the one with the smallest weight that would NOT create a cycle with the edges you've already chosen."
    : "Look at every edge connecting your tree to a vertex that isn't in it yet. Pick the one with the smallest weight.";
}

function mstCheckDone(){
  const st = S.mst;
  if (st.chosen.length !== st.network.vertices.length - 1) return;
  st.done = true;
  st.feedback = null;
  st.hinted = null;
}

// Called from the exercise's own "Continue" button once the tree is complete — this is what
// actually records the result into the chat transcript and hands back to normal chat, kept
// separate from mstCheckDone() so the completed diagram stays on screen until the student is
// ready to move on, instead of vanishing the instant the last edge is added.
function mstFinish(){
  const st = S.mst;
  const algoName = st.algorithm === "kruskal" ? "Kruskal's" : "Prim's";
  const summary = mstSummaryText(st.network, st.chosen, st.auto);
  S.messages.push({ role:"user", content: st.questionText, visible:true });
  S.messages.push({ role:"assistant", content: `## Full solution\n\nApplying ${algoName} algorithm: ${summary}` });
  S.solved = true;
  analyticsEnd("solved");
  S.mst = null;
  render();
}

function mstTryChoose(i){
  const st = S.mst;
  if (!st || st.chosen.includes(i)) return;
  const { valid, reasonFor } = mstValidChoices();
  if (valid.has(i)){
    st.chosen.push(i);
    st.feedback = null;
    st.hinted = null;
    mstCheckDone();
  } else {
    st.feedback = { kind:"error", text: reasonFor(i) };
  }
  render();
}

function mstShowHint(){
  const st = S.mst;
  const { valid } = mstValidChoices();
  st.hinted = valid;
  st.feedback = { kind:"hint", text: "The highlighted edge(s) are valid choices right now." };
  render();
}

function mstAutoStep(){
  const st = S.mst;
  const { valid } = mstValidChoices();
  if (!valid.size) return;
  const i = Math.min(...valid);
  const e = st.network.edges[i];
  const labelOf = id => { const v = st.network.vertices.find(v => v.id === id); return v ? v.label : id; };
  st.chosen.push(i);
  st.auto.push(i);
  st.hinted = null;
  st.feedback = { kind:"step", text: `${labelOf(e.from)}-${labelOf(e.to)} has weight ${e.weight}, the smallest available that doesn't create a cycle, so it's added next.` };
  mstCheckDone();
  render();
}

// The exercise's own diagram renderer: read-only vertex positions (already fixed by the earlier
// editable-network-check step), click-only edges, no dragging or text editing — a deliberately
// simpler sibling of renderNetworkPanel's editable canvas, not a reuse of it.
function renderMstExercise(el){
  const st = S.mst;
  const net = st.network;
  const X = v => PAD + v / 100 * (W - PAD * 2);
  const Y = v => PAD + v / 100 * (H - PAD * 2);
  const totalWeight = st.chosen.reduce((sum, i) => sum + (+net.edges[i].weight || 0), 0);
  const algoName = st.algorithm === "kruskal" ? "Kruskal's" : "Prim's";

  let body = "";
  net.edges.forEach((e, i) => {
    const a = net.vertices.find(v => v.id === e.from), b = net.vertices.find(v => v.id === e.to);
    if (!a || !b) return;
    const x1 = X(a.x), y1 = Y(a.y), x2 = X(b.x), y2 = Y(b.y), mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    const isChosen = st.chosen.includes(i);
    const isHinted = st.hinted && st.hinted.has(i);
    const stroke = isChosen ? "#c0392b" : (isHinted ? "#C59F40" : "#8a8a9a");
    const width = isChosen ? 4 : (isHinted ? 3 : 2);
    body += `<line data-eidx="${i}" x1="${num(x1)}" y1="${num(y1)}" x2="${num(x2)}" y2="${num(y2)}"
      stroke="${stroke}" stroke-width="${width}" style="cursor:${!st.done && !isChosen ? "pointer" : "default"}"/>`;
    body += txt(mx, my, String(e.weight), { size:13, weight:700, fill: isChosen ? "#c0392b" : C_AXIS, bg:"rgba(255,255,255,0.85)" });
  });
  net.vertices.forEach(v => {
    body += `<circle cx="${num(X(v.x))}" cy="${num(Y(v.y))}" r="20" fill="#fff" stroke="#4F2759" stroke-width="2"/>`;
    body += txt(X(v.x), Y(v.y) + 5, v.label, { size:14, weight:700, fill:"#4F2759" });
  });

  el.innerHTML = st.done ? `
    <h3 style="font-size:1.05rem">✓ Complete — minimum spanning tree found</h3>
    <p class="small">Here's the finished tree for ${algoName} algorithm.</p>
    <svg id="mstSvg" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:640px;height:auto">${body}</svg>
    <p style="font-weight:600">Total weight: ${totalWeight}</p>
    <div class="row">
      <button class="btn-primary" id="mstContinue" type="button">Continue</button>
    </div>` : `
    <h3 style="font-size:1.05rem">Applying ${algoName} algorithm</h3>
    <p class="small">Click the edge you think ${algoName} should add next.</p>
    <p class="small" style="font-style:italic">${esc(mstStepGuidance(st.algorithm))}</p>
    <svg id="mstSvg" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:640px;height:auto">${body}</svg>
    <p style="font-weight:600">Total weight so far: ${totalWeight}</p>
    ${st.feedback ? `<p class="${st.feedback.kind === "error" ? "err" : "small"}">${esc(st.feedback.text)}</p>` : ""}
    <div class="row">
      <button class="btn-secondary" id="mstHint" type="button">Hint</button>
      <button class="btn-quiet" id="mstStep" type="button">I'm stuck — show me this step</button>
    </div>`;

  if (st.done){
    document.getElementById("mstContinue").onclick = mstFinish;
  } else {
    document.querySelectorAll("#mstSvg [data-eidx]").forEach(lineEl => {
      const i = +lineEl.dataset.eidx;
      lineEl.onclick = () => mstTryChoose(i);
    });
    document.getElementById("mstHint").onclick = mstShowHint;
    document.getElementById("mstStep").onclick = mstAutoStep;
  }
}

function renderIntake(box){
  if (!box) return;
  // A pasted image (Ctrl+V into the ask box) calls takePhoto() directly without ever setting

  // photo" the whole time OCR is actually running in the background, with no sign anything is
  // happening at all.
  if (!S.showIntake && !S.intake && S.intakeBusy){

  }

      <div class="row" style="justify-content:space-between;align-items:center">

      </div>`;

    return;
  }
  if (S.showIntake && !S.intake){
    box.innerHTML = `
      <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:10px">
        <h3 style="font-size:1.03rem">Photograph a question</h3>

      </div>
      <p class="small">Fill the frame with the question. Flat page, no shadow across it.
         PNG or JPG.</p>
      <div class="row">
        <label class="btn-secondary" style="display:inline-block;margin:0">Choose a photo
          <input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" style="display:none"></label>
        ${HAS_CAMERA ? `<label class="btn-secondary" style="display:inline-block;margin:0">Take a photo
          <input id="cam" type="file" accept="image/*" capture="environment" style="display:none"></label>` : ""}
      </div>

    document.getElementById("closeIntake").onclick = () => {

    };
    ["file","cam"].forEach(id => {
      const input = document.getElementById(id);
      if (input) input.onchange = e => takePhoto(e.target.files[0]);
    });

  const tx = S.intake.tx;

  const note = {

  box.innerHTML = `
    <h3 style="font-size:1.03rem">Is this your question?</h3>
    <div class="review">
      <div><img src="${S.intake.dataUrl}" alt="The photo you took"></div>
      <div>
        <p class="conf-${conf}" style="font-size:.88rem">${note}</p>
        ${tx.unclear && tx.unclear.length ? `<div class="flag">Not certain about:

        <div class="readout" id="readout"></div>
        ${S.intakeEdit ? `<div style="margin-top:10px">
          <label for="edit">Correct the wording</label>
          <textarea id="edit" rows="6">${esc(tx.full_question || "")}</textarea>
        </div>` : ""}
      </div>
    </div>
    <div id="networkPanel"></div>
    <div class="row" style="margin-top:12px">
      <button class="btn-primary" id="useIt">Yes, answer it</button>
      <button class="btn-secondary" id="fix">${S.intakeEdit ? "Done editing" : "Something's wrong"}</button>
      <button class="btn-quiet" id="again">Another photo</button>
    </div>`;

  const readout = document.getElementById("readout");

    // whatever Claude would otherwise re-read from the photo.
    const networkBlock = networkConfirmText(S.intake.tx.network);
    const apiText = networkBlock ? v + "\n\n" + networkBlock : undefined;

    // Kruskal's/Prim's questions become a click-the-edge exercise instead of the usual chat
    // hints, whenever the confirmed network is actually usable for it (every edge weighted,
    // undirected, connected) — otherwise this falls through to the normal chat path unchanged.
    const algo = S.intake.tx.network_algorithm;
    const net = S.intake.tx.network;
    if ((algo === "kruskal" || algo === "prim") && mstExerciseUsable(net)){
      S.mst = {
        algorithm: algo,
        network: net,
        startVertex: algo === "prim" ? primStartVertex(net, v) : null,
        chosen: [], auto: [], hinted: null, feedback: null, done: false,
        questionText: v
      };
      S.intake = null; S.intakeEdit = false; S.showIntake = false;
      render();
      return;
    }

    S.intake = null; S.intakeEdit = false; S.showIntake = false;
    submit(v, true, shot, image, apiText);
  };

  renderNetworkPanel();
}

// Generates the next unused single-letter vertex label (A, B, ..., Z, then A2, B2, ...) so
// "+ Add vertex" never collides with an existing label.
function nextVertexLabel(vs){
  const used = new Set(vs.map(v => v.label));
  for (let round = 1; round < 30; round++){
    for (let i = 0; i < 26; i++){
      const candidate = round === 1 ? String.fromCharCode(65 + i) : String.fromCharCode(65 + i) + round;
      if (!used.has(candidate)) return candidate;
    }
  }
  return "V" + (vs.length + 1);
}

let networkIdSeq = 0;
function newVertexId(){ return "nv" + (networkIdSeq++); }

// Converts a pointer/click event's page position into the network editor's own 0-100 data space,
// using the SVG's live on-screen size (not its fixed viewBox pixel size) so this stays correct
// however the SVG is actually scaled by CSS. Clamped a little inside the edges so a vertex can
// never be dragged fully off the visible canvas.
function netToDataCoords(svgEl, clientX, clientY){
  const rect = svgEl.getBoundingClientRect();
  if (!rect.width || !rect.height) return { x:50, y:50 };
  const px = (clientX - rect.left) / rect.width * W;
  const py = (clientY - rect.top) / rect.height * H;
  return {
    x: Math.max(4, Math.min(96, (px - PAD) / (W - PAD * 2) * 100)),
    y: Math.max(4, Math.min(96, (py - PAD) / (H - PAD * 2) * 100))
  };
}

// Shared by every editable-network panel's drag handling: a vertex is dragged by its stable id,
// and the repaint function is whichever panel is currently on screen. Kept at module level (rather
// than re-attached inside renderNetworkPanel every time it runs) so these two listeners are
// attached exactly once for the app's whole lifetime — rebuilding the panel's own DOM constantly
// during a drag would otherwise mean re-attaching them on every repaint, risking duplicates.
let netDragVertex = null;
let netRepaint = null;
document.addEventListener("pointermove", e => {
  if (!netDragVertex) return;
  const svgEl = document.getElementById("netSvg");
  const net = S.intake && S.intake.tx && S.intake.tx.network;
  if (!svgEl || !net) return;
  const v = net.vertices.find(v => v.id === netDragVertex);
  if (!v) return;
  const { x, y } = netToDataCoords(svgEl, e.clientX, e.clientY);
  v.x = x; v.y = y;
  if (netRepaint) netRepaint();
});
document.addEventListener("pointerup", () => { netDragVertex = null; });

// Renders the editable vertex/edge check panel for a photographed network question, inside
// renderIntake()'s own #networkPanel container. Does nothing (clears the panel) when the current
// question isn't a network question or OCR returned no usable vertices — the existing text-only
// review flow is completely unaffected in that case. Editing happens directly on the diagram: drag
// a vertex to reposition it, click its letter or an edge's weight to retype it in place, and use
// "+ Add vertex"/"+ Add edge" to arm a click-to-place / click-two-vertices mode.
function renderNetworkPanel(){
  const panel = document.getElementById("networkPanel");
  if (!panel) return;
  const tx = S.intake && S.intake.tx;
  const net = tx && tx.network;
  if (!tx || !tx.is_network || !net || !Array.isArray(net.vertices) || !net.vertices.length){
    panel.innerHTML = "";
    return;
  }
  if (!Array.isArray(net.edges)) net.edges = [];

  // Auto-layout only a vertex that doesn't already have a position — never overwrite one OCR gave
  // us, or one the student has already dragged, on a later re-render of this same panel.
  net.vertices.forEach((v, i) => {
    if (v.x === undefined || v.x === null || v.y === undefined || v.y === null){
      const n = net.vertices.length || 1;
      v.x = 50 + 38 * Math.cos(2 * Math.PI * i / n);
      v.y = 50 + 38 * Math.sin(2 * Math.PI * i / n);
    }
  });

  panel.innerHTML = `
    <h4 style="margin:16px 0 6px">Check the network</h4>
    <p class="small">Check this matches the graph in your photo. Drag a vertex to move it, click a
      letter or a weight to retype it, or use the buttons below to add one.</p>
    <div id="netEditor" style="max-width:640px"></div>
    <div class="row" style="margin-top:8px;align-items:center">
      <button class="btn-quiet" id="addVertexBtn" type="button">+ Add vertex</button>
      <button class="btn-quiet" id="addEdgeBtn" type="button">+ Add edge</button>
      <span id="netHint" class="small"></span>
    </div>`;

  let mode = null;           // null | "addVertex" | { addEdgeFrom: id|null }
  let delTarget = null;      // { type:"vertex"|"edge", id|idx } — who the delete badge would remove

  const hintEl = document.getElementById("netHint");
  const setHint = msg => { hintEl.textContent = msg || ""; };
  const X = v => PAD + v / 100 * (W - PAD * 2);
  const Y = v => PAD + v / 100 * (H - PAD * 2);
  const at = id => net.vertices.find(v => v.id === id);

  // The delete badge is one reusable element, shown/moved by direct attribute writes rather than
  // by rebuilding the panel — a focus-triggered repaint would risk destroying the very input that
  // is in the middle of gaining or losing focus. Only deliberate, discrete actions (drag, add,
  // remove) go through the full paint() below.
  const showDeleteBadge = (type, key, cx, cy) => {
    delTarget = { type, key };
    const badge = document.getElementById("netDelBadge");
    if (!badge) return;
    badge.setAttribute("x", num(cx + 12));
    badge.setAttribute("y", num(cy - 26));
    badge.style.display = "";
  };
  const hideDeleteBadgeIfStill = (type, key) => {
    if (delTarget && delTarget.type === type && delTarget.key === key){
      delTarget = null;
      const badge = document.getElementById("netDelBadge");
      if (badge) badge.style.display = "none";
    }
  };

  const paint = () => {
    let body = "";
    net.edges.forEach((e, i) => {
      const a = at(e.from), b = at(e.to);
      if (!a || !b) return;
      const x1 = X(a.x), y1 = Y(a.y), x2 = X(b.x), y2 = Y(b.y), mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
      body += `<line x1="${num(x1)}" y1="${num(y1)}" x2="${num(x2)}" y2="${num(y2)}" stroke="#8a8a9a" stroke-width="2"/>`;
      body += `<foreignObject x="${num(mx - 28)}" y="${num(my - 13)}" width="56" height="26">
        <div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;align-items:center;justify-content:center;gap:2px">
          <input data-eidx="${i}" class="einput" type="number"
            value="${e.weight === undefined || e.weight === null ? "" : e.weight}" placeholder="wt"
            style="width:32px;border:1px solid #ccc;border-radius:4px;font-size:12px;text-align:center;background:#fff;padding:1px">
          <button data-eidx="${i}" class="edirbtn" type="button" title="Click to mark this edge directed"
            style="border:none;background:none;cursor:pointer;font-size:13px;padding:0;color:#7a4a86">${e.directed ? "→" : "—"}</button>
        </div>
      </foreignObject>`;
    });
    net.vertices.forEach(v => {
      const cx = X(v.x), cy = Y(v.y);
      const isPickTarget = mode && typeof mode === "object" && mode.addEdgeFrom === v.id;
      body += `<circle data-vid="${esc(v.id)}" class="vcircle" cx="${num(cx)}" cy="${num(cy)}" r="20"
        fill="#fff" stroke="${isPickTarget ? "#C59F40" : "#4F2759"}" stroke-width="${isPickTarget ? 3 : 2}"
        style="cursor:grab;touch-action:none"/>`;
      body += `<foreignObject x="${num(cx - 20)}" y="${num(cy - 13)}" width="40" height="26" style="pointer-events:none">
        <input data-vid="${esc(v.id)}" class="vinput" type="text" value="${esc(v.label)}" style="pointer-events:auto;
          width:100%;height:100%;border:none;background:transparent;text-align:center;font-size:14px;font-weight:600;color:#4F2759">
      </foreignObject>`;
    });
    // The delete badge itself — always present, hidden by default, repositioned by showDeleteBadge.
    body += `<foreignObject id="netDelBadge" x="0" y="0" width="22" height="22" style="display:none">
      <button xmlns="http://www.w3.org/1999/xhtml" type="button" id="netDelBadgeBtn" title="Remove"
        style="width:20px;height:20px;border-radius:50%;border:1px solid #b23b3b;background:#fff;color:#b23b3b;
        font-size:13px;line-height:1;cursor:pointer;padding:0">&times;</button>
    </foreignObject>`;

    const editor = document.getElementById("netEditor");
    editor.innerHTML = `<svg id="netSvg" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"
      style="width:100%;height:auto;touch-action:none">${body}</svg>`;
    netRepaint = paint;
    wire();
  };

  const removeVertex = vid => {
    net.vertices = net.vertices.filter(v => v.id !== vid);
    net.edges = net.edges.filter(e => e.from !== vid && e.to !== vid);
    delTarget = null;
    paint();
  };
  const removeEdge = idx => {
    net.edges.splice(idx, 1);
    delTarget = null;
    paint();
  };

  const wire = () => {
    const svgEl = document.getElementById("netSvg");

    svgEl.onclick = e => {
      if (e.target !== svgEl) return; // a real click on empty canvas, not one bubbling from a shape
      if (mode === "addVertex"){
        const { x, y } = netToDataCoords(svgEl, e.clientX, e.clientY);
        net.vertices.push({ id:newVertexId(), label:nextVertexLabel(net.vertices), x, y });
        mode = null; setHint("");
        paint();
      } else if (mode && typeof mode === "object"){
        mode = null; setHint(""); paint();
      }
    };

    svgEl.querySelectorAll(".vcircle").forEach(circle => {
      const vid = circle.dataset.vid;
      circle.onpointerdown = e => {
        e.preventDefault();
        if (mode && typeof mode === "object"){
          if (mode.addEdgeFrom === null){
            mode.addEdgeFrom = vid; paint();
          } else if (mode.addEdgeFrom === vid){
            mode = null; setHint(""); paint();
          } else {
            net.edges.push({ from:mode.addEdgeFrom, to:vid, weight:"", directed:false });
            mode = null; setHint(""); paint();
          }
          return;
        }
        netDragVertex = vid;
        const v = at(vid);
        showDeleteBadge("vertex", vid, circle.getAttribute("cx"), circle.getAttribute("cy"));
      };
    });

    svgEl.querySelectorAll(".vinput").forEach(input => {
      const vid = input.dataset.vid;
      input.oninput = () => { const v = at(vid); if (v) v.label = input.value; };
      input.onfocus = () => {
        const c = svgEl.querySelector(`.vcircle[data-vid="${vid}"]`);
        if (c) showDeleteBadge("vertex", vid, c.getAttribute("cx"), c.getAttribute("cy"));
      };
      input.onblur = () => setTimeout(() => hideDeleteBadgeIfStill("vertex", vid), 120);
    });

    svgEl.querySelectorAll(".einput").forEach(input => {
      const i = +input.dataset.eidx;
      input.oninput = () => {
        net.edges[i].weight = input.value === "" ? "" : +input.value;
      };
      input.onfocus = () => {
        const e = net.edges[i], a = at(e.from), b = at(e.to);
        if (a && b) showDeleteBadge("edge", i, (X(a.x) + X(b.x)) / 2, (Y(a.y) + Y(b.y)) / 2);
      };
      input.onblur = () => setTimeout(() => hideDeleteBadgeIfStill("edge", i), 120);
    });

    svgEl.querySelectorAll(".edirbtn").forEach(btn => {
      const i = +btn.dataset.eidx;
      btn.onclick = () => {
        net.edges[i].directed = !net.edges[i].directed;
        btn.textContent = net.edges[i].directed ? "→" : "—";
      };
    });

    const delBadgeBtn = document.getElementById("netDelBadgeBtn");
    if (delBadgeBtn){
      // preventDefault on mousedown stops the currently-focused input from ever blurring when this
      // badge is clicked, so there is no race between a delayed blur-driven hide and this click.
      delBadgeBtn.onmousedown = e => e.preventDefault();
      delBadgeBtn.onclick = () => {
        if (!delTarget) return;
        if (delTarget.type === "vertex") removeVertex(delTarget.key);
        else removeEdge(delTarget.key);
      };
    }
  };

  paint();

  document.getElementById("addVertexBtn").onclick = () => {
    mode = "addVertex";
    setHint("Click on the diagram where the new vertex should go.");
  };
  document.getElementById("addEdgeBtn").onclick = () => {
    if (net.vertices.length < 2) { setHint("Add at least 2 vertices first."); return; }
    mode = { addEdgeFrom:null };
    setHint("Click the first vertex, then the second, to connect them. Click empty space to cancel.");
    paint();
  };
}

function takePhoto(file){
  if (!file) return;
  if (file.size > 5 * 1024 * 1024){
    S.intakeError = "That image is too large. Take the photo again at a smaller size."; render(); return;
  }
  const reader = new FileReader();
  reader.onload = async () => {
    const dataUrl = reader.result, b64 = String(dataUrl).split(",")[1];
    const mime = (file.type && file.type.startsWith("image/")) ? file.type : "image/jpeg";
    if (!["image/png","image/jpeg","image/webp","image/gif"].includes(mime)){
      S.intakeError = "That kind of image cannot be read. Use a PNG or JPG."; render(); return;
    }
    S.intakeBusy = true; S.intakeError = ""; render();
    try {
      const raw = await callClaude(
        OCR_SYSTEM + "\n\nContext for notation only, not for correction:\n" + courseContext(S.courseKey),
        [{ role:"user", content:[
          { type:"image", source:{ type:"base64", media_type:mime, data:b64 } },
          { type:"text", text:"Transcribe this. JSON only." }] }], 2000, "ocr");
      S.intake = { dataUrl, mime, b64, tx: parseJsonReply(raw) };
    } catch (err){ S.intakeError = err.message; }
    S.intakeBusy = false; render();
  };
  reader.onerror = () => { S.intakeError = "That file could not be opened."; render(); };
  reader.readAsDataURL(file);
}

// A photo of the student's own attempt, sent as part of the live dialogue
// (unlike takePhoto/readMarkedWork, which are one-off calls) — the image
// stays in S.messages and is sent to Claude alongside every later turn's
// history, so it goes through submit() like any other reply.
function sendAttemptPhoto(file){
  if (!file) return;
  if (file.size > 5 * 1024 * 1024){
    S.attemptError = "That image is too large. Take the photo again at a smaller size."; render(); return;
  }
  const reader = new FileReader();
  reader.onload = () => {
    const dataUrl = reader.result, b64 = String(dataUrl).split(",")[1];
    const mime = (file.type && file.type.startsWith("image/")) ? file.type : "image/jpeg";
    if (!["image/png","image/jpeg","image/webp","image/gif"].includes(mime)){
      S.attemptError = "That kind of image cannot be read. Use a PNG or JPG."; render(); return;
    }
    // Only reachable from the "show me the solution" panel, so this always
    // asks for the full solution once the attempt has been looked at —
    // there's no other route into sendAttemptPhoto that wants just a hint.
    submit("Here's a photo of my attempt so far. " + JUST_SHOW_ME, true, dataUrl, { mime, b64 });
  };
  reader.onerror = () => { S.attemptError = "That file could not be opened."; render(); };
  reader.readAsDataURL(file);
}

/* --- Save as PDF ----------------------------------------------------- *
 * A sandboxed frame blocks file downloads, so the export goes through the
 * browser's own print dialog, where "Save as PDF" is a destination. That
 * route also keeps KaTeX as real vector text rather than a screenshot,
 * which a canvas-to-image PDF would not.
 * ------------------------------------------------------------------ */

function printable(title, innerHtml){
  const c = courseOf(S.courseKey);
  const when = new Date().toLocaleDateString("en-AU",
    { day:"numeric", month:"long", year:"numeric" });
  return `
    <div class="p-head">
      <h1>${esc(title)}</h1>
      <div class="who">${c.key ? esc(c.name) + " &nbsp;·&nbsp; " : ""}${esc(when)}</div>
    </div>
    ${innerHtml}
    <p class="p-foot">MathWISE — Wesley College Mathematics. Check the working; it can get things wrong.</p>`;
}

function saveAsPdf(title, innerHtml, fallbackText){
  const area = document.getElementById("printarea");
  if (!area){ offerCopy(title, fallbackText); return; }
  area.innerHTML = printable(title, innerHtml);
  typesetIn(area);
  // Let KaTeX finish laying out before the dialog freezes the page.
  setTimeout(() => {
    try {
      if (typeof window.print !== "function") throw new Error("no print");
      window.print();
    } catch (e){
      offerCopy(title, fallbackText);
    }
    // Don't leave it sitting there: a later Ctrl+P would print this instead
    // of whatever the student is looking at by then.
    setTimeout(() => { area.innerHTML = ""; }, 400);
  }, 120);
}

/* --- Copying things out ---------------------------------------------- *
 * This app runs in a sandboxed frame, where a file download is blocked
 * before it starts. So nothing is "saved" — the text is put on screen to
 * be copied into wherever the student actually keeps their work.
 * ------------------------------------------------------------------ */

function offerCopy(title, text){
  S.copyTitle = title;
  S.copyText = text;
  S.copyDone = false;
  render();
  const box = document.getElementById("copytext");
  if (box && box.scrollIntoView) box.scrollIntoView({ block:"nearest" });
}

function copyPanelHtml(){
  if (!S.copyText) return "";
  return `
    <div class="copybox">
      <h4>${esc(S.copyTitle)}</h4>
      <p>Copy this into your notes, a document or an email. Downloads don't work
         inside this app, so the text is here instead.</p>
      <textarea id="copytext" readonly>${esc(S.copyText)}</textarea>
      <div class="row" style="margin-top:10px">
        <button class="btn-primary" id="copybtn">Copy it all</button>
        <button class="btn-quiet" id="copyclose">Close</button>
        ${S.copyDone ? '<p class="done" style="align-self:center">Copied.</p>' : ""}
      </div>
    </div>`;
}

function wireCopyPanel(){
  const btn = document.getElementById("copybtn");
  if (btn) btn.onclick = async () => {
    const box = document.getElementById("copytext");
    if (!box) return;
    box.select();
    box.setSelectionRange(0, box.value.length);
    let ok = false;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText){
        await navigator.clipboard.writeText(box.value);
        ok = true;
      }
    } catch (e){ ok = false; }
    if (!ok){
      try { ok = document.execCommand("copy"); } catch (e){ ok = false; }
    }
    S.copyDone = ok;
    render();
    const again = document.getElementById("copytext");
    if (again && !ok){ again.focus(); again.select(); }
  };
  const close = document.getElementById("copyclose");
  if (close) close.onclick = () => {
    S.copyTitle = ""; S.copyText = ""; S.copyDone = false; render();
  };
}

/* --- Mind maps ------------------------------------------------------- *
 * A map is a revision resource, so each branch carries a description, the
 * results worth memorising, a worked example and sometimes a diagram. The
 * ring at the top is the overview; the cards below are the substance.
 * ------------------------------------------------------------------ */

function renderMindMap(spec){
  if (!spec || !Array.isArray(spec.branches) || !spec.branches.length){
    return '<p class="err">That map came back empty. Try building it again.</p>';
  }
  let html = `
    <div class="mm-head">
      <h3>${esc(spec.centre || "Mind map")}</h3>
      ${spec.summary ? `<p>${esc(spec.summary)}</p>` : ""}
    </div>
    ${renderFigure({ ...spec, type:"mindmap", title:null })}`;

  spec.branches.slice(0, 5).forEach((b, i) => {
    const key = Array.isArray(b.key) ? b.key : (b.key ? [b.key] : []);
    const kids = Array.isArray(b.children) ? b.children : [];
    const eg = b.example && (b.example.question || b.example.steps) ? b.example : null;
    const steps = eg && Array.isArray(eg.steps) ? eg.steps : [];

    html += `
      <div class="mm-card">
        <h4><span class="num">${i + 1}</span>${esc(b.label || "")}</h4>
        ${b.description ? `<p class="desc">${esc(b.description)}</p>` : ""}

        ${key.length ? `<div class="mm-sec">
          <div class="lab">Worth knowing by heart</div>
          ${key.map(k => `<div class="mm-key">${esc(k)}</div>`).join("")}
        </div>` : ""}

        ${eg ? `<div class="mm-sec">
          <div class="lab">Worked example</div>
          <div class="mm-eg">
            ${eg.question ? `<div class="q">${esc(eg.question)}</div>` : ""}
            ${steps.length ? `<ol class="mm-steps">${steps.map(t => `<li>${esc(t)}</li>`).join("")}</ol>` : ""}
          </div>
        </div>` : ""}

        ${b.figure ? `<div class="mm-sec">
          <div class="lab">Picture it</div>
          ${renderFigure(b.figure)}
        </div>` : ""}

        ${kids.length ? `<div class="mm-sec">
          <div class="lab">You should be able to</div>
          <ul class="mm-do">${kids.map(c => `<li>${esc(c)}</li>`).join("")}</ul>
        </div>` : ""}
      </div>`;
  });
  return html;
}

function mindMapText(){
  const spec = S.mapSpec;
  let out = `# ${spec.centre || "Mind map"}\n\n`;
  if (spec.summary) out += `${spec.summary}\n\n`;
  (spec.branches || []).forEach((b, i) => {
    out += `## ${i + 1}. ${b.label || ""}\n\n`;
    if (b.description) out += `${b.description}\n\n`;
    if (b.key && b.key.length) out += `**Worth knowing by heart**\n\n` +
      b.key.map(k => `- ${k}`).join("\n") + "\n\n";
    if (b.example && b.example.question){
      out += `**Worked example**\n\n${b.example.question}\n\n`;
      (b.example.steps || []).forEach((t, k) => { out += `${k + 1}. ${t}\n`; });
      out += "\n";
    }
    if (b.children && b.children.length) out += `**You should be able to**\n\n` +
      b.children.map(c => `- ${c}`).join("\n") + "\n\n";
  });
  return out;
}

function printMindMap(){
  if (!S.mapSpec) return;
  saveAsPdf(S.mapSpec.centre || "Mind map", renderMindMap(S.mapSpec), mindMapText());
}

function copyMindMap(){
  if (!S.mapSpec) return;
  offerCopy(S.mapSpec.centre ? `Mind map: ${S.mapSpec.centre}` : "Your mind map", mindMapText());
}

function renderSkills(el){
  const band = STUDY_SKILLS[S.skillsBand] ? S.skillsBand : "MYP";
  const set = STUDY_SKILLS[band];
  const bands = [...new Set(COURSES.filter(x => x.band).map(x => x.band))];
  const topics = topicsFor(S.mapCourse);
  if (S.mapTopic !== "__other" && !topics.includes(S.mapTopic)) S.mapTopic = topics[0] || "";
  el.innerHTML = `
    <div class="row" style="margin-bottom:6px">
      ${BANDS.map(b => `<button class="${b === band ? "btn-secondary" : "btn-quiet"}" data-band="${esc(b)}">${esc(b)}</button>`).join("")}
    </div>
    <p class="muted">${esc(set.label)}. Written against ${esc(set.frame)}.</p>
    ${set.items.map(item => `
      <div class="skill">
        <h4>${esc(item.title)}</h4>
        <p>${esc(item.body)}</p>
        <ul>${item.points.map(p => `<li>${esc(p)}</li>`).join("")}</ul>
        ${item.tie ? `<div class="tie">${esc(item.tie)}</div>` : ""}
      </div>`).join("")}

    <div class="skill" style="border-top-color:var(--gold)">
      <h4>Mind map builder</h4>
      <p>Pick your year level and a topic, then redraw the map by hand from memory
         afterwards. That second step is where the learning happens.</p>
      <div class="row" style="align-items:flex-end">
        <div style="flex:1;min-width:180px">
          <label for="mapcourse">Year level or course</label>
          <select id="mapcourse">
            ${bands.map(b => `<optgroup label="${esc(b)}">
              ${COURSES.filter(x => x.band === b).map(x =>
                `<option value="${x.key}" ${x.key === S.mapCourse ? "selected" : ""}>${esc(x.name)}</option>`).join("")}
            </optgroup>`).join("")}
          </select>
        </div>
        <div style="flex:1;min-width:200px">
          <label for="maptopic">Topic</label>
          <select id="maptopic">
            ${topics.map(t => `<option value="${esc(t)}" ${t === S.mapTopic ? "selected" : ""}>${esc(t)}</option>`).join("")}
            <option value="__other" ${S.mapTopic === "__other" ? "selected" : ""}>Something else…</option>
          </select>
        </div>
      </div>
      ${S.mapTopic === "__other" ? `
        <div class="field" style="margin-top:12px">
          <label for="mapcustom">Type your topic</label>
          <input id="mapcustom" type="text" placeholder="e.g. Simultaneous equations" value="${esc(S.mapCustom)}">
        </div>` : ""}
      <div class="row" style="margin-top:12px">
        <button class="btn-primary" id="makemap" ${S.mapBusy ? "disabled" : ""}>${S.mapBusy ? "Drawing…" : "Build the map"}</button>
      </div>
      ${S.mapError ? `<p class="err" style="margin-top:10px">${esc(S.mapError)}</p>` : ""}
    </div>
    <div id="mapOut">${S.mapSpec ? renderMindMap(S.mapSpec) : ""}</div>
    ${S.mapSpec ? `<div class="row" style="margin-bottom:20px">
      <button class="btn-secondary" id="mappdf">Save as PDF</button>
      <button class="btn-quiet" id="mapsave">Copy as text</button></div>` : ""}`;

  el.querySelectorAll("[data-band]").forEach(b =>
    b.onclick = () => { S.skillsBand = b.dataset.band; render(); });

  const courseSel = document.getElementById("mapcourse");
  if (courseSel) courseSel.onchange = () => {
    S.mapCourse = courseSel.value;
    S.mapTopic = topicsFor(S.mapCourse)[0] || "";
    S.mapSpec = null; render();
  };
  const topicSel = document.getElementById("maptopic");
  if (topicSel) topicSel.onchange = () => { S.mapTopic = topicSel.value; render(); };
  const custom = document.getElementById("mapcustom");
  if (custom) custom.oninput = () => { S.mapCustom = custom.value; };

  const make = document.getElementById("makemap");
  if (make) make.onclick = async () => {
    const t = S.mapTopic === "__other" ? S.mapCustom.trim() : S.mapTopic;
    if (!t || S.mapBusy) return;
    S.mapBusy = true; S.mapError = ""; S.mapSpec = null; render();
    try {
      const raw = await callClaude(
        MINDMAP_SYSTEM + "\n\n" + courseContext(S.mapCourse),
        [{ role:"user", content:"Build a mind map for: " + t }], 4000, "mindmap");
      const spec = parseJsonReply(raw);
      spec.type = "mindmap";
      if (!spec.centre) spec.centre = t;
      S.mapSpec = spec;
    } catch (err){ S.mapError = err.message; }
    S.mapBusy = false; render();
  };

  const mapsave = document.getElementById("mapsave");
  if (mapsave) mapsave.onclick = copyMindMap;
  const mappdf = document.getElementById("mappdf");
  if (mappdf) mappdf.onclick = printMindMap;
  typesetIn(document.getElementById("mapOut"));
}

/* --- Study tools ----------------------------------------------------- */

const CT_STEPS = [
  { cls:"ct-green",  n:"1", title:"Know what you know",
    body:"Highlight the questions you got right in green. You understand these, so they need less repeat practice." },
  { cls:"ct-orange", n:"2", title:"Know what you think you knew",
    body:"Highlight the ones you got wrong in orange. These are the silly mistakes, and the ones you thought you knew but hadn't practised enough." },
  { cls:"ct-red",    n:"3", title:"Know what you don't know",
    body:"Highlight the ones you got wrong and don't understand in red. These need help: textbook, internet, parents, friends, teacher." },
  { cls:"ct-blue",   n:"4", title:"Reflect",
    body:"Think about what the colours are telling you, then do it again for your next test and even your homework." }
];

const HELPERS = ["Textbook", "Internet", "Parents", "Friends", "Teacher"];

const PENDING_TOOLS = [
  { title:"Network Studio",

    stage:"Next to be built" },
  { title:"Past exam questions",

    stage:"Still to come" }
];

        ${HAS_CAMERA ? `<label class="btn-secondary" style="display:inline-block;margin:0">Take a photo

        ${S.fbItems.length ? `

      ${S.fbItems.length ? `<p class="fb-count">${S.fbItems.length} piece${S.fbItems.length === 1 ? "" : "s"} of work read so far. Newest first.</p>` : ""}

    <div class="skill" style="border-top-color:var(--gold)">

      <div class="ct-steps">
        ${CT_STEPS.map(step => `

      <div class="ct-counts">

        <div><label for="cto">Orange questions</label>
          <input id="cto" type="text" inputmode="numeric" placeholder="how many" value="${esc(S.ct.orange)}"></div>
        <div><label for="ctr">Red questions</label>

      </div>

function fbListHtml(){
  return S.fbItems.map((item, i) => `
    <div class="fb-item">
      <div class="stamp">
        <span><span class="n">${S.fbItems.length - i}.</span> ${esc(item.when)}${item.course ? " · " + esc(item.course) : ""}</span>
        <button class="btn-quiet" data-drop="${esc(item.id)}">Remove</button>
      </div>
      ${item.image ? `<img src="${item.image}" alt="Marked work you uploaded">` : ""}
      ${markup(item.result)}
      <div style="clear:both"></div>
    </div>`).join("");
}

function readMarkedWork(file){
  if (!file) return;
  if (file.size > 5 * 1024 * 1024){
    S.fbError = "That image is too large. Take the photo again at a smaller size."; render(); return;
  }
  const reader = new FileReader();
  reader.onload = async () => {
    const dataUrl = reader.result, b64 = String(dataUrl).split(",")[1];
    const mime = (file.type && file.type.startsWith("image/")) ? file.type : "image/jpeg";
    if (!["image/png","image/jpeg","image/webp","image/gif"].includes(mime)){
      S.fbError = "That kind of image cannot be read. Use a PNG or JPG."; render(); return;
    }
    S.fbBusy = true; S.fbError = ""; render();
    try {
      const result = await callClaude(
        FEEDBACK_SYSTEM + "\n\n" + courseContext(S.courseKey),
        [{ role:"user", content:[
          { type:"image", source:{ type:"base64", media_type:mime, data:b64 } },
          { type:"text", text:"This is my marked work. What does it show and what should I do next?" }] }],
        1200, "feedback");
      // Newest first, and every earlier reading stays exactly where it was.
      S.fbItems.unshift({
        id: String(Date.now()) + Math.random().toString(36).slice(2, 7),
        image: dataUrl,
        result,
        course: courseOf(S.courseKey).key ? courseOf(S.courseKey).name : "",
        when: new Date().toLocaleString("en-AU",
          { day:"numeric", month:"short", hour:"numeric", minute:"2-digit" })
      });
    } catch (err){ S.fbError = err.message; }
    S.fbBusy = false; render();
  };
  reader.onerror = () => { S.fbError = "That file could not be opened."; render(); };
  reader.readAsDataURL(file);
}

function feedbackText(){
  let out = "# Feedback on marked work\n\n";
  S.fbItems.slice().reverse().forEach((item, i) => {
    out += `## ${i + 1}. ${item.when}${item.course ? " — " + item.course : ""}\n\n${item.result}\n\n`;
  });
  return out;
}

function feedbackHtml(){
  return S.fbItems.slice().reverse().map((item, i) => `
    <div class="fb-item">
      <div class="stamp"><span class="n">${i + 1}.</span> ${esc(item.when)}${item.course ? " · " + esc(item.course) : ""}</div>
      ${markup(item.result)}
    </div>`).join("");
}

function printFeedback(){
  if (!S.fbItems.length) return;
  saveAsPdf("Feedback on marked work", feedbackHtml(), feedbackText());
}

function copyFeedback(){
  if (!S.fbItems.length) return;
  offerCopy("Your feedback on marked work", feedbackText());
}

function colourTherapySummary(){
  const c = S.ct;
  return [
    `Green (right): ${c.green || "not counted"}`,
    `Orange (wrong, slips or not enough practice): ${c.orange || "not counted"}`,
    `Red (wrong, do not understand): ${c.red || "not counted"}`,
    `Orange topics: ${c.orangeTopics || "none listed"}`,
    `Red topics: ${c.redTopics || "none listed"}`,
    `Will ask: ${c.helpers.length ? c.helpers.join(", ") : "no one chosen yet"}`,
    `Other notes: ${c.note || "none"}`
  ].join("\n");
}

async function colourPlan(){
  const c = S.ct;
  if (!c.green && !c.orange && !c.red && !c.orangeTopics && !c.redTopics){
    S.ctError = "Fill in your counts or your topics first, so there is something to work from.";
    render(); return;
  }
  S.ctBusy = true; S.ctError = ""; S.ctPlan = ""; render();
  try {
    S.ctPlan = await callClaude(
      COLOUR_PLAN_SYSTEM + "\n\n" + courseContext(S.courseKey),
      [{ role:"user", content:"My Colour Therapy reflection:\n\n" + colourTherapySummary() }], 800, "colour-plan");
  } catch (err){ S.ctError = err.message; }
  S.ctBusy = false; render();
}

function reflectionText(){
  const c = courseOf(S.courseKey);
  let out = `# Colour Therapy reflection${c.key ? " — " + c.name : ""}\n\n`;
  out += `${new Date().toLocaleDateString("en-AU")}\n\n`;
  out += colourTherapySummary() + "\n";
  if (S.ctPlan) out += `\n## What to do next\n\n${S.ctPlan}\n`;
  if (S.fbItems.length) out += "\n" + feedbackText().replace(/^# /, "## ");
  return out;
}

function reflectionHtml(){
  const c = S.ct;
  const row = (label, value) => `<tr><td style="padding:4px 14px 4px 0;color:#555">${esc(label)}</td>
    <td style="padding:4px 0"><strong>${esc(value || "—")}</strong></td></tr>`;
  let html = `<table style="border-collapse:collapse;margin-bottom:14px">
    ${row("Green — right", c.green)}
    ${row("Orange — slips or not enough practice", c.orange)}
    ${row("Red — did not understand", c.red)}
    ${row("Orange topics", c.orangeTopics)}
    ${row("Red topics", c.redTopics)}
    ${row("Will ask", c.helpers.join(", "))}
    ${row("Other notes", c.note)}
  </table>`;
  if (S.ctPlan) html += `<h3>What to do next</h3>${markup(S.ctPlan)}`;
  if (S.fbItems.length) html += `<h3>Feedback on marked work</h3>${feedbackHtml()}`;
  return html;
}

function printReflection(){
  saveAsPdf("Colour Therapy reflection", reflectionHtml(), reflectionText());
}

function copyReflection(){ offerCopy("Your Colour Therapy reflection", reflectionText()); }

/* --- Self-check ------------------------------------------------------- *
 * Runs only with ?selftest=1 in the address. Pure functions only: no
 * network. Prints a pass/fail list into the page instead of rendering the
 * app. This is the only automated coverage the browser code has, so run it
 * after every change in here.
 * ------------------------------------------------------------------ */

function runSelfTest(){
  const results = [];
  const check = (name, actual, expected) => {
    const pass = JSON.stringify(actual) === JSON.stringify(expected);
    results.push({ name, pass, actual, expected });
  };

  check("classify: quadratic question in Year 10 Standard",
    classifyTopic("How do I factorise x^2 + 5x + 6?", "myp10s"),
    "Expanding and factorising quadratics");
  check("classify: gradient question falls to the keyword map",
    classifyTopic("what is the gradient of this line", "aa_sl"),
    "Linear relationships");
  check("classify: nonsense is Unclassified",
    classifyTopic("zzzz qqqq", "myp7"),
    "Unclassified");
  check("classify: empty text is Unclassified",
    classifyTopic("", "myp7"),
    "Unclassified");

  const rec = buildRecord({
    course: "gen34", startedAt: 1000, endedAt: 121000, turns: 4,
    outcome: "solved", rating: "up", tokensIn: 120, tokensOut: 340, cost: 0.0123,
    topic: "Matrices"
  });
  check("record: band derived from course", rec.band, "VCE");
  check("record: seconds from timestamps", rec.seconds, 120);
  check("record: outcome carried", rec.outcome, "solved");
  check("record: no course means none", buildRecord({ course:"", startedAt:0, endedAt:0 }).band, "none");
  check("record: carries no free text", Object.keys(rec).includes("text"), false);

  // Lifecycle: start, count turns, end once and once only.
  analyticsEnd("switched");                       // clear any stray open session
  const before = loadLocalEvents().length;
  analyticsStart("factorise x^2 + 5x + 6");
  check("lifecycle: session opens", AS !== null, true);
  AS.turns = 3;
  analyticsEnd("solved");
  const after = loadLocalEvents();
  check("lifecycle: one record written", after.length, before + 1);
  check("lifecycle: outcome recorded", after[after.length - 1].outcome, "solved");
  check("lifecycle: turns recorded", after[after.length - 1].turns, 3);
  check("lifecycle: session closed", AS, null);
  analyticsEnd("closed");
  check("lifecycle: second end is ignored", loadLocalEvents().length, before + 1);

  const pass = results.filter(r => r.pass).length;
  document.getElementById("root").innerHTML =
    `<div style="font:14px/1.6 Figtree,system-ui;padding:24px;max-width:760px">
      <h2>MathWISE self-check</h2>
      <p><strong>${pass} of ${results.length} passed.</strong></p>
      <ul>${results.map(r => `<li style="color:${r.pass ? "#2b7a3f" : "#b3261e"}">
        ${r.pass ? "PASS" : "FAIL"} - ${esc(r.name)}
        ${r.pass ? "" : `<br><small>got ${esc(JSON.stringify(r.actual))},
          expected ${esc(JSON.stringify(r.expected))}</small>`}</li>`).join("")}</ul>
    </div>`;
}

/* --- Go -------------------------------------------------------------- */

// A closing tab is the clearest abandonment signal there is. keepalive on the
// send is what lets the request finish while the page tears down.
window.addEventListener("pagehide", () => analyticsEnd("closed"));
// Any click anywhere in the app counts as a sign of life for the idle clock.
document.addEventListener("click", () => analyticsTouch(), true);
window.addEventListener("focus", () => analyticsTouch());
// Anything stranded by a closed laptop or a dropped connection goes now.
flushOutbox();

if (new URLSearchParams(location.search).get("selftest") === "1") runSelfTest();
else render();
</script>
